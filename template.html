<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keitaro • Pulse</title>
<style>
  :root{
    --bg:#0e131f; --bg2:#131a29;
    --panel:rgba(24,31,46,.72); --panel-solid:#181f2e; --elev:#212a3e;
    --border:rgba(72,88,124,.32); --border-hi:rgba(79,157,255,.45);
    --fg:#e9edf6; --dim:#98a3ba; --faint:#5f6b83;
    --blue:#4f9dff; --cyan:#38d6e0; --green:#48d597; --gold:#f4b73d; --red:#f2565b; --purple:#b578f0;
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,"Segoe UI",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(at 18% -5%, rgba(59,110,220,.20) 0, transparent 45%),
      radial-gradient(at 88% 108%, rgba(40,190,200,.14) 0, transparent 45%);
    background-attachment:fixed; min-height:100vh;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  a{color:var(--blue);text-decoration:none}

  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(14,19,31,.97),rgba(14,19,31,.86));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border); padding:12px 22px;
  }
  .hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hrow+.hrow{margin-top:11px}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--cyan));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b1018;font-size:18px;
    box-shadow:0 0 22px rgba(79,157,255,.4)}
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
  .meta{font-size:11px;color:var(--faint);text-align:right;line-height:1.5;margin-left:auto}
  .meta b{color:var(--dim);font-weight:600}

  .seg{display:inline-flex;background:var(--panel-solid);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg button{background:transparent;border:0;color:var(--dim);font:inherit;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:7px;cursor:pointer;transition:.15s;white-space:nowrap}
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:linear-gradient(135deg,var(--blue),#3a7fe0);color:#08101f;box-shadow:0 2px 10px rgba(79,157,255,.35)}
  .seg.alt button.on{background:linear-gradient(135deg,var(--purple),#8a5be0)}
  .seg.tm button.on{background:linear-gradient(135deg,var(--green),#2fae76);color:#08130d}
  .chip.tm{background:rgba(72,213,151,.13);color:var(--green);border-color:rgba(72,213,151,.28)}
  select.day{background:var(--panel-solid);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:12.5px;
    padding:7px 11px;border-radius:9px;cursor:pointer}
  select.day:focus{outline:none;border-color:var(--border-hi)}

  .flabel{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-right:-4px}
  input.fq{background:var(--panel-solid);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:13px;
    padding:8px 13px;border-radius:9px;min-width:260px;flex:1;max-width:420px}
  input.fq:focus{outline:none;border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(79,157,255,.12)}
  #fchip{margin-left:auto;display:flex;align-items:center;gap:8px}
  .active-chip{display:inline-flex;align-items:center;gap:9px;font-size:12px;
    background:rgba(79,157,255,.12);border:1px solid var(--border-hi);border-radius:20px;padding:5px 6px 5px 13px;font-weight:600}
  .active-chip.brand{background:rgba(181,120,240,.14);border-color:rgba(181,120,240,.5)}
  .active-chip .x{cursor:pointer;width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.08);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg)}
  .active-chip .x:hover{background:var(--red);color:#fff}
  .active-chip .cnt{color:var(--dim);font-weight:500;font-size:11px}

  main{padding:18px 22px 60px;max-width:1500px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);
    padding:15px 16px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue))}
  .kpi .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpi .val{font-size:26px;font-weight:700;margin-top:7px;line-height:1}
  .kpi .dl{font-size:11.5px;margin-top:7px;font-weight:600;display:flex;align-items:center;gap:5px}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--faint)}

  .grid{display:grid;gap:16px;margin-bottom:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:2fr 1fr}
  @media(max-width:1050px){.g2,.g3{grid-template-columns:1fr}}
  .panel{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px}
  .panel h2{font-size:13.5px;margin:0;font-weight:700;letter-spacing:.2px}
  .panel .psub{font-size:11.5px;color:var(--dim);margin-top:2px}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
  .tag-all{font-size:10px;color:var(--faint);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-weight:600;white-space:nowrap}

  .tools{display:flex;gap:8px;align-items:center}
  input.search{background:var(--bg2);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:12px;
    padding:6px 10px;border-radius:8px;width:140px}
  input.search:focus{outline:none;border-color:var(--border-hi)}
  .tbl-wrap{overflow:auto;margin:0 -4px;max-height:460px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 9px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    cursor:pointer;user-select:none;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel-solid);z-index:1}
  th:hover{color:var(--fg)}
  th.sorted::after{content:" ↓";color:var(--blue)}
  th.sorted.asc::after{content:" ↑"}
  tbody tr{border-bottom:1px solid rgba(72,88,124,.14);cursor:pointer}
  tbody tr:hover{background:rgba(79,157,255,.07)}
  tbody tr.nolink{cursor:default}
  td .site{font-weight:600;color:var(--fg)}
  .chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600;
    background:rgba(79,157,255,.14);color:var(--blue);border:1px solid rgba(79,157,255,.25)}
  .chip.geo{background:rgba(56,214,224,.13);color:var(--cyan);border-color:rgba(56,214,224,.25)}
  .conv-badge{color:var(--gold);font-weight:700}
  .zero{color:var(--faint)}
  .bar-cell{position:relative}
  .bar-cell .bar{position:absolute;left:0;top:50%;transform:translateY(-50%);height:60%;border-radius:3px;opacity:.16;background:var(--blue);z-index:0}
  .bar-cell span{position:relative;z-index:1}
  .emptycell{color:var(--faint);padding:18px 6px}

  .dist{display:flex;flex-direction:column;gap:9px}
  .dist .row{display:flex;align-items:center;gap:11px}
  .dist .name{width:130px;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
  .dist .track{flex:1;height:8px;background:var(--bg2);border-radius:5px;overflow:hidden}
  .dist .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
  .dist .v{width:92px;text-align:right;font-size:12px;color:var(--dim)}
  .dist-head{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);text-transform:uppercase;
    letter-spacing:.5px;font-weight:700;padding-bottom:7px;margin-bottom:3px;border-bottom:1px solid var(--border)}
  .drow{cursor:pointer;border-radius:7px;transition:background .12s}
  .drow:hover{background:rgba(79,157,255,.09)}
  .drow.sel{background:rgba(181,120,240,.16);box-shadow:inset 2px 0 0 var(--purple)}
  .sublabel{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin:2px 0}

  .foot{color:var(--faint);font-size:11px;text-align:center;margin-top:26px}
  .empty{max-width:620px;margin:14vh auto;text-align:center;background:var(--panel);border:1px solid var(--border);
    border-radius:18px;padding:40px 34px}
  .empty h1{font-size:22px;margin:0 0 6px}
  .empty code{background:var(--bg2);padding:3px 9px;border-radius:6px;font-family:var(--mono);color:var(--cyan);font-size:14px}
  .empty p{color:var(--dim);line-height:1.7}

  .chart-wrap{position:relative}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:rgba(16,22,35,.96);border:1px solid var(--border-hi);
    border-radius:9px;padding:8px 11px;font-size:11.5px;line-height:1.6;opacity:0;transition:opacity .1s;
    box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5;white-space:nowrap}
  .tip b{color:var(--fg)} .tip .k{color:var(--dim)}
  .legend{display:flex;gap:16px;font-size:11.5px;color:var(--dim);margin-top:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .hint{font-size:11px;color:var(--faint);margin-top:10px;text-align:center}

  /* ── динаміка: картки команд, дайджест, рух брендів ─────────────────────── */
  .tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-bottom:16px}
  .tcard{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px 10px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
  .tcard:hover{transform:translateY(-2px);border-color:var(--border-hi)}
  .tcard.on{border-color:rgba(72,213,151,.55);box-shadow:0 0 0 1px rgba(72,213,151,.22),0 8px 22px rgba(0,0,0,.28)}
  .tcard .tn{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.55px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tcard .tv{font-size:23px;font-weight:700;font-family:var(--mono);margin-top:6px;line-height:1}
  .tcard .tx{font-size:11px;color:var(--faint);margin-top:6px;display:flex;gap:9px;flex-wrap:wrap}
  .tcard .tx b{color:var(--dim);font-weight:600}
  .spark{display:block;width:100%;height:30px;margin-top:8px}
  .dchip{font-family:var(--mono);font-size:11.5px;font-weight:700;white-space:nowrap}

  .digest{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .digest li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;color:var(--dim)}
  .digest li .ic{flex-shrink:0;width:20px;text-align:center}
  .digest b{color:var(--fg);font-weight:600}
  .digest .q{cursor:pointer;border-bottom:1px dashed var(--border-hi);color:var(--fg);font-weight:600}
  .digest .q:hover{color:var(--blue);border-bottom-color:var(--blue)}

  .mv{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  @media(max-width:1050px){.mv{grid-template-columns:1fr}}
  .mvh{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px;
    margin-bottom:4px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .mvh span.n{color:var(--faint);font-weight:600;letter-spacing:0;text-transform:none}
  .mvrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;padding:7px 7px;border-radius:8px;cursor:pointer}
  .mvrow:hover{background:rgba(79,157,255,.09)}
  .mvn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mvd{font-family:var(--mono);font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
  .mvs{font-size:10.5px;color:var(--faint);grid-column:1/3;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-family:var(--mono)}
  .badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:5px;
    background:var(--bg2);color:var(--dim);border:1px solid var(--border);font-family:inherit}
  .badge.new{color:var(--green);border-color:rgba(72,213,151,.32);background:rgba(72,213,151,.1)}
  .badge.dead{color:var(--red);border-color:rgba(242,86,91,.32);background:rgba(242,86,91,.1)}
  .badge.warn{color:var(--gold);border-color:rgba(244,183,61,.32);background:rgba(244,183,61,.1)}
  .mvempty{font-size:12px;color:var(--faint);padding:12px 2px}
  .caret{color:var(--faint);font-size:10px;display:inline-block;width:10px}
  .ok{color:var(--green);font-weight:700}
  tr.netrow{cursor:pointer}
  tr.suboff td{background:rgba(10,14,24,.45);font-size:12px;color:var(--dim);border-bottom-color:rgba(72,88,124,.16)}
</style>
</head>
<body>
<div id="app"></div>

<script>/*__KT_DATA__*/</script>
<script>
function KT_boot(D){
  const app = document.getElementById("app");

  // ── helpers ──────────────────────────────────────────────────────────────
  const N = D.days.length;
  const fmtInt = n => Math.round(n).toLocaleString("uk-UA").replace(/,/g," ");
  const fmtMoney = n => "$"+ Math.round(n).toLocaleString("uk-UA").replace(/,/g," ");
  const fmtPct = n => n.toFixed(2)+"%";
  const shortDay = d => d.slice(5);
  const div = (a,b)=> b>0 ? a/b : 0;
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cmp = (a,b)=> typeof a==="string" ? (a<b?-1:a>b?1:0) : (a||0)-(b||0);
  // Коротка мітка команди в таблиці сайтів. Назва, що закінчується номером,
  // стискається до "К<номер>"; решта — ПЕРШЕ СЛОВО, а не перші 6 символів,
  // інакше назва з двох слів обрізалась посеред першого. Повна — в title.
  // (Без реальних назв: цей файл їде в публічну збірку відкритим текстом.)
  const teamShort = (i)=>{
    const n=(D.teams&&D.teams[i])||"";
    const m=n.match(/(\d+)\s*$/); if(m) return "К"+m[1];
    const w=(n.trim().split(/\s+/)[0]||n);
    return w.length<=10 ? w : w.slice(0,9)+"…";
  };

  const campTeam = D.camps.map(c=>c[4]);   // campIdx → teamIdx
  const nTeams = (D.teams||["—"]).length;

  // ── state ──────────────────────────────────────────────────────────────────
  const state = {
    tab:"ov", mode:"all", fromIdx:0, toIdx:N-1, dayIdx:N-1, selectedPage:null, team:-1,  // team: -1 = усі
    filter:{ type:"site", match:"partial", q:"", active:false, campSet:null, offerSet:null }
  };
  const teamOK = (t)=> state.team<0 || t===state.team;

  function setRange(){
    if(state.mode==="all"){ state.fromIdx=0; state.toIdx=N-1; }
    else if(state.mode==="day"){ state.fromIdx=state.dayIdx; state.toIdx=state.dayIdx; }
    else { const k=+state.mode; state.toIdx=N-1; state.fromIdx=Math.max(0,N-k); }
  }

  function computeFilter(){
    const f=state.filter;
    if(!f.q.trim()){ f.active=false; f.campSet=null; f.offerSet=null; return; }
    f.active=true;
    const q=f.q.trim().toLowerCase();
    const test = f.match==="exact" ? s=>String(s).toLowerCase()===q : s=>String(s).toLowerCase().includes(q);
    if(f.type==="site"){
      const cs=new Set();
      D.camps.forEach((c,ci)=>{ if(teamOK(c[4]) && test(c[1])) cs.add(ci); });
      const os=new Set();
      for(const r of D.rel){ if(cs.has(r[0])) os.add(r[1]); }
      f.campSet=cs; f.offerSet=os;
    }else{
      const os=new Set();
      D.offers.forEach((o,oi)=>{ if(test(o)) os.add(oi); });
      const cs=new Set();
      for(const r of D.rel){ if(os.has(r[1]) && teamOK(campTeam[r[0]])) cs.add(r[0]); }
      f.offerSet=os; f.campSet=cs;
    }
  }

  // ── aggregation (range-aware, from day-level cd/od) ─────────────────────────
  // per-day series [clicks,conv,leads,sales,rev] respecting the active filter
  // per-day: [clicks,conv,leads,sales,rev,saleRev] — з урахуванням команди + фільтра
  function seriesData(){
    const f=state.filter, per=Array.from({length:N},()=>[0,0,0,0,0,0]);
    if(f.active && f.type==="brand"){
      for(const r of D.od){ if(!f.offerSet.has(r[1])||!teamOK(r[8])) continue; const d=per[r[0]]; d[0]+=r[2];d[1]+=r[3];d[2]+=r[4];d[3]+=r[5];d[4]+=r[6];d[5]+=r[7]; }
    }else if(f.active && f.type==="site"){
      for(const r of D.cd){ if(!f.campSet.has(r[1])||!teamOK(campTeam[r[1]])) continue; const d=per[r[0]]; d[0]+=r[2];d[1]+=r[3];d[2]+=r[4];d[3]+=r[5];d[4]+=r[6];d[5]+=r[7]; }
    }else{
      for(let t=0;t<nTeams;t++){ if(!teamOK(t)) continue; const tt=D.totals[t]; if(!tt) continue;
        for(let i=0;i<N;i++){ const s=tt[i], d=per[i]; for(let j=0;j<6;j++) d[j]+=s[j]; } }
    }
    return per;
  }
  function sumRange(per,from,to){ const s=[0,0,0,0,0,0]; for(let i=from;i<=to;i++) for(let j=0;j<6;j++) s[j]+=per[i][j]; return s; }

  // agg arrays: [clicks,conv,leads,sales,rev,saleRev] — з урахуванням команди
  function aggCampaigns(from,to,restrict){
    const m=new Map();
    for(const r of D.cd){ const di=r[0]; if(di<from||di>to) continue; if(restrict&&!restrict.has(r[1])) continue; if(!teamOK(campTeam[r[1]])) continue;
      let a=m.get(r[1]); if(!a){a=[0,0,0,0,0,0];m.set(r[1],a);} a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];a[4]+=r[6];a[5]+=r[7]; }
    return m;
  }
  function aggOffers(from,to,restrict){
    const m=new Map();
    for(const r of D.od){ const di=r[0]; if(di<from||di>to) continue; if(restrict&&!restrict.has(r[1])) continue; if(!teamOK(r[8])) continue;
      let a=m.get(r[1]); if(!a){a=[0,0,0,0,0,0];m.set(r[1],a);} a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];a[4]+=r[6];a[5]+=r[7]; }
    return m;
  }
  // relationship aggregation (whole history). groupCol: index in rel row; restrict on entityCol.
  function relGroup(groupCol, entityCol, entitySet){
    const m=new Map();
    for(const r of D.rel){ if(entitySet&&!entitySet.has(r[entityCol])) continue; if(!teamOK(campTeam[r[0]])) continue;
      const k=r[groupCol]; let a=m.get(k); if(!a){a=[0,0,0,0,0,0];m.set(k,a);} a[0]+=r[4];a[1]+=r[5];a[2]+=r[6];a[3]+=r[7];a[4]+=r[8];a[5]+=r[9]; }
    return m; // key -> [clicks,conv,leads,sales,rev,saleRev]
  }

  // ── layout ───────────────────────────────────────────────────────────────
  app.innerHTML = `
    <header>
      <div class="hrow">
        <div class="brand"><div class="logo">K</div>
          <div><h1>Keitaro · Pulse</h1><div class="sub">Локальна аналітика трафіку по днях</div></div></div>
        <div class="seg" id="tabSeg"><button data-tab="ov">Огляд</button><button data-tab="net">Партнерки</button></div>

  // ── controls ───────────────────────────────────────────────────────────────
  const daySel=document.getElementById("daySel");

  const seg=document.getElementById("rangeSeg");
  seg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; state.mode=b.dataset.m; daySel.value=""; syncSeg(); render(); });
  function syncSeg(){ [...seg.children].forEach(b=>b.classList.toggle("on",b.dataset.m===state.mode)); }

  // перемикач команд (показуємо лише коли команд >1)
  const teamSeg=document.getElementById("teamSeg");
  function syncTeam(){ [...teamSeg.children].forEach(b=>b.classList.toggle("on",+b.dataset.tm===state.team)); }
  if(nTeams>1){
    teamSeg.style.display="inline-flex";
    teamSeg.innerHTML=`<button data-tm="-1">Всі команди</button>`+D.teams.map((t,i)=>`<button data-tm="${i}">${esc(t)}</button>`).join("");
    teamSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; state.team=+b.dataset.tm; state.selectedPage=null; syncTeam(); computeFilter(); render(); });
  }

  const tabSeg=document.getElementById("tabSeg");
  function syncTab(){
    [...tabSeg.children].forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
    document.getElementById("tabOv").style.display  = state.tab==="ov"?"":"none";
    document.getElementById("tabNet").style.display = state.tab==="net"?"":"none";
    document.getElementById("filterRow").style.display = state.tab==="ov"?"":"none";
  }
  tabSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||b.dataset.tab===state.tab)return;
    state.tab=b.dataset.tab; syncTab(); render(); });

  const netFiltSeg=document.getElementById("netFilt"), netSearchEl=document.getElementById("netSearch");
  function syncNetFilt(){ [...netFiltSeg.children].forEach(b=>b.classList.toggle("on",b.dataset.f===netFilt)); }
  netFiltSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; netFilt=b.dataset.f; syncNetFilt(); renderNets(); });
  let netTimer=null;
  netSearchEl.addEventListener("input",e=>{ netQ=e.target.value.trim(); clearTimeout(netTimer); netTimer=setTimeout(renderNets,180); });

  function selectTeam(t){ state.team=t; state.selectedPage=null; syncTeam(); computeFilter(); render(); }

  const mvSeg=document.getElementById("mvSeg");
  function syncMv(){ [...mvSeg.children].forEach(b=>b.classList.toggle("on",+b.dataset.k===mvMetric)); }
  mvSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; mvMetric=+b.dataset.k; syncMv(); renderMovers(); });

  const fType=document.getElementById("fType"), fMatch=document.getElementById("fMatch"), fq=document.getElementById("fq");
  function syncFilterUI(){
    [...fType.children].forEach(b=>b.classList.toggle("on",b.dataset.t===state.filter.type));
    [...fMatch.children].forEach(b=>b.classList.toggle("on",b.dataset.x===state.filter.match));
  }
  fType.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; state.filter.type=b.dataset.t; syncFilterUI(); applyFilter(); });
  fMatch.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; state.filter.match=b.dataset.x; syncFilterUI(); applyFilter(); });
  let fqTimer=null;
  fq.addEventListener("input",e=>{ state.filter.q=e.target.value; clearTimeout(fqTimer); fqTimer=setTimeout(applyFilter,180); });
  function applyFilter(){ state.selectedPage=null; computeFilter(); render(); }
  function setFilter(type,q,match){ state.filter.type=type; state.filter.match=match||"exact"; state.filter.q=q; fq.value=q; syncFilterUI(); applyFilter(); window.scrollTo({top:0,behavior:"smooth"}); }
  function clearFilter(){ state.filter.q=""; fq.value=""; applyFilter(); }

  function renderChip(){
    const f=state.filter, el=document.getElementById("fchip");
    if(!f.active){ el.innerHTML=""; return; }
    const nC=f.campSet?f.campSet.size:0, nO=f.offerSet?f.offerSet.size:0;
    const label = f.type==="site" ? "Сайт" : "Бренд";
    el.innerHTML=`<span class="active-chip ${f.type==="brand"?"brand":""}">
      ${label} ${f.match==="exact"?"=":"⊃"} “${esc(f.q)}”
      <span class="cnt">${nC} сайтів · ${nO} брендів</span>
      <span class="x" id="clearF">✕</span></span>`;
    document.getElementById("clearF").onclick=clearFilter;
  }

  // ── KPIs ────────────────────────────────────────────────────────────────────
  function renderKpis(){
    const per=seriesData();
    const cur=sumRange(per,state.fromIdx,state.toIdx);
    const len=state.toIdx-state.fromIdx+1, pTo=state.fromIdx-1;
    const prev = pTo>=0 ? sumRange(per,Math.max(0,pTo-len+1),pTo) : null;
    const restrict = state.filter.active?state.filter.campSet:null;
    const activeSites=aggCampaigns(state.fromIdx,state.toIdx,restrict).size;
    const cr=div(cur[1],cur[0])*100;
    const D_=(i)=>prev?cur[i]-prev[i]:0, P_=(i)=>prev?prev[i]:0, R_=prev?0:1;
    const defs=[
      {lbl:"Кліки",v:fmtInt(cur[0]),c:"var(--blue)",d:D_(0),p:P_(0),raw:R_},
      {lbl:"Конверсії",v:fmtInt(cur[1]),c:"var(--gold)",d:D_(1),p:P_(1),raw:R_},
      {lbl:"CR",v:fmtPct(cr),c:"var(--cyan)",raw:1},
      {lbl:"Ліди",v:fmtInt(cur[2]),c:"var(--purple)",d:D_(2),p:P_(2),raw:R_},
      {lbl:"Продажі",v:fmtInt(cur[3]),c:"var(--green)",d:D_(3),p:P_(3),raw:R_},
      {lbl:"Дохід (усього)",v:fmtMoney(cur[4]),c:"var(--dim)",d:D_(4),p:P_(4),money:1,raw:R_,hint:"ліди+сейли, до підтвердження"},
      {lbl:"Дохід (підтв.)",v:fmtMoney(cur[5]),c:"var(--green)",d:D_(5),p:P_(5),money:1,raw:R_,hint:"sale_revenue — як у Keitaro"},
      {lbl:state.filter.active?(state.filter.type==="brand"?"Брендів у фільтрі":"Активні сайти"):"Активні сайти",
        v:fmtInt(state.filter.active&&state.filter.type==="brand"?state.filter.offerSet.size:activeSites),c:"var(--blue)",raw:1},
    ];
    document.getElementById("kpis").innerHTML=defs.map(k=>{
      let dl="";
      if(!k.raw){
        const pct=k.p>0?(k.d/k.p*100):(k.d>0?100:0);
        const cls=k.d>0?"up":(k.d<0?"down":"flat"), arr=k.d>0?"▲":(k.d<0?"▼":"—");
        dl=`<div class="dl ${cls}">${arr} ${k.d>=0?"+":""}${k.money?fmtMoney(k.d):fmtInt(k.d)} <span style="color:var(--faint);font-weight:500">(${pct>=0?"+":""}${pct.toFixed(0)}%)</span></div>`;
      }
      return `<div class="kpi" style="--accent:${k.c}"${k.hint?` title="${k.hint}"`:""}><div class="lbl">${k.lbl}</div><div class="val mono">${k.v}</div>${dl}</div>`;
    }).join("");
  }

  // ── chart ────────────────────────────────────────────────────────────────────
  function renderChart(){
    const wrap=document.getElementById("chartWrap");
    const per=seriesData();
    const s=[]; for(let i=state.fromIdx;i<=state.toIdx;i++) s.push({idx:i,day:D.days[i],clicks:per[i][0],conv:per[i][1],rev:per[i][4]});
    const W=760,H=260,PL=44,PR=44,PT=14,PB=26, iw=W-PL-PR, ih=H-PT-PB, n=s.length;
    const maxC=Math.max(1,...s.map(d=>d.clicks)), maxV=Math.max(1,...s.map(d=>d.conv));
    const x=i=> n<=1?PL+iw/2:PL+(i/(n-1))*iw, yC=v=>PT+ih-(v/maxC)*ih, yV=v=>PT+ih-(v/maxV)*ih;
    let area=`M ${x(0)} ${yC(s[0].clicks)}`, line=`M ${x(0)} ${yC(s[0].clicks)}`, cl=`M ${x(0)} ${yV(s[0].conv)}`;
    for(let i=1;i<n;i++){ area+=` L ${x(i)} ${yC(s[i].clicks)}`; line+=` L ${x(i)} ${yC(s[i].clicks)}`; cl+=` L ${x(i)} ${yV(s[i].conv)}`; }
    area+=` L ${x(n-1)} ${PT+ih} L ${x(0)} ${PT+ih} Z`;
    let grid="",ylab="";
    for(let g=0;g<=4;g++){ const yy=PT+(g/4)*ih, val=maxC*(1-g/4);
      grid+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="rgba(72,88,124,.22)" stroke-dasharray="3 3"/>`;
      ylab+=`<text x="${PL-8}" y="${yy+3}" text-anchor="end" fill="var(--faint)" font-size="9" font-family="var(--mono)">${fmtInt(val)}</text>`; }
    let xlab="", step=Math.max(1,Math.ceil(n/9));
    for(let i=0;i<n;i+=step) xlab+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="var(--faint)" font-size="9" font-family="var(--mono)">${shortDay(s[i].day)}</text>`;
    let dots=""; for(let i=0;i<n;i++) if(s[i].conv>0) dots+=`<circle cx="${x(i)}" cy="${yV(s[i].conv)}" r="3" fill="var(--gold)"/>`;
    wrap.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--blue)" stop-opacity=".45"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
      ${grid}${ylab}${xlab}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2"/>
      <path d="${cl}" fill="none" stroke="var(--gold)" stroke-width="1.8"/>${dots}
      <rect id="hit" x="${PL}" y="${PT}" width="${iw}" height="${ih}" fill="transparent"/>
      <line id="cursor" x1="0" y1="${PT}" x2="0" y2="${PT+ih}" stroke="var(--border-hi)" stroke-width="1" style="opacity:0"/></svg><div class="tip" id="tip"></div>`;
    const svg=wrap.querySelector("svg"),tip=wrap.querySelector("#tip"),cursor=wrap.querySelector("#cursor"),hit=wrap.querySelector("#hit");
    hit.addEventListener("mousemove",ev=>{ const rect=svg.getBoundingClientRect(); const px=(ev.clientX-rect.left)/rect.width*W;
      let i=Math.round((px-PL)/iw*(n-1)); i=Math.max(0,Math.min(n-1,i)); const d=s[i], cx=x(i);
      cursor.setAttribute("x1",cx); cursor.setAttribute("x2",cx); cursor.style.opacity=1; tip.style.opacity=1;
      tip.style.left=Math.min(rect.width-150,Math.max(0,(cx/W)*rect.width+10))+"px"; tip.style.top="6px";
      tip.innerHTML=`<b>${d.day}</b><br><span class="k">Кліки:</span> <b class="mono">${fmtInt(d.clicks)}</b><br><span class="k">Конв:</span> <b class="mono" style="color:var(--gold)">${fmtInt(d.conv)}</b>${d.rev>0?`<br><span class="k">Дохід:</span> <b class="mono" style="color:var(--green)">${fmtMoney(d.rev)}</b>`:""}`; });
    hit.addEventListener("mouseleave",()=>{tip.style.opacity=0;cursor.style.opacity=0;});
    hit.addEventListener("click",ev=>{ const rect=svg.getBoundingClientRect(); const px=(ev.clientX-rect.left)/rect.width*W;
      let i=Math.round((px-PL)/iw*(n-1)); i=Math.max(0,Math.min(n-1,i))+state.fromIdx; state.mode="day"; state.dayIdx=i; daySel.value=i; syncSeg(); render(); });
  }

  // ── sites table ──────────────────────────────────────────────────────────────
  const sortState={site:{key:2,asc:false},brand:{key:1,asc:false}};
  let siteFilter="",brandFilter="";
  document.getElementById("siteSearch").addEventListener("input",e=>{siteFilter=e.target.value.toLowerCase();renderSites();});
  document.getElementById("brandSearch").addEventListener("input",e=>{brandFilter=e.target.value.toLowerCase();renderBrands();});

  function renderSites(){
    const f=state.filter; let rows=[], whole=false;
    if(f.active && f.type==="brand"){
      whole=true;
      const m=relGroup(0,1,f.offerSet); // campaign -> metrics of THIS brand
      m.forEach((a,ci)=>{ const c=D.camps[ci]; rows.push({ci,name:c[1],prefix:c[2],geo:c[3],clicks:a[0],conv:a[1],leads:a[2],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100}); });
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ const c=D.camps[ci]; rows.push({ci,name:c[1],prefix:c[2],geo:c[3],clicks:a[0],conv:a[1],leads:a[2],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100}); });
    }
    if(siteFilter) rows=rows.filter(r=>r.name.toLowerCase().includes(siteFilter)||r.geo.toLowerCase().includes(siteFilter));
    const cols=["name","geo","clicks","conv","cr","sales","rev","confRev"], head=["Сайт","Гео","Кліки","Конв","CR","Прод","Дохід","Підтв."];
    const sk=cols[sortState.site.key];
    rows.sort((a,b)=> sortState.site.asc?cmp(a[sk],b[sk]):cmp(b[sk],a[sk]));
    const total=rows.length, shown=rows.slice(0,150), maxC=Math.max(1,...shown.map(r=>r.clicks));
    document.getElementById("siteSub").textContent=`${total} сайтів · топ ${Math.min(150,total)}`;
    document.getElementById("siteTag").innerHTML= whole?`<span class="tag-all">за весь період</span>`:"";
    document.getElementById("siteTbl").innerHTML=
      `<thead><tr>${head.map((h,i)=>`<th data-i="${i}" class="${sortState.site.key===i?'sorted '+(sortState.site.asc?'asc':''):''}">${h}</th>`).join("")}</tr></thead>`+
      `<tbody>${shown.length?shown.map(r=>`<tr data-name="${esc(r.name)}">
        <td><span class="site">${esc(r.name)}</span> ${r.prefix!=="—"?`<span class="chip">${r.prefix}</span>`:""}${(state.team<0&&nTeams>1)?`<span class="chip tm" title="${esc(D.teams[campTeam[r.ci]])}">${teamShort(campTeam[r.ci])}</span>`:""}</td>
        <td>${r.geo!=="—"?`<span class="chip geo">${r.geo}</span>`:'<span class="zero">—</span>'}</td>
        <td class="bar-cell mono"><span class="bar" style="width:${r.clicks/maxC*100}%"></span><span>${fmtInt(r.clicks)}</span></td>
        <td class="mono ${r.conv>0?'conv-badge':'zero'}">${r.conv||"0"}</td>
        <td class="mono">${r.conv>0?fmtPct(r.cr):'<span class="zero">—</span>'}</td>
        <td class="mono ${r.sales?'':'zero'}">${r.sales||"0"}</td>
        <td class="mono ${r.rev>0?'':'zero'}">${r.rev>0?fmtMoney(r.rev):"—"}</td>
        <td class="mono ${r.confRev>0?'up':'zero'}">${r.confRev>0?fmtMoney(r.confRev):"—"}</td></tr>`).join(""):`<tr class="nolink"><td colspan="8" class="emptycell">Нічого не знайдено.</td></tr>`}</tbody>`;
    const tbl=document.getElementById("siteTbl");
    tbl.querySelectorAll("th").forEach(th=>th.onclick=()=>{const i=+th.dataset.i; if(sortState.site.key===i)sortState.site.asc=!sortState.site.asc;else{sortState.site.key=i;sortState.site.asc=false;}renderSites();});

  // ── brands table ───────────────────────────────────────────────────────────────
  function renderBrands(){

  // ── positions & pages (rel, whole history) ────────────────────────────────────
  function entityForRel(){ // returns [entityCol, set] based on filter
    const f=state.filter;
    if(f.active && f.type==="brand") return [1,f.offerSet];
    if(f.active && f.type==="site") return [0,f.campSet];
    return [null,null];
  }
  const noteHTML = n => `<div style="font-size:11px;color:var(--faint);margin-top:8px">без мітки (sub_id): <span class="mono">${fmtInt(n)}</span> кліків</div>`;
  const distHead = (a,b)=>`<div class="dist-head"><span>${a}</span><span>${b}</span></div>`;

  function renderPosPages(){
    const [col,set]=entityForRel();
    const scope = state.filter.active ? (state.filter.type==="brand"?`бренд “${esc(state.filter.q)}”`:`сайт “${esc(state.filter.q)}”`) : "усі сайти/бренди";

    // ── Сторінки (sub_id_3) — клікабельний список ──
    const gm=relGroup(3,col,set);
    let pgAll=[...gm].map(([gi,a])=>({gi,label:D.pages[gi],v:a[0],conv:a[1]}));
    const pgEmpty=pgAll.filter(p=>p.label==="").reduce((s,p)=>s+p.v,0);
    let pg=pgAll.filter(p=>p.label!==""&&p.v>0).sort((a,b)=>b.v-a.v).slice(0,18);
    const maxG=Math.max(1,...pg.map(p=>p.v));
    document.getElementById("pageSub").textContent=`Сторінки для: ${scope}`;
    document.getElementById("pageDist").innerHTML = distHead("Сторінка","Кліки · Конв") +
      (pg.length? pg.map(p=>`<div class="row drow ${state.selectedPage===p.gi?'sel':''}" data-page="${p.gi}">
          <div class="name" title="${esc(p.label)}">${esc(p.label)}</div>
          <div class="track"><div class="fill" style="width:${p.v/maxG*100}%;background:linear-gradient(90deg,var(--purple),var(--blue))"></div></div>
          <div class="v mono">${fmtInt(p.v)}${p.conv?` · <span style="color:var(--gold)">${p.conv}</span>`:""}</div></div>`).join("") : emptyDist())
      + (pgEmpty>0?noteHTML(pgEmpty):"");
    document.getElementById("pageDist").querySelectorAll("[data-page]").forEach(el=>el.onclick=()=>{
      const gi=+el.dataset.page; state.selectedPage=(state.selectedPage===gi?null:gi); renderPosPages();
    });

    // ── Позиції × бренди — таблиця (scope: фільтр + вибрана сторінка) ──
    const sp=state.selectedPage;
    const posTitle=document.getElementById("posTitle"), posSub=document.getElementById("posSub");
    if(sp!=null){
      posTitle.innerHTML=`Позиції × бренди · <span style="color:var(--purple)">${esc(D.pages[sp]||"(без сторінки)")}</span> <span id="clrPage" title="скинути сторінку" style="cursor:pointer;color:var(--dim);font-weight:500">✕</span>`;
      posSub.textContent="Які бренди й на яких позиціях стояли на цій сторінці";
    } else {
      posTitle.textContent="Позиції × бренди";
      posSub.textContent=`Який бренд на якій позиції · ${scope}`;
    }
    const m=new Map();
    for(const r of D.rel){
      if(set && !set.has(r[col])) continue;
      if(!teamOK(campTeam[r[0]])) continue;
      if(sp!=null && r[3]!==sp) continue;
      const key=r[2]+"|"+r[1];
      let a=m.get(key); if(!a){a={pos:D.positions[r[2]],offer:D.offers[r[1]],clicks:0,conv:0};m.set(key,a);}
      a.clicks+=r[4]; a.conv+=r[5];
    }
    let rows=[...m.values()].filter(r=>r.clicks>0);
    rows.sort((a,b)=>{ const ea=a.pos==="",eb=b.pos===""; if(ea!==eb)return ea?1:-1; const na=+a.pos,nb=+b.pos; if(!isNaN(na)&&!isNaN(nb)&&na!==nb)return na-nb; return b.clicks-a.clicks; });
    rows=rows.slice(0,80);
    const maxc=Math.max(1,...rows.map(r=>r.clicks));
    document.getElementById("posTbl").innerHTML =
      `<thead><tr><th>Поз.</th><th>Бренд</th><th>Кліки</th><th>Конв</th></tr></thead>`+
      `<tbody>${rows.length? rows.map(r=>`<tr data-name="${esc(r.offer)}">
         <td class="mono" style="font-weight:700;color:var(--gold)">${r.pos===""?"—":esc(r.pos)}</td>
         <td><span class="site">${esc(r.offer)}</span></td>
         <td class="bar-cell mono"><span class="bar" style="width:${r.clicks/maxc*100}%;background:var(--gold)"></span><span>${fmtInt(r.clicks)}</span></td>

    document.getElementById("posTbl").querySelectorAll("tbody tr[data-name]").forEach(tr=>tr.onclick=()=>setFilter("brand",tr.dataset.name));
    if(sp!=null){ const c=document.getElementById("clrPage"); if(c) c.onclick=e=>{ e.stopPropagation(); state.selectedPage=null; renderPosPages(); }; }
  }
  function distHTML(items,colorFn){

      <div class="v mono">${fmtInt(i.v)}${i.conv?` · <span style="color:var(--gold)">${i.conv}</span>`:""}</div></div>`).join("");

  const emptyDist=()=>'<div style="color:var(--faint);font-size:12px">немає даних</div>';

  // ── converting sites ────────────────────────────────────────────────────────────

        <td><span class="site">${esc(r.name)}</span></td>
        <td>${r.geo!=="—"?`<span class="chip geo">${r.geo}</span>`:'<span class="zero">—</span>'}</td>
        <td class="mono conv-badge">${r.conv}</td><td class="mono ${r.sales?'':'zero'}">${r.sales||"0"}</td>
        <td class="mono">${fmtPct(r.cr)}</td><td class="mono">${fmtInt(r.clicks)}</td>

      osArr=[...mm].map(([k,v])=>({label:k,v:v[0],conv:v[1]})).sort((a,b)=>b.v-a.v); }
    else { osArr=((D.os&&D.os[state.team])||[]).map(o=>({label:o[0],v:o[1],conv:o[2]})); }

  // ── render all ────────────────────────────────────────────────────────────────
  // ── динаміка: порівняння двох сусідніх вікон ───────────────────────────────
  // Усе нижче рахується з того, що вже є в DATA (od — день×бренд×команда),
  // тож нових запитів до Keitaro не треба.
  let MV = null;              // кеш на один рендер: {w, rows, byTeam}
  let mvMetric = 0;           // 0 кліки · 1 конверсії · 5 підтверджений дохід

  // Вікно «до» — рівно такої ж довжини і впритул перед вибраним періодом.
  // Для «весь період» попереднього вікна не існує, тож беремо 7 проти 7
  // останніх днів і чесно пишемо про це в підзаголовку.
  function cmpWindows(){
    const len=state.toIdx-state.fromIdx+1, pTo=state.fromIdx-1;
    const dm=d=>d.slice(8,10)+"."+d.slice(5,7);
    const lbl=(a,b)=> a===b ? dm(D.days[a]) : dm(D.days[a])+"–"+dm(D.days[b]);
    if(pTo>=0){
      const pFrom=Math.max(0,pTo-len+1);
      return {cur:[state.fromIdx,state.toIdx],prev:[pFrom,pTo],
        label:`${lbl(state.fromIdx,state.toIdx)} проти ${lbl(pFrom,pTo)}`};
    }
    // вибрано найперший день історії — порівнювати нема з чим, і підміняти
    // його «останніми 7 днями» було б брехнею
    if(state.mode==="day") return null;
    const L=Math.min(7,Math.floor(N/2));
    if(L<1) return null;
    return {cur:[N-L,N-1],prev:[N-2*L,N-L-1],fallback:true,
      label:`останні ${L} дн (${lbl(N-L,N-1)}) проти попередніх ${L} (${lbl(N-2*L,N-L-1)})`};
  }

  const plural=(n,a)=>{const m=Math.abs(n)%100,k=Math.abs(n)%10;return a[(m>=11&&m<=14)?2:(k===1?0:(k>=2&&k<=4?1:2))];};
  function dHTML(d,p,money){
    const pct = p>0 ? d/p*100 : (d>0?100:0);
    const cls = d>0?"up":(d<0?"down":"flat"), arr = d>0?"▲":(d<0?"▼":"—");
    const v = money?fmtMoney(Math.abs(d)):fmtInt(Math.abs(d));
    const sign = d>0?"+":(d<0?"−":"");
    return `<span class="dchip ${cls}">${arr} ${sign}${v}${p>0?` <span style="color:var(--faint);font-weight:600">(${pct>=0?"+":"−"}${Math.abs(pct).toFixed(0)}%)</span>`:""}</span>`;
  }

  function sparkSVG(vals,color){
    const w=140,h=30; if(!vals.length) return "";
    const max=Math.max(1,...vals);
    if(vals.length===1) return `<svg class="spark" viewBox="0 0 ${w} ${h}"><circle cx="${w/2}" cy="${h/2}" r="3" fill="${color}"/></svg>`;
    const step=w/(vals.length-1);
    const pts=vals.map((v,i)=>[i*step,h-2-(v/max)*(h-5)]);
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="${color}" opacity=".12"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  }

  // по днях для КОЖНОЇ команди за один прохід, з урахуванням активного фільтра
  function teamSeriesAll(){
    const f=state.filter;
    const per=Array.from({length:nTeams},()=>Array.from({length:N},()=>[0,0,0,0,0,0]));
    const put=(t,di,r,o)=>{ const d=per[t][di]; for(let j=0;j<6;j++) d[j]+=r[o+j]; };
    if(f.active && f.type==="brand"){
      for(const r of D.od){ if(!f.offerSet.has(r[1])) continue; put(r[8],r[0],r,2); }
    }else if(f.active && f.type==="site"){
      for(const r of D.cd){ if(!f.campSet.has(r[1])) continue; put(campTeam[r[1]],r[0],r,2); }
    }else{
      for(let t=0;t<nTeams;t++){ const tt=D.totals[t]; if(!tt) continue;
        for(let i=0;i<N;i++) for(let j=0;j<6;j++) per[t][i][j]+=tt[i][j]; }
    }
    return per;
  }

  // бренди (а коли вибрано «всі команди» — пари бренд×команда) у двох вікнах
  function moversData(){
    const w=cmpWindows(); if(!w) return null;
    const byTeam = state.team<0 && nTeams>1;
    const f=state.filter;
    const pick=(from,to)=>{
      const m=new Map();
      for(const r of D.od){
        const di=r[0]; if(di<from||di>to) continue;
        if(!teamOK(r[8])) continue;
        if(f.active && f.offerSet && !f.offerSet.has(r[1])) continue;
        const k = byTeam ? r[1]+"|"+r[8] : String(r[1]);
        let a=m.get(k); if(!a){a=[0,0,0,0,0,0];m.set(k,a);}
        a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];a[4]+=r[6];a[5]+=r[7];
      }
      return m;
    };
    const cur=pick(w.cur[0],w.cur[1]), prev=pick(w.prev[0],w.prev[1]);
    const rows=[];
    for(const k of new Set([...cur.keys(),...prev.keys()])){
      const c=cur.get(k)||[0,0,0,0,0,0], p=prev.get(k)||[0,0,0,0,0,0];
      const parts=k.split("|");
      rows.push({oi:+parts[0], ti: parts.length>1?+parts[1]:(state.team<0?null:state.team), c, p});
    }
    return {w,rows,byTeam};
  }

  // ── картки команд ──────────────────────────────────────────────────────────
  function renderTeamCards(){
    const box=document.getElementById("tcards");
    if(nTeams<2){ box.style.display="none"; return; }
    const per=teamSeriesAll();
    const w=MV&&MV.w;
    // спарклайн: вибраний період, але якщо це 1–2 дні — останні 14, щоб була форма
    const sFrom = (state.toIdx-state.fromIdx)>=2 ? state.fromIdx : Math.max(0,N-14);
    const sTo   = (state.toIdx-state.fromIdx)>=2 ? state.toIdx   : N-1;
    const sum=(a,from,to)=>{const s=[0,0,0,0,0,0];for(let i=from;i<=to;i++)for(let j=0;j<6;j++)s[j]+=a[i][j];return s;};

    const cards=[];
    const all=Array.from({length:N},(_,i)=>{const s=[0,0,0,0,0,0];for(let t=0;t<nTeams;t++)for(let j=0;j<6;j++)s[j]+=per[t][i][j];return s;});
    const mk=(idx,name,series,color)=>{
      const cur=sum(series,state.fromIdx,state.toIdx);
      const prv=w?sum(series,w.prev[0],w.prev[1]):null;
      const curW=w?sum(series,w.cur[0],w.cur[1]):cur;
      const cr=div(cur[1],cur[0])*100;
      const vals=[];for(let i=sFrom;i<=sTo;i++) vals.push(series[i][0]);
      return `<div class="tcard ${state.team===idx?"on":""}" data-tm="${idx}" title="${esc(name)}">
        <div class="tn">${esc(name)}</div>
        <div class="tv">${fmtInt(cur[0])}</div>
        ${prv?`<div style="margin-top:6px" title="${esc(w.label)}">${w.fallback?`<span style="color:var(--faint);font-size:10.5px;font-weight:700;margin-right:4px">7д</span>`:""}${dHTML(curW[0]-prv[0],prv[0])}</div>`:""}
        ${sparkSVG(vals,color)}
        <div class="tx"><span>CR <b>${cur[1]?fmtPct(cr):"—"}</b></span><span>конв <b>${fmtInt(cur[1])}</b></span><span>підтв <b>${cur[5]>0?fmtMoney(cur[5]):"—"}</b></span></div>
      </div>`;
    };
    cards.push(mk(-1,"Всі команди",all,"var(--blue)"));
    const pal=["var(--green)","var(--gold)","var(--purple)","var(--cyan)","var(--blue)","var(--green)"];
    for(let t=0;t<nTeams;t++) cards.push(mk(t,D.teams[t],per[t],pal[t%pal.length]));
    box.innerHTML=cards.join("");
    box.querySelectorAll(".tcard").forEach(c=>c.onclick=()=>selectTeam(+c.dataset.tm));
  }

  // ── рух брендів ────────────────────────────────────────────────────────────
  function renderMovers(){
    const box=document.getElementById("mv"), sub=document.getElementById("mvSub");
    if(!MV){ box.innerHTML=`<div class="mvempty">Замало історії, щоб порівняти два періоди.</div>`; sub.textContent=""; return; }
    const m=mvMetric, money=m===5;
    const name=(r)=> esc(D.offers[r.oi]||"(без офера)")+(MV.byTeam&&r.ti!=null?` <span class="chip tm">${teamShort(r.ti)}</span>`:"");
    const totalCur=MV.rows.reduce((s,r)=>s+r.c[m],0);
    const floor=Math.max(money?20:(m===1?3:30), totalCur*0.004);

    const sig=MV.rows.filter(r=>Math.max(r.c[m],r.p[m])>=floor);
    const up=sig.filter(r=>r.c[m]>r.p[m]).sort((a,b)=>(b.c[m]-b.p[m])-(a.c[m]-a.p[m])).slice(0,9);
    const dn=sig.filter(r=>r.c[m]<r.p[m]).sort((a,b)=>(a.c[m]-a.p[m])-(b.c[m]-b.p[m])).slice(0,9);

    const clickFloor=Math.max(40, MV.rows.reduce((s,r)=>s+r.c[0],0)*0.002);
    const nc=MV.rows.filter(r=>r.c[0]>=clickFloor && r.c[1]===0).sort((a,b)=>b.c[0]-a.c[0]).slice(0,9);

    const badges=(r)=>{
      const b=[];
      if(r.p[0]===0&&r.c[0]>0) b.push(`<span class="badge new">новий</span>`);
      if(r.c[0]===0&&r.p[0]>0) b.push(`<span class="badge dead">зник</span>`);
      if(r.c[0]>=clickFloor&&r.c[1]===0) b.push(`<span class="badge warn">0 конверсій</span>`);
      const crC=div(r.c[1],r.c[0]), crP=div(r.p[1],r.p[0]);
      if(r.c[0]>=clickFloor&&r.p[0]>=clickFloor&&crP>0&&r.c[1]>0){
        if(crC>=crP*1.4) b.push(`<span class="badge new">CR ▲</span>`);
        else if(crC<=crP*0.6) b.push(`<span class="badge dead">CR ▼</span>`);
      }
      return b.join(" ");
    };
    const val=(v)=> money?fmtMoney(v):fmtInt(v);
    const row=(r)=>`<div class="mvrow" data-oi="${r.oi}" data-ti="${r.ti==null?"":r.ti}">
      <div class="mvn">${name(r)}</div>
      <div class="mvd">${dHTML(r.c[m]-r.p[m],r.p[m],money)}</div>
      <div class="mvs">${val(r.p[m])} → ${val(r.c[m])} ${badges(r)}</div></div>`;
    const col=(title,cls,arr,empty)=>`<div><div class="mvh"><span class="${cls}">${title}</span><span class="n">${arr.length}</span></div>
      ${arr.length?arr.map(row).join(""):`<div class="mvempty">${empty}</div>`}</div>`;

    const mName=m===0?"кліків":(m===1?"конверсій":"підтвердженого доходу");
    sub.textContent=`${MV.w.label} · за зміною ${mName}${MV.byTeam?" · окремо по кожній команді":""}`;
    box.innerHTML =
      col("▲ Зростають","up",up,"Нікого, хто б помітно виріс.") +
      col("▼ Просідають","down",dn,"Ніхто помітно не просів.") +
      `<div><div class="mvh"><span style="color:var(--gold)">⚠ Клікають, але не конвертять</span><span class="n">${nc.length}</span></div>
        ${nc.length?nc.map(r=>`<div class="mvrow" data-oi="${r.oi}" data-ti="${r.ti==null?"":r.ti}">
          <div class="mvn">${name(r)}</div><div class="mvd" style="color:var(--gold)">${fmtInt(r.c[0])}</div>
          <div class="mvs">кліків за період · 0 конверсій ${r.p[1]>0?`<span class="badge dead">раніше ${fmtInt(r.p[1])}</span>`:""}</div></div>`).join("")
          :`<div class="mvempty">Усі помітні бренди дають конверсії. 👌</div>`}</div>`;

    box.querySelectorAll(".mvrow").forEach(el=>el.onclick=()=>{
      const ti=el.dataset.ti; if(ti!=="") state.team=+ti;
      syncTeam(); setFilter("brand", D.offers[+el.dataset.oi]||"");
    });
  }

  // ── «що змінилось»: короткий висновок людською мовою ───────────────────────
  function renderDigest(){
    const el=document.getElementById("digest"), sub=document.getElementById("dgSub");
    if(!MV){ el.innerHTML=`<li><span class="ic">·</span><span>Замало історії, щоб порівняти два періоди.</span></li>`; sub.textContent=""; return; }
    const w=MV.w; sub.textContent=w.label;
    const q=(s)=>`<span class="q" data-b="${esc(s)}">${esc(s)}</span>`;
    const pc=(d,p)=> p>0 ? `${d>=0?"+":"−"}${Math.abs(d/p*100).toFixed(0)}%` : (d>0?"з нуля":"—");
    const li=(ic,html)=>`<li><span class="ic">${ic}</span><span>${html}</span></li>`;
    const out=[];

    const per=seriesData();
    const c=sumRange(per,w.cur[0],w.cur[1]), p=sumRange(per,w.prev[0],w.prev[1]);
    const dirW=(d)=> d>0?`<b class="up">`:(d<0?`<b class="down">`:`<b class="flat">`);
    out.push(li("📊",`Кліки ${dirW(c[0]-p[0])}${pc(c[0]-p[0],p[0])}</b> (${fmtInt(p[0])} → ${fmtInt(c[0])}), `+
      `конверсії ${dirW(c[1]-p[1])}${pc(c[1]-p[1],p[1])}</b>, підтверджений дохід ${dirW(c[5]-p[5])}${pc(c[5]-p[5],p[5])}</b> (${fmtMoney(p[5])} → ${fmtMoney(c[5])}).`));

    // хто з команд рухається найсильніше + головний бренд-драйвер
    if(MV.byTeam){
      const ts=teamSeriesAll();
      const sum=(a,f,t)=>{const s=[0,0,0,0,0,0];for(let i=f;i<=t;i++)for(let j=0;j<6;j++)s[j]+=a[i][j];return s;};
      const drv=new Map();
      for(const r of MV.rows){ if(r.ti==null) continue;
        let a=drv.get(r.ti); if(!a){a=[];drv.set(r.ti,a);} a.push({oi:r.oi,d:r.c[0]-r.p[0]}); }
      const tl=[];
      for(let t=0;t<nTeams;t++){
        const cc=sum(ts[t],w.cur[0],w.cur[1]), pp=sum(ts[t],w.prev[0],w.prev[1]);
        const d=cc[0]-pp[0]; if(pp[0]<50&&cc[0]<50) continue;
        const pct = pp[0]>0 ? d/pp[0]*100 : 100;
        if(Math.abs(pct)<12) continue;
        const list=(drv.get(t)||[]).slice().sort((a,b)=>d>0?b.d-a.d:a.d-b.d);
        const top=list[0];
        tl.push({t,d,pct,cc,pp,top});
      }
      tl.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,3).forEach(x=>{
        const why = x.top && Math.abs(x.top.d)>=Math.abs(x.d)*0.25
          ? ` — головним чином ${q(D.offers[x.top.oi]||"(без офера)")} (${x.top.d>=0?"+":"−"}${fmtInt(Math.abs(x.top.d))})`
          : (x.d<0 ? " — просідання рівномірне, одного винуватця нема" : " — рівномірно по всіх брендах");
        out.push(li(x.d>0?"▲":"▼",`<b>${esc(D.teams[x.t])}</b>: кліки <b class="${x.d>0?"up":"down"}">${pc(x.d,x.pp[0])}</b> (${fmtInt(x.pp[0])} → ${fmtInt(x.cc[0])})${why}.`));
      });
    }else{
      // одна команда у фокусі — показуємо найсильніший приріст і найсильніше просідання
      const srt=MV.rows.slice().sort((x,y)=>(y.c[0]-y.p[0])-(x.c[0]-x.p[0]));
      const flr=Math.max(40,c[0]*0.004), top=srt[0], bot=srt[srt.length-1];
      if(top && top.c[0]-top.p[0]>=flr)
        out.push(li("▲",`Найбільший приріст: ${q(D.offers[top.oi]||"")} <b class="up">+${fmtInt(top.c[0]-top.p[0])}</b> кліків (${fmtInt(top.p[0])} → ${fmtInt(top.c[0])}).`));
      if(bot && bot.p[0]-bot.c[0]>=flr)
        out.push(li("▼",`Найбільше просів: ${q(D.offers[bot.oi]||"")} <b class="down">−${fmtInt(bot.p[0]-bot.c[0])}</b> кліків (${fmtInt(bot.p[0])} → ${fmtInt(bot.c[0])}).`));
    }

    // новачки та ті, хто зник
    const fresh=MV.rows.filter(r=>r.p[0]===0&&r.c[0]>=Math.max(40,c[0]*0.004)).sort((a,b)=>b.c[0]-a.c[0]).slice(0,2);
    fresh.forEach(r=>out.push(li("🆕",`Новий бренд ${q(D.offers[r.oi]||"")}${MV.byTeam&&r.ti!=null?` у <b>${esc(D.teams[r.ti])}</b>`:""}: `+
      `<b>${fmtInt(r.c[0])}</b> кліків, ${r.c[1]?`<b class="up">${fmtInt(r.c[1])}</b> ${plural(r.c[1],["конверсія","конверсії","конверсій"])}`:`<b class="down">жодної конверсії</b>`}.`)));
    const gone=MV.rows.filter(r=>r.c[0]===0&&r.p[0]>=Math.max(60,p[0]*0.006)).sort((a,b)=>b.p[0]-a.p[0]).slice(0,2);
    gone.forEach(r=>out.push(li("💀",`Зник трафік: ${q(D.offers[r.oi]||"")}${MV.byTeam&&r.ti!=null?` (<b>${esc(D.teams[r.ti])}</b>)`:""} — було <b>${fmtInt(r.p[0])}</b> кліків, стало 0.`)));

    // клікають, але не конвертять
    const cf=Math.max(40,c[0]*0.002);
    const nc=MV.rows.filter(r=>r.c[0]>=cf&&r.c[1]===0);
    if(nc.length){
      // один бренд може «мовчати» в кількох командах — рахуємо його один раз
      const agg=new Map();
      for(const r of nc){ const nm=D.offers[r.oi]||"(без офера)";
        let a=agg.get(nm); if(!a){a={clicks:0,teams:new Set()};agg.set(nm,a);} a.clicks+=r.c[0]; if(r.ti!=null)a.teams.add(r.ti); }
      const list=[...agg.entries()].sort((a,b)=>b[1].clicks-a[1].clicks);
      const lost=list.reduce((s,x)=>s+x[1].clicks,0), n=list.length;
      out.push(li("⚠",`<b>${n}</b> ${plural(n,["бренд зібрав","бренди зібрали","брендів зібрали"])} <b>${fmtInt(lost)}</b> `+
        `${plural(lost,["клік","кліки","кліків"])} (${(lost/Math.max(1,c[0])*100).toFixed(0)}% усього трафіку) <b class="down">без жодної конверсії</b>: `+
        list.slice(0,3).map(x=>q(x[0])+(x[1].teams.size>1?` <span style="color:var(--faint)">(у ${x[1].teams.size} ${plural(x[1].teams.size,["команді","командах","командах"])})</span>`:"")).join(", ")+
        (n>3?` та ще ${n-3}`:"")+"."));
    }

    if(out.length===1) out.push(li("·","Жодних помітних зрушень між періодами — все рівно."));
    el.innerHTML=out.join("");
    el.querySelectorAll(".q").forEach(s=>s.onclick=()=>setFilter("brand",s.dataset.b));
  }

  // ── вкладка «Партнерки» ────────────────────────────────────────────────────
  // Статус постбеку по оферу визначаємо з довідників Keitaro:
  //   немає мережі            → постбек неможливий;
  //   у мережі порожній URL   → постбек не налаштований;
  //   є URL, але ні offer_param у мережі, ні макросу в посиланні офера
  //                           → клік-айді не передається, конверсію нема з чим зіставити;
  //   інакше                  → налаштовано.
  // Колонки трафіку — це вже реальність: чи приходять конверсії насправді.
  const NETS = D.nets || [], NOFF = D.noff || [];
  const netOpen = new Set();
  let netFilt = "all", netQ = "";
  let lastConvCache = null;

  function lastConvByOffer(){           // (oi|ti) → індекс останнього дня з конверсією
    if(lastConvCache) return lastConvCache;
    const m=new Map();
    for(const r of D.od){ if(r[3]<=0) continue; const k=r[1]+"|"+r[8];
      const v=m.get(k); if(v===undefined||r[0]>v) m.set(k,r[0]); }
    return (lastConvCache=m);
  }

  function offStatus(o){                // o = рядок noff
    const ni=o[3]; if(ni<0) return "nonet";
    const n=NETS[ni]; if(!n) return "nonet";
    if(!n[2]) return "nopb";
    if(!n[3] && !o[4]) return "noid";
    return "ok";
  }
  const STAT={
    ok:   {t:"налаштовано", c:"var(--green)", b:""},
    noid: {t:"без клік-айді", c:"var(--gold)", b:"warn"},
    nopb: {t:"без постбеку", c:"var(--red)", b:"dead"},
    nonet:{t:"без партнерки", c:"var(--red)", b:"dead"},
  };

  function netsData(){
    const from=state.fromIdx, to=state.toIdx;
    // трафік за вибраний період по парі офер×команда
    const tr=new Map();
    for(const r of D.od){ const di=r[0]; if(di<from||di>to) continue;
      const k=r[1]+"|"+r[8]; let a=tr.get(k); if(!a){a=[0,0];tr.set(k,a);} a[0]+=r[2]; a[1]+=r[3]; }
    const lc=lastConvByOffer();

    // псевдо-мережа «без партнерки» — своя на кожну команду
    const extra=new Map();
    const rows=NETS.map((n,i)=>({ni:i,name:n[0],ti:n[1],pb:n[2],par:n[3],offers:[],clicks:0,conv:0,withTraf:0,ownMacro:0,last:-1}));
    const get=(ni,ti)=>{
      if(ni>=0) return rows[ni];
      const k="x"+ti; let r=extra.get(k);
      if(!r){ r={ni:-1,name:"— без партнерки —",ti,pb:0,par:0,offers:[],clicks:0,conv:0,withTraf:0,ownMacro:0,last:-1,virtual:1}; extra.set(k,r); }
      return r;
    };
    for(const o of NOFF){
      if(!teamOK(o[2])) continue;
      const r=get(o[3],o[2]); if(!r) continue;
      const oi=o[0], k=oi>=0?oi+"|"+o[2]:null;
      const t=k?tr.get(k):null;
      const cl=t?t[0]:0, cv=t?t[1]:0;
      const last=k&&lc.has(k)?lc.get(k):-1;
      r.offers.push({name: oi>=0 ? (D.offers[oi]||"") : o[1], st:offStatus(o), clicks:cl, conv:cv, last});
      r.clicks+=cl; r.conv+=cv; if(cl>0) r.withTraf++; if(o[4]) r.ownMacro++;
      if(last>r.last) r.last=last;
    }
    const all=[...rows.filter(r=>teamOK(r.ti)), ...extra.values()].filter(r=>r.offers.length);
    // проблемні — нагору, далі за обсягом
    all.sort((a,b)=>{
      const pa=(!a.pb?2:(a.offers.some(o=>o.st==="noid")?1:0)), pb_=(!b.pb?2:(b.offers.some(o=>o.st==="noid")?1:0));
      if(pa!==pb_) return pb_-pa;
      return b.clicks-a.clicks;
    });
    // KPI рахуємо по всьому набору, а не по відфільтрованому — інакше
    // «кліків повз постбек» завжди показувало б 100% у фільтрі «без постбеку»
    let shown=all;
    if(netQ){ const q=netQ.toLowerCase();
      shown=shown.filter(r=>r.name.toLowerCase().includes(q)||r.offers.some(o=>o.name.toLowerCase().includes(q))); }
    if(netFilt==="nopb") shown=shown.filter(r=>!r.pb);
    else if(netFilt==="noid") shown=shown.filter(r=>r.pb&&r.offers.some(o=>o.st==="noid"));
    else if(netFilt==="traf") shown=shown.filter(r=>r.clicks>0);
    return {all, shown};
  }

  function renderNets(){
    const {all:allRows, shown:rows}=netsData();
    const mine=NETS.filter(n=>teamOK(n[1]));
    const badNets=mine.filter(n=>!n[2]).length;
    const badOff=NOFF.filter(o=>teamOK(o[2])&&(offStatus(o)==="nopb"||offStatus(o)==="nonet")).length;
    const riskClicks=allRows.filter(r=>!r.pb).reduce((s,r)=>s+r.clicks,0);
    const totClicks=allRows.reduce((s,r)=>s+r.clicks,0);
    document.getElementById("netKpis").innerHTML=[
      {lbl:"Партнерок",v:fmtInt(mine.length),c:"var(--blue)"},
      {lbl:"Без постбеку",v:fmtInt(badNets),c:badNets?"var(--red)":"var(--green)"},
      {lbl:"Оферів без постбеку",v:fmtInt(badOff)+" / "+fmtInt(NOFF.filter(o=>teamOK(o[2])).length),c:badOff?"var(--red)":"var(--green)"},
      {lbl:"Кліків повз постбек",v:fmtInt(riskClicks),c:riskClicks?"var(--gold)":"var(--green)",
        hint:"за вибраний період; у дужках — частка всього трафіку",
        sub:totClicks?`${(riskClicks/totClicks*100).toFixed(1)}% трафіку за період`:""},
    ].map(k=>`<div class="kpi" style="--accent:${k.c}"${k.hint?` title="${k.hint}"`:""}><div class="lbl">${k.lbl}</div>`+
      `<div class="val mono">${k.v}</div>${k.sub?`<div class="dl flat">${k.sub}</div>`:""}</div>`).join("");

    const dayTxt=(i)=> i>=0 ? D.days[i].slice(8,10)+"."+D.days[i].slice(5,7) : "—";
    const head=["Мережа","Постбек","Клік-айді","Оферів","З трафіком","Кліки","Конверсії","Остання конв."];
    const body=rows.map(r=>{
      const open=netOpen.has(r.ti+"|"+r.ni);
      const partial = r.pb && !r.par && r.ownMacro>0 && r.ownMacro<r.offers.length;
      const idCell = !r.pb ? `<span class="zero">—</span>`
        : (r.par ? `<span class="ok">✓</span>`
          : (r.ownMacro ? `<span style="color:var(--gold)">${partial?`${r.ownMacro}/${r.offers.length}`:"✓ в оферах"}</span>`
            : `<span style="color:var(--red)">⛔</span>`));
      const main=`<tr class="netrow" data-k="${r.ti}|${r.ni}">
        <td><span class="caret">${open?"▾":"▸"}</span> <span class="site">${esc(r.name)}</span>`+
        `${(state.team<0&&nTeams>1)?` <span class="chip tm" title="${esc(D.teams[r.ti]||"")}">${teamShort(r.ti)}</span>`:""}</td>
        <td>${r.pb?`<span class="ok">✓</span>`:`<span class="badge dead">немає</span>`}</td>
        <td>${idCell}</td>
        <td class="mono">${fmtInt(r.offers.length)}</td>
        <td class="mono ${r.withTraf?"":"zero"}">${r.withTraf||"0"}</td>
        <td class="mono ${r.clicks?"":"zero"}">${r.clicks?fmtInt(r.clicks):"—"}</td>
        <td class="mono ${r.conv?"conv-badge":"zero"}">${r.conv||"0"}</td>
        <td class="mono ${r.last>=0?"":"zero"}">${dayTxt(r.last)}</td></tr>`;
      if(!open) return main;
      const offs=r.offers.slice().sort((a,b)=>b.clicks-a.clicks).slice(0,200);
      const sub=offs.map(o=>{
        const s=STAT[o.st];
        return `<tr class="nolink suboff"><td style="padding-left:30px">${esc(o.name)}</td>
          <td colspan="2">${s.b?`<span class="badge ${s.b}">${s.t}</span>`:`<span class="ok">✓</span>`}</td>
          <td colspan="2"></td>
          <td class="mono ${o.clicks?"":"zero"}">${o.clicks?fmtInt(o.clicks):"—"}</td>
          <td class="mono ${o.conv?"conv-badge":"zero"}">${o.conv||"0"}</td>
          <td class="mono ${o.last>=0?"":"zero"}">${dayTxt(o.last)}</td></tr>`;
      }).join("");
      const more=r.offers.length>200?`<tr class="nolink suboff"><td colspan="8" class="emptycell">показано 200 з ${fmtInt(r.offers.length)} оферів — звузь пошуком</td></tr>`:"";
      return main+sub+more;
    }).join("");

    const nReal=rows.filter(r=>!r.virtual).length, nVirt=rows.length-nReal;
    document.getElementById("netSub").textContent =
      `${nReal} ${plural(nReal,["мережа","мережі","мереж"])}${nVirt?` + офери без партнерки`:""} · трафік за ${state.mode==="day"?D.days[state.dayIdx]:(state.mode==="all"?"весь період":"останні "+state.mode+" дн")} · клікни по рядку, щоб побачити офери`;
    document.getElementById("netTbl").innerHTML=
      `<thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`+
      `<tbody>${body||`<tr class="nolink"><td colspan="8" class="emptycell">Нічого не знайдено.</td></tr>`}</tbody>`;
    document.querySelectorAll("#netTbl .netrow").forEach(tr=>tr.onclick=()=>{
      const k=tr.dataset.k; if(netOpen.has(k)) netOpen.delete(k); else netOpen.add(k); renderNets();
    });
  }

  function render(){
    setRange(); renderChip();
    const f=state.filter;
    const scopeTxt = f.active ? ` · ${f.type==="brand"?"бренд":"сайт"} “${esc(f.q)}”` : "";
    const rangeTxt = state.mode==="day"?`день ${D.days[state.dayIdx]}`:state.mode==="all"?"весь період":`останні ${state.mode} дн`;
    document.getElementById("chartTitle").textContent=`Трафік · ${rangeTxt}${scopeTxt}`;
    if(state.tab==="net"){ renderNets(); return; }
    MV=moversData();
    renderKpis(); renderTeamCards(); renderDigest(); renderMovers();
    renderChart(); renderSites(); renderBrands(); renderPosPages(); renderConv(); renderGeo(); renderPrefOs();
  }

  // початковий стан з URL: #brand:назва / #site:назва / #page:сторінка (можна через ;)
  (function initFromHash(){
    const h=decodeURIComponent(location.hash.replace(/^#/,""));
    h.split(";").forEach(part=>{
      const m=part.match(/^(site|brand|page):(.+)$/);
      if(!m) return;
      if(m[1]==="page"){ const gi=D.pages.indexOf(m[2]); if(gi>=0) state.selectedPage=gi; }
      else { state.filter.type=m[1]; state.filter.match="partial"; state.filter.q=m[2]; fq.value=m[2]; }
    });
    const tm=h.match(/(?:^|;)team:(\d+)/); if(tm){ const t=+tm[1]; if(t>=0&&t<nTeams) state.team=t; }
    if(/(?:^|;)tab:net/.test(h)) state.tab="net";
    if(state.filter.q) computeFilter();
  })();

  syncSeg(); syncFilterUI(); syncTeam(); syncMv(); syncTab(); syncNetFilt(); render();
}
</script>
<script>
// ── bootstrap: plaintext (локально) / пароль + AES-GCM (онлайн) ───────────────
(async function(){
  const app = document.getElementById("app");

  // Локальний режим: дані вшиті напряму
  if (window.KT_DATA){ KT_boot(window.KT_DATA); return; }

  const enc = window.KT_ENC;
  if (!enc){
    app.innerHTML = `<div class="empty">
      <h1>📊 Дашборд ще не наповнено даними</h1>
      <p>Це шаблон. Щоб завантажити історію з Keitaro, запусти в цій папці:</p>
      <p><code>node fetch.mjs</code></p></div>`;
    return;
  }

  const KDF = window.KT_KDF || { iter: 200000 };
  const b64ToBytes = (b64)=>{ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };

  async function decrypt(password){
    const raw = b64ToBytes(enc);
    const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
    const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt, iterations:KDF.iter, hash:"SHA-256" },
      keyMat, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function loginScreen(msg){
    app.innerHTML = `<div class="empty">
      <h1>🔒 Keitaro · Pulse</h1>
      <p>Введи пароль, щоб відкрити звіт.</p>
      <form id="lf" style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap">
        <input id="lp" type="password" autocomplete="current-password" placeholder="пароль"
          style="background:var(--bg2);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:15px;padding:11px 15px;border-radius:10px;min-width:240px">
        <button type="submit"
          style="background:linear-gradient(135deg,var(--blue),#3a7fe0);color:#08101f;border:0;font:inherit;font-weight:700;font-size:15px;padding:11px 22px;border-radius:10px;cursor:pointer">Увійти</button>
      </form>
      <div id="lerr" style="color:var(--red);font-size:13px;margin-top:14px;min-height:18px">${msg||""}</div></div>`;
    const form=document.getElementById("lf"), inp=document.getElementById("lp");
    inp.focus();
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const btn=form.querySelector("button"); btn.disabled=true; btn.textContent="Розшифровую…";
      try{
        const D = await decrypt(inp.value);
        try{ sessionStorage.setItem("kt_pw", inp.value); }catch(_){}
        KT_boot(D);
      }catch(err){
        loginScreen("Невірний пароль. Спробуй ще раз.");
      }
    });
  }

  // авто-вхід у межах вкладки (пароль зберігається лише в sessionStorage)
  let saved=null; try{ saved=sessionStorage.getItem("kt_pw"); }catch(_){}
  if (saved){
    try{ KT_boot(await decrypt(saved)); return; }
    catch(_){ try{ sessionStorage.removeItem("kt_pw"); }catch(__){} }
  }
  loginScreen("");
})();
</script>
