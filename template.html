<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keitaro • Pulse</title>
<style>
  :root{
    --bg:#0e131f; --bg2:#131a29;
    --panel:rgba(24,31,46,.72); --panel-solid:#181f2e; --elev:#212a3e;
    --border:rgba(72,88,124,.32); --border-hi:rgba(79,157,255,.45);
    --fg:#e9edf6; --dim:#98a3ba; --faint:#7c879e;
    --blue:#4f9dff; --cyan:#38d6e0; --green:#48d597; --gold:#f4b73d; --red:#f2565b; --purple:#b578f0;
    /* Категорійні слоти = ідентичність (команда). Порядок фіксований і ніколи
       не крутиться по колу; колір закріплений за командою, а не за її місцем у
       рейтингу. Набір прогнаний валідатором на цьому ж фоні: всі шість у смузі
       світлості для темної теми, найгірша сусідня пара ΔE 11.1 (protan),
       10.7 (tritan), контраст до фону ≥3:1. */
    --s1:#338ced; --s2:#e76624; --s3:#00a888; --s4:#d28e05; --s5:#e24d8b; --s6:#9887ef;
    /* Статус = лише стан, ніколи як серія. Завжди зі стрілкою/словом поруч,
       щоб сенс не тримався на самому кольорі. */
    --good:#0aac23; --good-ink:#53c556; --warn:#fbb315; --crit:#dc3c3d; --crit-ink:#f2565b;
    --grid:rgba(120,140,180,.16); --axis:rgba(120,140,180,.32);
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,"Segoe UI",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(at 18% -5%, rgba(59,110,220,.20) 0, transparent 45%),
      radial-gradient(at 88% 108%, rgba(40,190,200,.14) 0, transparent 45%);
    background-attachment:fixed; min-height:100vh;
  }
  @media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  a{color:var(--blue);text-decoration:none}

  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(14,19,31,.97),rgba(14,19,31,.86));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border); padding:12px 22px;
  }
  .hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hrow+.hrow{margin-top:11px}
  header .seg,header .day{flex-shrink:0}
  header{transition:padding .15s}
  header.tight{padding:7px 22px}
  header.tight .brand .sub,header.tight .meta{display:none}
  @media(max-width:1000px){
    header{padding:10px 14px}
    /* На вузькому шапка розросталась до третини екрана і ще й липла зверху.
       Тепер кожен ряд — смуга з горизонтальною прокруткою. */
    .hrow{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:10px;scrollbar-width:none;-ms-overflow-style:none}
    .hrow::-webkit-scrollbar{display:none}
    /* смуга прокручується — але вкладки лишаються прибитими до лівого краю,
       інакше після тапу по «30 дн» не видно, на якій ти вкладці */
    #tabSeg{position:sticky;left:0;z-index:2;background:var(--bg);box-shadow:8px 0 12px -8px rgba(0,0,0,.8)}
    /* кнопка оновлення теж лишається на видноті — по неї тягнуться саме тоді,
       коли дані застрягли, і шукати її прокруткою було б знущанням */
    #refreshBtn{position:sticky;right:0;z-index:2;box-shadow:-8px 0 12px -8px rgba(0,0,0,.8)}
    .brand{margin-right:4px}
    main .phead{flex-direction:column;align-items:flex-start;gap:10px}
    main .phead .tools,main .phead .seg{width:100%}
    .brand .sub{display:none}
    .meta{display:none}
    .fq{min-width:170px}
    body main{padding:14px}
  }
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--cyan));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b1018;font-size:18px;
    box-shadow:0 0 22px rgba(79,157,255,.4)}
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
  .meta{font-size:11px;color:var(--faint);text-align:right;line-height:1.5;margin-left:auto}
  .meta b{color:var(--dim);font-weight:600}

  .seg{display:inline-flex;background:var(--panel-solid);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg button{background:transparent;border:0;color:var(--dim);font:inherit;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:7px;cursor:pointer;transition:.15s;white-space:nowrap}
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:linear-gradient(135deg,var(--blue),#3a7fe0);color:#08101f;box-shadow:0 2px 10px rgba(79,157,255,.35)}
  .seg.alt button.on{background:linear-gradient(135deg,var(--purple),#8a5be0)}
  .seg.tm button.on{background:linear-gradient(135deg,var(--s1),#2a6fc4);color:#eaf3ff}
  .chip.tm{background:color-mix(in srgb,var(--hue,var(--s1)) 15%,transparent);color:var(--hue,var(--s1));
    border-color:color-mix(in srgb,var(--hue,var(--s1)) 34%,transparent)}
  select.day{background:var(--panel-solid);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:12.5px;
    padding:7px 11px;border-radius:9px;cursor:pointer}
  select.day:focus{outline:none;border-color:var(--border-hi)}

  .flabel{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-right:-4px}
  input.fq{background:var(--panel-solid);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:13px;
    padding:8px 13px;border-radius:9px;min-width:260px;flex:1;max-width:420px}
  input.fq:focus{outline:none;border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(79,157,255,.12)}
  #fchip{margin-left:auto;display:flex;align-items:center;gap:8px}
  .active-chip{display:inline-flex;align-items:center;gap:9px;font-size:12px;
    background:rgba(79,157,255,.12);border:1px solid var(--border-hi);border-radius:20px;padding:5px 6px 5px 13px;font-weight:600}
  .active-chip.brand{background:rgba(181,120,240,.14);border-color:rgba(181,120,240,.5)}
  .active-chip .x{cursor:pointer;width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.08);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg)}
  .active-chip .x:hover{background:var(--red);color:#fff}
  .active-chip .cnt{color:var(--dim);font-weight:500;font-size:11px}

  main{padding:18px 22px 60px;max-width:1500px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);
    padding:15px 16px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue))}
  .kpi .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpi .val{font-size:26px;font-weight:700;margin-top:7px;line-height:1}
  .kpi .dl{font-size:11.5px;margin-top:7px;font-weight:600;display:flex;align-items:center;gap:5px}
  .up{color:var(--good-ink)} .down{color:var(--crit-ink)} .flat{color:var(--faint)}

  .grid{display:grid;gap:16px;margin-bottom:16px}
  /* min-width:0 — інакше таблиця з nowrap розпирає свою колонку і всю сторінку */
  .grid>*,.lead>*,.tiles>*,.panel,.tbl-wrap{min-width:0}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:2fr 1fr;align-items:start}
  @media(max-width:1050px){.g2,.g3{grid-template-columns:1fr}}
  .panel{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px}
  .panel h2{font-size:13.5px;margin:0;font-weight:700;letter-spacing:.2px}
  .panel .psub{font-size:11.5px;color:var(--dim);margin-top:2px}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
  .tag-all{font-size:10px;color:var(--faint);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-weight:600;white-space:nowrap}

  .tools{display:flex;gap:8px;align-items:center}
  input.search{background:var(--bg2);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:12px;
    padding:6px 10px;border-radius:8px;width:140px}
  input.search:focus{outline:none;border-color:var(--border-hi)}
  /* Вертикального скролу всередині картки немає: у коробці на 460px ніхто не
     гортає 150 рядків. Замість цього показуємо 25 і кнопку «показати всі». */
  .tbl-wrap{overflow:auto;margin:0 -4px}
  .morebtn{display:block;width:100%;margin-top:10px;padding:8px;background:var(--bg2);border:1px solid var(--border);
    border-radius:9px;color:var(--dim);font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
  .morebtn:hover{color:var(--fg);border-color:var(--border-hi)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 9px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    cursor:pointer;user-select:none;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel-solid);z-index:1}
  th:hover{color:var(--fg)}
  th.sorted::after{content:" ↓";color:var(--blue)}
  th.sorted.asc::after{content:" ↑"}
  tbody tr{border-bottom:1px solid rgba(72,88,124,.14);cursor:pointer}
  tbody tr:hover{background:rgba(79,157,255,.07)}
  tbody tr.nolink{cursor:default}
  td .site{font-weight:600;color:var(--fg)}
  .chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600;
    background:rgba(79,157,255,.14);color:var(--blue);border:1px solid rgba(79,157,255,.25)}
  .chip.geo{background:rgba(56,214,224,.13);color:var(--cyan);border-color:rgba(56,214,224,.25)}
  .conv-badge{color:var(--s2);font-weight:700}
  .zero{color:var(--faint)}
  .bar-cell{position:relative}
  .bar-cell .bar{position:absolute;left:0;top:50%;transform:translateY(-50%);height:60%;border-radius:3px;opacity:.16;background:var(--blue);z-index:0}
  .bar-cell span{position:relative;z-index:1}
  .emptycell{color:var(--faint);padding:18px 6px}

  .dist{display:flex;flex-direction:column;gap:9px}
  .dist .row{display:flex;align-items:center;gap:11px}
  .dist .name{width:130px;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
  .dist .track{flex:1;height:8px;background:var(--bg2);border-radius:5px;overflow:hidden}
  .dist .fill{height:100%;border-radius:5px;background:var(--s1)}
  .dist .v{width:92px;text-align:right;font-size:12px;color:var(--dim)}
  .dist-head{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);text-transform:uppercase;
    letter-spacing:.5px;font-weight:700;padding-bottom:7px;margin-bottom:3px;border-bottom:1px solid var(--border)}
  .drow{cursor:pointer;border-radius:7px;transition:background .12s}
  .drow:hover{background:rgba(79,157,255,.09)}
  .drow.sel{background:rgba(181,120,240,.16);box-shadow:inset 2px 0 0 var(--purple)}
  .sublabel{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin:2px 0}

  .foot{color:var(--faint);font-size:11px;text-align:center;margin-top:26px}
  .empty{max-width:620px;margin:14vh auto;text-align:center;background:var(--panel);border:1px solid var(--border);
    border-radius:18px;padding:40px 34px}
  .empty h1{font-size:22px;margin:0 0 6px}
  .empty code{background:var(--bg2);padding:3px 9px;border-radius:6px;font-family:var(--mono);color:var(--cyan);font-size:14px}
  .empty p{color:var(--dim);line-height:1.7}

  .chart-wrap{position:relative}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:rgba(16,22,35,.96);border:1px solid var(--border-hi);
    border-radius:9px;padding:8px 11px;font-size:11.5px;line-height:1.6;opacity:0;transition:opacity .1s;
    box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5;white-space:nowrap}
  .tip b{color:var(--fg)} .tip .k{color:var(--dim)}
  .legend{display:flex;gap:16px;font-size:11.5px;color:var(--dim);margin-top:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .hint{font-size:11px;color:var(--faint);margin-top:10px;text-align:center}

  /* ── динаміка: картки команд, дайджест, рух брендів ─────────────────────── */
  .tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-bottom:16px}
  .tcard{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px 10px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
  .tcard:hover{transform:translateY(-2px);border-color:var(--border-hi)}
  .tcard.on{border-color:rgba(72,213,151,.55);box-shadow:0 0 0 1px rgba(72,213,151,.22),0 8px 22px rgba(0,0,0,.28)}
  .tcard .tn{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.55px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tcard .tv{font-size:23px;font-weight:700;font-family:var(--mono);margin-top:6px;line-height:1}
  .tcard .tx{font-size:11px;color:var(--faint);margin-top:6px;display:flex;gap:9px;flex-wrap:wrap}
  .tcard .tx b{color:var(--dim);font-weight:600}
  .spark{display:block;width:100%;height:30px;margin-top:8px}
  .dchip{font-family:var(--mono);font-size:11.5px;font-weight:700;white-space:nowrap}

  .digest{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .digest li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;color:var(--dim)}
  .digest li .ic{flex-shrink:0;width:20px;text-align:center}
  .digest b{color:var(--fg);font-weight:600}
  .digest .q{cursor:pointer;border-bottom:1px dashed var(--border-hi);color:var(--fg);font-weight:600}
  .digest .q:hover{color:var(--blue);border-bottom-color:var(--blue)}

  .badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:5px;
    background:var(--bg2);color:var(--dim);border:1px solid var(--border);font-family:inherit}
  .badge.new{color:var(--good-ink);border-color:rgba(83,197,86,.34);background:rgba(83,197,86,.1)}
  .badge.dead{color:var(--crit-ink);border-color:rgba(242,86,91,.32);background:rgba(242,86,91,.1)}
  .badge.warn{color:var(--warn);border-color:rgba(251,179,21,.32);background:rgba(251,179,21,.1)}
  .mvempty{font-size:12px;color:var(--faint);padding:12px 2px}

  /* підсумковий рядок: ростемо ми взагалі чи ні */
  .mvnet{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;
    font-weight:700;padding:10px 12px;margin-bottom:13px;border:1px solid var(--border);border-radius:10px;
    background:rgba(19,26,41,.5)}
  .mvnet .npart{display:inline-flex;align-items:baseline;gap:6px}
  .mvnet .npart i{color:var(--faint);font-weight:500;font-style:normal;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .mvnet .nres{margin-left:auto}
  @media(max-width:700px){
    .mvnet{flex-direction:column;align-items:flex-start;gap:6px}
    .mvnet .nres{margin-left:0;padding-top:6px;border-top:1px solid var(--border);width:100%}
  }

  /* розхідні смуги від спільної нульової лінії */
  .dvhead,.dvrow{display:grid;grid-template-columns:1.9fr 2fr .95fr .6fr 1.2fr;gap:12px;align-items:center}
  .dvhead{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700;
    padding:0 9px 8px;border-bottom:1px solid var(--border)}
  .dvhead>span:not(:first-child):not(.dvaxis){text-align:right}
  .dvaxis{display:flex;justify-content:space-between;font-style:normal}
  .dvaxis i{font-style:normal}
  .dvlist{display:flex;flex-direction:column;gap:1px;margin-top:4px}
  .dvrow{padding:8px 9px;border-radius:9px;cursor:pointer;transition:background .12s}
  .dvrow:hover,.dvrow:focus-visible{background:rgba(79,157,255,.08)}
  .dvname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dvbar{position:relative;height:9px;border-radius:3px;
    background:linear-gradient(90deg,transparent calc(50% - .5px),var(--axis) calc(50% - .5px),
      var(--axis) calc(50% + .5px),transparent calc(50% + .5px))}
  .dvbar i{position:absolute;top:0;height:100%}
  .dvbar i.pos{left:50%;background:var(--good);border-radius:0 4px 4px 0}
  .dvbar i.neg{right:50%;background:var(--crit);border-radius:4px 0 0 4px}
  .dvd,.dvpct,.dvflow{text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .dvpct{color:var(--dim);font-weight:600}
  .dvflow{color:var(--faint);font-weight:500;font-size:11.5px}
  .dvsplit{display:flex;align-items:center;gap:10px;margin:9px 2px;font-size:10px;text-transform:uppercase;
    letter-spacing:.5px;color:var(--faint);font-weight:700}
  .dvsplit::before,.dvsplit::after{content:"";flex:1;height:1px;background:var(--border)}

  /* клікають, не конвертять */
  .nclist{display:flex;flex-direction:column;gap:3px}
  .ncrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:8px 9px;border-radius:9px;cursor:pointer;transition:background .12s}
  .ncrow:hover,.ncrow:focus-visible{background:rgba(251,179,21,.08)}
  .ncname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ncname .chip,.dvname .chip{margin-left:4px}
  .ncv{font-size:12.5px;font-weight:700;color:var(--warn);text-align:right;font-variant-numeric:tabular-nums}
  .nctrack{grid-column:1/3;height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
  .nctrack i{display:block;height:100%;background:var(--warn);border-radius:4px}
  .ncwas{grid-column:1/3;font-size:10.5px;color:var(--faint)}

  @media(max-width:1050px){
    .dvhead,.dvrow{grid-template-columns:1.6fr 1.4fr .9fr .6fr}
    .dvflow{display:none}
  }
  @media(max-width:700px){
    .dvhead,.dvrow{grid-template-columns:1.5fr 1fr .7fr}
    .dvbar{display:none}
    .dvhead>span:nth-child(2){display:none}
  }
  /* ── головний блок ─────────────────────────────────────────────────────── */
  .lead{display:grid;grid-template-columns:1.15fr 2fr;gap:16px;margin-bottom:13px}
  @media(max-width:1050px){.lead{grid-template-columns:1fr}}
  .hero{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);
    padding:17px 19px 9px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .hlbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700}
  .hrange{color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0;margin-left:7px}
  /* герой-число — тим самим шрифтом, пропорційні цифри: tabular на такому
     кеглі робить число «дірявим» */

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

  @media(max-width:700px){.tiles{grid-template-columns:1fr}}
  .morekpi{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:16px;
    padding:10px 16px;border:1px solid var(--border);border-radius:11px;background:rgba(19,26,41,.45)}
  .morekpi b{color:var(--fg);font-family:var(--mono);font-weight:700;margin-left:3px}

  /* ── список команд ─────────────────────────────────────────────────────── */
  .tlist{display:flex;flex-direction:column;gap:1px}
  .thead,.trow{display:grid;grid-template-columns:1.5fr 2fr .9fr 1fr .9fr .8fr 1.1fr 96px;gap:13px;align-items:center}
  .thead{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700;
    padding:0 9px 8px;margin-bottom:3px;border-bottom:1px solid var(--border)}
  .thead span:not(:first-child){text-align:right}
  .thead span:nth-child(2){text-align:left}
  .trow{padding:9px;border-radius:9px;cursor:pointer;transition:background .12s}
  .trow:hover{background:rgba(79,157,255,.08)}
  .trow.on{background:color-mix(in srgb,var(--hue) 12%,transparent);box-shadow:inset 2px 0 0 var(--hue)}
  .tname{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap}
  .tdot{width:9px;height:9px;border-radius:3px;flex-shrink:0;background:var(--hue)}
  .tbar{height:9px;background:var(--bg2);border-radius:5px;overflow:hidden}
  .tbar i{display:block;height:100%;border-radius:5px;background:var(--hue)}
  .tnum{font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .tsp{height:28px}
  .tsp .spark{height:28px}
  @media(max-width:1050px){
    .thead,.trow{grid-template-columns:1.5fr .9fr .9fr .8fr;gap:8px}
    .tbar,.tsp,.tcr,.trev,.thead span:nth-child(2),.thead span:nth-child(6),
    .thead span:nth-child(7),.thead span:nth-child(8){display:none}
  }

  /* ── шухляда з другорядними блоками ────────────────────────────────────── */
  .drawer{border:1px solid var(--border);border-radius:var(--radius);background:rgba(19,26,41,.4);margin-bottom:16px}
  .drawer>summary{cursor:pointer;padding:14px 18px;font-size:12.5px;font-weight:700;color:var(--dim);
    list-style:none;display:flex;align-items:center;gap:9px;user-select:none}
  .drawer>summary::-webkit-details-marker{display:none}
  .drawer>summary::before{content:"▸";color:var(--faint);font-size:11px}
  .drawer[open]>summary::before{content:"▾"}
  .drawer>summary:hover{color:var(--fg)}
  .drawer .inner{padding:0 14px 6px}
  .drawer .grid{margin-bottom:14px}

  /* Клікабельні рядки — це div-и; без цього вони недосяжні з клавіатури,
     а стандартна обводка на темному фоні майже не видно. */
  :focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:7px}
  .trow:focus-visible,.dvrow:focus-visible,.ncrow:focus-visible,.netrow:focus-visible{background:rgba(79,157,255,.1)}

  /* ── ручне оновлення ───────────────────────────────────────────────────── */
  .refresh{display:inline-flex;align-items:center;gap:7px;background:var(--panel-solid);border:1px solid var(--border);
    border-radius:10px;padding:6px 11px;color:var(--dim);font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    flex-shrink:0;transition:color .12s,border-color .12s}
  .refresh:hover{color:var(--fg);border-color:var(--border-hi)}
  .refresh.stale{color:var(--warn);border-color:rgba(251,179,21,.42)}
  .refresh.old{color:var(--crit-ink);border-color:rgba(242,86,91,.48)}
  .refresh .rico{font-size:13px;line-height:1;display:inline-block}
  .refresh.busy .rico{animation:ktspin 1s linear infinite}
  @keyframes ktspin{to{transform:rotate(360deg)}}

  .modal{position:fixed;inset:0;z-index:60;background:rgba(6,9,16,.74);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal[hidden]{display:none}
  .mbox{background:var(--panel-solid);border:1px solid var(--border-hi);border-radius:16px;max-width:580px;width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:88vh;overflow:auto}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px;gap:10px}
  .mhead h3{margin:0;font-size:16px;font-weight:700}
  .mx{background:transparent;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:4px 9px;border-radius:7px}
  .mx:hover{color:var(--fg);background:var(--bg2)}
  .mbody{padding:0 20px 20px;font-size:13px;line-height:1.65;color:var(--dim)}
  .mbody p{margin:0 0 12px}
  .mbody b{color:var(--fg);font-weight:600}
  .mbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg2);color:var(--fg);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
  .mbtn:hover{border-color:var(--border-hi)}
  .mbtn.primary{background:linear-gradient(135deg,var(--s1),#2a6fc4);border-color:transparent;color:#eaf3ff}
  .mbtn:disabled{opacity:.55;cursor:default}
  .mrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}
  .mnote{font-size:11.5px;color:var(--faint);line-height:1.6}
  .minput{flex:1;min-width:210px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    color:var(--fg);font:inherit;font-size:12.5px;font-family:var(--mono)}
  .mstatus{margin-top:14px;padding:11px 13px;border-radius:9px;background:var(--bg2);border:1px solid var(--border);
    font-size:12.5px;font-family:var(--mono);line-height:1.6}

  .caret{color:var(--faint);font-size:10px;display:inline-block;width:10px}
  .ok{color:var(--good-ink);font-weight:700}
  tr.netrow{cursor:pointer}
  tr.suboff td{background:rgba(10,14,24,.45);font-size:12px;color:var(--dim);border-bottom-color:rgba(72,88,124,.16)}
</style>
</head>
<body>
<div id="app"></div>

<script>/*__KT_DATA__*/</script>
<script>
function KT_boot(D){
  const app = document.getElementById("app");

  // ── helpers ──────────────────────────────────────────────────────────────
  const N = D.days.length;
  const fmtInt = n => Math.round(n).toLocaleString("uk-UA").replace(/,/g," ");
  const fmtMoney = n => "$"+ Math.round(n).toLocaleString("uk-UA").replace(/,/g," ");
  const fmtPct = n => n.toFixed(2)+"%";
  const shortDay = d => d.slice(5);
  const div = (a,b)=> b>0 ? a/b : 0;
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cmp = (a,b)=> typeof a==="string" ? (a<b?-1:a>b?1:0) : (a||0)-(b||0);
  // Коротка мітка команди в таблиці сайтів. Назва, що закінчується номером,
  // стискається до "К<номер>"; решта — ПЕРШЕ СЛОВО, а не перші 6 символів,
  // інакше назва з двох слів обрізалась посеред першого. Повна — в title.
  // (Без реальних назв: цей файл їде в публічну збірку відкритим текстом.)
  const teamShort = (i)=>{
    const n=(D.teams&&D.teams[i])||"";
    const m=n.match(/(\d+)\s*$/); if(m) return "К"+m[1];
    const w=(n.trim().split(/\s+/)[0]||n);
    return w.length<=10 ? w : w.slice(0,9)+"…";
  };

  // Колір закріплений за командою (ідентичність), а не за її місцем у рейтингу:
  // після фільтра «вцілілі» не перефарбовуються. Понад шість команд кольором не
  // розрізняємо — сьомий відтінок під дальтонізмом не відрізнити від наявного.
  const TPAL=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
  const teamHue=i=> (i>=0 && i<TPAL.length) ? TPAL[i] : "var(--dim)";
  const teamChip=i=>`<span class="chip tm" style="--hue:${teamHue(i)}" title="${esc((D.teams&&D.teams[i])||"")}">${teamShort(i)}</span>`;

  const campTeam = D.camps.map(c=>c[4]);   // campIdx → teamIdx
  const nTeams = (D.teams||["—"]).length;

  // ── state ──────────────────────────────────────────────────────────────────
  const state = {
    tab:"ov", mode:"30", fromIdx:0, toIdx:N-1, dayIdx:N-1, selectedPage:null, team:-1,  // team: -1 = усі
    filter:{ type:"site", match:"partial", q:"", active:false, campSet:null, offerSet:null }
  };
  const teamOK = (t)=> state.team<0 || t===state.team;

  function setRange(){
    if(state.mode==="all"){ state.fromIdx=0; state.toIdx=N-1; }
    else if(state.mode==="day"){ state.fromIdx=state.dayIdx; state.toIdx=state.dayIdx; }
    else { const k=+state.mode; state.toIdx=N-1; state.fromIdx=Math.max(0,N-k); }
  }

  function computeFilter(){
    const f=state.filter;
    if(!f.q.trim()){ f.active=false; f.campSet=null; f.offerSet=null; return; }
    f.active=true;
    const q=f.q.trim().toLowerCase();
    const test = f.match==="exact" ? s=>String(s).toLowerCase()===q : s=>String(s).toLowerCase().includes(q);
    if(f.type==="site"){
      const cs=new Set();
      D.camps.forEach((c,ci)=>{ if(teamOK(c[4]) && test(c[1])) cs.add(ci); });
      const os=new Set();
      for(const r of D.rel){ if(cs.has(r[0])) os.add(r[1]); }
      f.campSet=cs; f.offerSet=os;
    }else{
      const os=new Set();
      D.offers.forEach((o,oi)=>{ if(test(o)) os.add(oi); });
      const cs=new Set();
      for(const r of D.rel){ if(os.has(r[1]) && teamOK(campTeam[r[0]])) cs.add(r[0]); }
      f.offerSet=os; f.campSet=cs;
    }
  }

  // ── aggregation (range-aware, from day-level cd/od) ─────────────────────────
  // per-day series [clicks,conv,leads,sales,rev] respecting the active filter
  // per-day: [clicks,conv,leads,sales,rev,saleRev] — з урахуванням команди + фільтра
  function seriesData(){
    const f=state.filter, per=Array.from({length:N},()=>[0,0,0,0,0,0]);
    if(f.active && f.type==="brand"){
      for(const r of D.od){ if(!f.offerSet.has(r[1])||!teamOK(r[8])) continue; const d=per[r[0]]; d[0]+=r[2];d[1]+=r[3];d[2]+=r[4];d[3]+=r[5];d[4]+=r[6];d[5]+=r[7]; }
    }else if(f.active && f.type==="site"){
      for(const r of D.cd){ if(!f.campSet.has(r[1])||!teamOK(campTeam[r[1]])) continue; const d=per[r[0]]; d[0]+=r[2];d[1]+=r[3];d[2]+=r[4];d[3]+=r[5];d[4]+=r[6];d[5]+=r[7]; }
    }else{
      for(let t=0;t<nTeams;t++){ if(!teamOK(t)) continue; const tt=D.totals[t]; if(!tt) continue;
        for(let i=0;i<N;i++){ const s=tt[i], d=per[i]; for(let j=0;j<6;j++) d[j]+=s[j]; } }
    }
    return per;
  }
  function sumRange(per,from,to){ const s=[0,0,0,0,0,0]; for(let i=from;i<=to;i++) for(let j=0;j<6;j++) s[j]+=per[i][j]; return s; }

  // agg arrays: [clicks,conv,leads,sales,rev,saleRev] — з урахуванням команди
  function aggCampaigns(from,to,restrict){
    const m=new Map();
    for(const r of D.cd){ const di=r[0]; if(di<from||di>to) continue; if(restrict&&!restrict.has(r[1])) continue; if(!teamOK(campTeam[r[1]])) continue;
      let a=m.get(r[1]); if(!a){a=[0,0,0,0,0,0];m.set(r[1],a);} a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];a[4]+=r[6];a[5]+=r[7]; }
    return m;
  }
  function aggOffers(from,to,restrict){
    const m=new Map();
    for(const r of D.od){ const di=r[0]; if(di<from||di>to) continue; if(restrict&&!restrict.has(r[1])) continue; if(!teamOK(r[8])) continue;
      let a=m.get(r[1]); if(!a){a=[0,0,0,0,0,0];m.set(r[1],a);} a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];a[4]+=r[6];a[5]+=r[7]; }
    return m;
  }
  // relationship aggregation (whole history). groupCol: index in rel row; restrict on entityCol.
  function relGroup(groupCol, entityCol, entitySet){
    const m=new Map();
    for(const r of D.rel){ if(entitySet&&!entitySet.has(r[entityCol])) continue; if(!teamOK(campTeam[r[0]])) continue;
      const k=r[groupCol]; let a=m.get(k); if(!a){a=[0,0,0,0,0,0];m.set(k,a);} a[0]+=r[4];a[1]+=r[5];a[2]+=r[6];a[3]+=r[7];a[4]+=r[8];a[5]+=r[9]; }
    return m; // key -> [clicks,conv,leads,sales,rev,saleRev]
  }

  // ── layout ───────────────────────────────────────────────────────────────
  app.innerHTML = `
    <header>
      <div class="hrow">
        <div class="brand"><div class="logo">K</div>
          <div><h1>Keitaro · Pulse</h1><div class="sub">Локальна аналітика трафіку по днях</div></div></div>
        <div class="seg" id="tabSeg"><button data-tab="ov">Огляд</button><button data-tab="net">Партнерки</button></div>
        <div class="seg tm" id="teamSeg" style="display:none"></div>
        <div class="seg" id="rangeSeg">
          <button data-m="all">Весь період</button><button data-m="90">90 дн</button>
          <button data-m="30">30 дн</button><button data-m="7">7 дн</button>
        </div>
        <select class="day" id="daySel"></select>
        <button class="refresh" id="refreshBtn" type="button"><span class="rico">↻</span><span id="refreshAge">оновити</span></button>
        <div class="meta"><div>історія: <b>${D.range.from}</b> → <b>${D.range.to}</b></div>
          <div>оновлено: <b>${D.generated}</b></div></div>
      </div>
      <div class="hrow" id="filterRow">
        <span class="flabel">Фільтр</span>
        <div class="seg" id="fType"><button data-t="site">Сайт</button><button data-t="brand">Бренд</button></div>
        <div class="seg alt" id="fMatch"><button data-x="partial">Частковий</button><button data-x="exact">Точний</button></div>
        <input class="fq" id="fq" placeholder="почни вводити назву сайту або бренду…" autocomplete="off">
        <div id="fchip"></div>
      </div>
    </header>
    <main>
      <div id="tabOv">
      <div class="lead">
        <div class="hero" id="hero"></div>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="morekpi" id="moreKpi"></div>

      <div class="grid">
        <div class="panel">
          <div class="phead"><div><h2>Що змінилось</h2><div class="psub" id="dgSub"></div></div>
            <span class="tag-all">порівняння періодів</span></div>
          <ul class="digest" id="digest"></ul>
        </div>
      </div>

      <div class="grid" id="teamBlock">
        <div class="panel">
          <div class="phead"><div><h2>Команди</h2><div class="psub" id="tmSub"></div></div>
            <span class="tag-all">клік по рядку — фокус на команді</span></div>
          <div class="thead" id="tmHead"></div>
          <div class="tlist" id="tcards"></div>
        </div>
      </div>

      <div class="grid g3">
        <div class="panel">
          <div class="phead">
            <div><h2>Рух брендів</h2><div class="psub" id="mvSub"></div></div>
            <div class="seg alt" id="mvSeg"><button data-k="0">Кліки</button><button data-k="1">Конверсії</button><button data-k="5">Дохід</button></div>
          </div>
          <div class="mvnet" id="mvNet"></div>
          <div class="dvhead" id="dvHead"></div>
          <div class="dvlist" id="mv"></div>
          <div id="mvMore"></div>
          <div class="hint" id="mvFoot"></div>
        </div>
        <div class="panel">
          <div class="phead"><div><h2>⚠ Клікають, не конвертять</h2><div class="psub" id="ncSub"></div></div></div>
          <div class="nclist" id="ncList"></div>
          <div class="hint">клік по рядку → фільтр на цей бренд</div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="phead">
            <div><h2 id="chartTitle">Трафік по днях</h2>
              <div class="psub">Дві панелі на спільній осі часу. Шкали різні, тож висоту ліній між панелями не порівнюють — читають форму кожної окремо.</div></div>
          </div>
          <div class="chart-wrap" id="chartWrap"></div>
          <div class="hint">клік по графіку → цей день</div>
        </div>
      </div>

      <div class="grid g2">
        <div class="panel">
          <div class="phead">
            <div><h2>Сайти / кампанії</h2><div class="psub" id="siteSub"></div></div>
            <div class="tools"><span id="siteTag"></span><input class="search" id="siteSearch" placeholder="в таблиці…"></div>
          </div>
          <div class="tbl-wrap"><table id="siteTbl"></table></div>
          <div id="siteMore"></div>
          <div class="hint">клік по рядку → фільтр на цей сайт</div>
        </div>
        <div class="panel">
          <div class="phead">
            <div><h2>Бренди / офери</h2><div class="psub" id="brandSub"></div></div>
            <div class="tools"><span id="brandTag"></span><input class="search" id="brandSearch" placeholder="в таблиці…"></div>
          </div>
          <div class="tbl-wrap"><table id="brandTbl"></table></div>
          <div id="brandMore"></div>
          <div class="hint">клік по рядку → фільтр на цей бренд</div>
        </div>
      </div>

      <details class="drawer" id="moreBox">
        <summary>Ще розрізи — гео, сторінки, позиції, хто конвертить, префікси та ОС</summary>
        <div class="inner">

      <div class="grid g2">
        <div class="panel">
          <div class="phead"><div><h2>Гео</h2><div class="psub" id="geoSub">Розподіл кліків по країнах</div></div></div>
          <div class="dist" id="geoDist"></div>
        </div>
        <div class="panel">
          <div class="phead"><div><h2>Сторінки (sub_id_3)</h2><div class="psub" id="pageSub">З яких сторінок ішли кліки</div></div><span class="tag-all">весь період</span></div>
          <div class="dist" id="pageDist"></div>
          <div class="hint">клік по сторінці → бренди на її позиціях</div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="phead"><div><h2 id="posTitle">Позиції × бренди</h2><div class="psub" id="posSub">Який бренд на якій позиції</div></div><span class="tag-all">весь період</span></div>
          <div class="tbl-wrap" style="max-height:430px"><table id="posTbl"></table></div>
          <div class="hint">клік по рядку → фільтр на цей бренд</div>
        </div>
      </div>

      <div class="grid g2">
        <div class="panel">
          <div class="phead"><div><h2>💰 Сайти з конверсіями</h2><div class="psub">Хто реально конвертить у вибраному періоді/фільтрі</div></div></div>
          <div class="tbl-wrap" style="max-height:430px"><table id="convTbl"></table></div>
        </div>
        <div class="panel">

  // ── головне: один герой-показник + три плитки ───────────────────────────────

  function rangeLabel(){

  function renderKpis(){
    const per=seriesData();
    const cur=sumRange(per,state.fromIdx,state.toIdx);
    const len=state.toIdx-state.fromIdx+1, pTo=state.fromIdx-1;
    const prev = pTo>=0 ? sumRange(per,Math.max(0,pTo-len+1),pTo) : null;
    const vals=[]; for(let i=state.fromIdx;i<=state.toIdx;i++) vals.push(per[i][5]);

    // Стрілка + слово поруч із кольором: статус ніколи не тримається на самому кольорі.
    const delta=(i,money,cls)=>{
      if(!prev) return cls ? `<div class="dl flat"><span class="sub">немає з чим порівняти</span></div>`
        : `<div class="hdl flat"><span class="sub">попереднього періоду такої ж довжини немає</span></div>`;
      const d=cur[i]-prev[i], p=prev[i], pct=p>0?d/p*100:(d>0?100:0);
      const k=d>0?"up":(d<0?"down":"flat"), ic=d>0?"▲":(d<0?"▼":"—"), w=d>0?"зростання":(d<0?"спад":"без змін");
      return `<div class="${cls||"hdl"} ${k}">${ic} ${Math.abs(pct).toFixed(0)}% <span class="sub">${w} проти ${money?fmtMoney(p):fmtInt(p)}</span></div>`;
    };
    document.getElementById("hero").innerHTML=
      `<div><div class="hlbl">Підтверджений дохід <span class="hrange">${esc(rangeLabel())}</span></div>
        <div class="hval">${fmtMoney(cur[5])}</div>${delta(5,1)}</div>
       <div><div class="hcap">дохід по днях</div><div class="hspark">${sparkSVG(vals,"var(--s1)")}</div></div>`;

    const cr=div(cur[1],cur[0])*100, crPrev=prev?div(prev[1],prev[0])*100:null;
    const crD=crPrev!==null?cr-crPrev:0;
    const crCls=crD>0.05?"up":(crD<-0.05?"down":"flat"), crIc=crD>0.05?"▲":(crD<-0.05?"▼":"—");
    document.getElementById("tiles").innerHTML=[
      `<div class="kpi" style="--accent:var(--s1)"><div class="lbl">Кліки</div><div class="val mono">${fmtInt(cur[0])}</div>${delta(0,0,"dl")}</div>`,
      `<div class="kpi" style="--accent:var(--s2)"><div class="lbl">Конверсії</div><div class="val mono">${fmtInt(cur[1])}</div>${delta(1,0,"dl")}</div>`,
      `<div class="kpi" style="--accent:var(--dim)"><div class="lbl">CR</div><div class="val mono">${fmtPct(cr)}</div>`+
        (crPrev!==null?`<div class="dl ${crCls}">${crIc} ${Math.abs(crD).toFixed(2)} п.п. <span class="sub">проти ${fmtPct(crPrev)}</span></div>`:`<div class="dl flat"><span class="sub">—</span></div>`)+`</div>`,
    ].join("");

    const restrict = state.filter.active?state.filter.campSet:null;
    const activeSites=aggCampaigns(state.fromIdx,state.toIdx,restrict).size;
    document.getElementById("moreKpi").innerHTML=
      [["Ліди",fmtInt(cur[2])],["Продажі",fmtInt(cur[3])],["Дохід усього",fmtMoney(cur[4])],
       [state.filter.active&&state.filter.type==="brand"?"Брендів у фільтрі":"Активних сайтів",
        fmtInt(state.filter.active&&state.filter.type==="brand"?state.filter.offerSet.size:activeSites)]]
      .map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("");
  }
  // ── трафік по днях ───────────────────────────────────────────────────────────
  // Було: кліки й конверсії на одному полі з двома різними масштабами. Такий
  // графік вигадує кореляцію, якої в даних немає, — тому тепер це дві панелі
  // на спільній осі часу, кожна зі своєю шкалою і своїм підписом.
  function renderChart(){
    const wrap=document.getElementById("chartWrap");
    const per=seriesData();
    const s=[]; for(let i=state.fromIdx;i<=state.toIdx;i++) s.push({idx:i,day:D.days[i],clicks:per[i][0],conv:per[i][1],rev:per[i][5]});
    const n=s.length;
    // SVG масштабується рівномірно, тож на вузькій картці широка пропорція
    // перетворювала графік на смужку 105px заввишки. Міняємо саму пропорцію.
    const narrow=(wrap.clientWidth||900)<620;
    const W=narrow?460:900, PL=narrow?44:54, PR=narrow?10:14, PT=22,
          H1=narrow?132:128, GAP=narrow?30:30, H2=narrow?84:70, XB=22, H=PT+H1+GAP+H2+XB;
    const iw=W-PL-PR, top2=PT+H1+GAP;
    const x=i=> n<=1 ? PL+iw/2 : PL+(i/(n-1))*iw;
    // верхівка осі — кругле число: «16 054» на підписі читається як дані, хоч це просто межа
    const niceMax=(m)=>{ if(!(m>0)) return 1; const e=Math.pow(10,Math.floor(Math.log10(m))), f=m/e;
      const s=f<=1?1:f<=1.2?1.2:f<=1.5?1.5:f<=2?2:f<=2.5?2.5:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10; return s*e; };
    const m1=niceMax(Math.max(1,...s.map(d=>d.clicks))), m2=niceMax(Math.max(1,...s.map(d=>d.conv)));
    const y1=v=>PT+H1-(v/m1)*H1, y2=v=>top2+H2-(v/m2)*H2;

    const path=(f)=>{ let p=`M ${x(0).toFixed(1)} ${f(0).toFixed(1)}`; for(let i=1;i<n;i++) p+=` L ${x(i).toFixed(1)} ${f(i).toFixed(1)}`; return p; };
    const l1=path(i=>y1(s[i].clicks)), l2=path(i=>y2(s[i].conv));
    const a1=l1+` L ${x(n-1).toFixed(1)} ${PT+H1} L ${x(0).toFixed(1)} ${PT+H1} Z`;

    // суцільні волосяні лінії сітки — пунктир читається як «поріг», хоч це просто сітка
    let grid="",ylab="";
    for(const [top,hh,mx,fmt] of [[PT,H1,m1,fmtInt],[top2,H2,m2,fmtInt]]){
      for(let g=0;g<=2;g++){ const yy=top+(g/2)*hh;
        grid+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
        ylab+=`<text x="${PL-9}" y="${yy+3}" text-anchor="end" fill="var(--faint)" font-size="9" font-family="var(--mono)">${fmt(mx*(1-g/2))}</text>`; }
    }
    let xlab="", step=Math.max(1,Math.ceil(n/(narrow?5:10)));
    const dm=d=>d.slice(8,10)+"."+d.slice(5,7);
    for(let i=0;i<n;i+=step) xlab+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="var(--faint)" font-size="9" font-family="var(--mono)">${dm(s[i].day)}</text>`;
    // одна точка не малюється лінією — показуємо маркер
    const lone = n===1 ? `<circle cx="${x(0)}" cy="${y1(s[0].clicks)}" r="4" fill="var(--s1)"/><circle cx="${x(0)}" cy="${y2(s[0].conv)}" r="4" fill="var(--s2)"/>` : "";

    wrap.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--s1)" stop-opacity=".34"/><stop offset="100%" stop-color="var(--s1)" stop-opacity="0"/></linearGradient></defs>
      ${grid}${ylab}${xlab}
      <text x="${PL}" y="${PT-8}" fill="var(--s1)" font-size="10.5" font-weight="700" letter-spacing=".5">КЛІКИ</text>
      <text x="${PL}" y="${top2-8}" fill="var(--s2)" font-size="10.5" font-weight="700" letter-spacing=".5">КОНВЕРСІЇ</text>
      <path d="${a1}" fill="url(#ga)"/>
      <path d="${l1}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
      <path d="${l2}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>
      ${lone}
      <line id="cursor" x1="0" y1="${PT}" x2="0" y2="${top2+H2}" stroke="var(--border-hi)" stroke-width="1" style="opacity:0"/>
      <circle id="d1" r="4" fill="var(--s1)" stroke="var(--panel-solid)" stroke-width="2" style="opacity:0"/>
      <circle id="d2" r="4" fill="var(--s2)" stroke="var(--panel-solid)" stroke-width="2" style="opacity:0"/>
      <rect id="hit" x="${PL}" y="${PT}" width="${iw}" height="${top2+H2-PT}" fill="transparent"/>
      </svg><div class="tip" id="tip"></div>`;

    const svg=wrap.querySelector("svg"),tip=wrap.querySelector("#tip"),cursor=wrap.querySelector("#cursor"),
          hit=wrap.querySelector("#hit"),d1=wrap.querySelector("#d1"),d2=wrap.querySelector("#d2");
    const idxAt=(ev)=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width*W;
      return [Math.max(0,Math.min(n-1,Math.round((px-PL)/iw*(n-1)))), r]; };
    hit.addEventListener("mousemove",ev=>{
      const [i,r]=idxAt(ev), d=s[i], cx=x(i);
      cursor.setAttribute("x1",cx); cursor.setAttribute("x2",cx); cursor.style.opacity=1;
      d1.setAttribute("cx",cx); d1.setAttribute("cy",y1(d.clicks)); d1.style.opacity=1;
      d2.setAttribute("cx",cx); d2.setAttribute("cy",y2(d.conv));  d2.style.opacity=1;
      tip.style.opacity=1;
      tip.style.left=Math.min(r.width-176,Math.max(0,(cx/W)*r.width+12))+"px";
      tip.style.top=Math.max(2,Math.min(r.height-96,ev.clientY-r.top-54))+"px";
      const cr=div(d.conv,d.clicks)*100;
      tip.innerHTML=`<b>${d.day}</b><br><span class="k">Кліки:</span> <b class="mono">${fmtInt(d.clicks)}</b>`+
        `<br><span class="k">Конверсії:</span> <b class="mono" style="color:var(--s2)">${fmtInt(d.conv)}</b>`+
        `<br><span class="k">CR:</span> <b class="mono">${d.clicks?fmtPct(cr):"—"}</b>`+
        (d.rev>0?`<br><span class="k">Підтв. дохід:</span> <b class="mono" style="color:var(--good-ink)">${fmtMoney(d.rev)}</b>`:"");
    });
    hit.addEventListener("mouseleave",()=>{tip.style.opacity=0;cursor.style.opacity=0;d1.style.opacity=0;d2.style.opacity=0;});
    hit.addEventListener("click",ev=>{ const [i]=idxAt(ev); state.mode="day"; state.dayIdx=i+state.fromIdx;
      daySel.value=state.dayIdx; syncSeg(); render(); });
  }
  // ── sites table ──────────────────────────────────────────────────────────────
  const sortState={site:{key:2,asc:false},brand:{key:1,asc:false}};
  let siteFilter="",brandFilter="";
  // Скільки рядків показуємо одразу. 150 у коробці з власним скролом ніхто не
  // гортав; тепер 25 і кнопка, а картка росте разом зі вмістом.
  const TBL_STEP=25;
  let tblCap={site:TBL_STEP,brand:TBL_STEP};
  function moreBtn(id,total,key,rerender){
    const el=document.getElementById(id); if(!el) return;
    el.innerHTML = total>tblCap[key]
      ? `<button class="morebtn" type="button">показати всі ${fmtInt(total)} ↓</button>` : "";
    const b=el.querySelector("button");
    if(b) b.onclick=()=>{ tblCap[key]=total; rerender(); };
  }
  document.getElementById("siteSearch").addEventListener("input",e=>{siteFilter=e.target.value.toLowerCase();renderSites();});
  document.getElementById("brandSearch").addEventListener("input",e=>{brandFilter=e.target.value.toLowerCase();renderBrands();});

  function renderSites(){
    const f=state.filter; let rows=[], whole=false;
    if(f.active && f.type==="brand"){
      whole=true;
      const m=relGroup(0,1,f.offerSet); // campaign -> metrics of THIS brand
      m.forEach((a,ci)=>{ const c=D.camps[ci]; rows.push({ci,name:c[1],prefix:c[2],geo:c[3],clicks:a[0],conv:a[1],leads:a[2],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100}); });
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ const c=D.camps[ci]; rows.push({ci,name:c[1],prefix:c[2],geo:c[3],clicks:a[0],conv:a[1],leads:a[2],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100}); });
    }
    if(siteFilter) rows=rows.filter(r=>r.name.toLowerCase().includes(siteFilter)||r.geo.toLowerCase().includes(siteFilter));
    const cols=["name","geo","clicks","conv","cr","sales","rev","confRev"], head=["Сайт","Гео","Кліки","Конв","CR","Прод","Дохід","Підтв."];
    const sk=cols[sortState.site.key];
    rows.sort((a,b)=> sortState.site.asc?cmp(a[sk],b[sk]):cmp(b[sk],a[sk]));
    const total=rows.length, shown=rows.slice(0,tblCap.site), maxC=Math.max(1,...shown.map(r=>r.clicks));
    document.getElementById("siteSub").textContent=`${fmtInt(total)} ${plural(total,["сайт","сайти","сайтів"])}${total>shown.length?` · показано ${shown.length}`:""}`;
    document.getElementById("siteTag").innerHTML= whole?`<span class="tag-all">за весь період</span>`:"";
    document.getElementById("siteTbl").innerHTML=

    const tbl=document.getElementById("siteTbl");

    document.getElementById("brandTbl").innerHTML=

  // ── positions & pages (rel, whole history) ────────────────────────────────────
  function entityForRel(){ // returns [entityCol, set] based on filter
    const f=state.filter;
    if(f.active && f.type==="brand") return [1,f.offerSet];
    if(f.active && f.type==="site") return [0,f.campSet];
    return [null,null];
  }
  const noteHTML = n => `<div style="font-size:11px;color:var(--faint);margin-top:8px">без мітки (sub_id): <span class="mono">${fmtInt(n)}</span> кліків</div>`;
  const distHead = (a,b)=>`<div class="dist-head"><span>${a}</span><span>${b}</span></div>`;

  function renderPosPages(){
    const [col,set]=entityForRel();
    const scope = state.filter.active ? (state.filter.type==="brand"?`бренд “${esc(state.filter.q)}”`:`сайт “${esc(state.filter.q)}”`) : "усі сайти/бренди";

    // ── Сторінки (sub_id_3) — клікабельний список ──
    const gm=relGroup(3,col,set);
    let pgAll=[...gm].map(([gi,a])=>({gi,label:D.pages[gi],v:a[0],conv:a[1]}));
    const pgEmpty=pgAll.filter(p=>p.label==="").reduce((s,p)=>s+p.v,0);
    let pg=pgAll.filter(p=>p.label!==""&&p.v>0).sort((a,b)=>b.v-a.v).slice(0,18);
    const maxG=Math.max(1,...pg.map(p=>p.v));
    document.getElementById("pageSub").textContent=`Сторінки для: ${scope}`;
    document.getElementById("pageDist").innerHTML = distHead("Сторінка","Кліки · Конв") +
      (pg.length? pg.map(p=>`<div class="row drow ${state.selectedPage===p.gi?'sel':''}" data-page="${p.gi}">
          <div class="name" title="${esc(p.label)}">${esc(p.label)}</div>
          <div class="track"><div class="fill" style="width:${p.v/maxG*100}%"></div></div>
          <div class="v mono">${fmtInt(p.v)}${p.conv?` · <span style="color:var(--s2)">${p.conv}</span>`:""}</div></div>`).join("") : emptyDist())
      + (pgEmpty>0?noteHTML(pgEmpty):"");
    document.getElementById("pageDist").querySelectorAll("[data-page]").forEach(el=>el.onclick=()=>{
      const gi=+el.dataset.page; state.selectedPage=(state.selectedPage===gi?null:gi); renderPosPages();
    });

    // ── Позиції × бренди — таблиця (scope: фільтр + вибрана сторінка) ──
    const sp=state.selectedPage;
    const posTitle=document.getElementById("posTitle"), posSub=document.getElementById("posSub");
    if(sp!=null){
      posTitle.innerHTML=`Позиції × бренди · <span style="color:var(--purple)">${esc(D.pages[sp]||"(без сторінки)")}</span> <span id="clrPage" title="скинути сторінку" style="cursor:pointer;color:var(--dim);font-weight:500">✕</span>`;
      posSub.textContent="Які бренди й на яких позиціях стояли на цій сторінці";
    } else {
      posTitle.textContent="Позиції × бренди";
      posSub.textContent=`Який бренд на якій позиції · ${scope}`;
    }
    const m=new Map();
    for(const r of D.rel){
      if(set && !set.has(r[col])) continue;
      if(!teamOK(campTeam[r[0]])) continue;
      if(sp!=null && r[3]!==sp) continue;
      const key=r[2]+"|"+r[1];
      let a=m.get(key); if(!a){a={pos:D.positions[r[2]],offer:D.offers[r[1]],clicks:0,conv:0};m.set(key,a);}
      a.clicks+=r[4]; a.conv+=r[5];
    }
    let rows=[...m.values()].filter(r=>r.clicks>0);
    rows.sort((a,b)=>{ const ea=a.pos==="",eb=b.pos===""; if(ea!==eb)return ea?1:-1; const na=+a.pos,nb=+b.pos; if(!isNaN(na)&&!isNaN(nb)&&na!==nb)return na-nb; return b.clicks-a.clicks; });
    rows=rows.slice(0,80);
    const maxc=Math.max(1,...rows.map(r=>r.clicks));
    document.getElementById("posTbl").innerHTML =
      `<thead><tr><th>Поз.</th><th>Бренд</th><th>Кліки</th><th>Конв</th></tr></thead>`+
      `<tbody>${rows.length? rows.map(r=>`<tr data-name="${esc(r.offer)}">
         <td class="mono" style="font-weight:700;color:var(--s4)">${r.pos===""?"—":esc(r.pos)}</td>
         <td><span class="site">${esc(r.offer)}</span></td>
         <td class="bar-cell mono"><span class="bar" style="width:${r.clicks/maxc*100}%"></span><span>${fmtInt(r.clicks)}</span></td>
         <td class="mono ${r.conv>0?'conv-badge':'zero'}">${r.conv||"0"}</td></tr>`).join("") : `<tr class="nolink"><td colspan="4" class="emptycell">Немає позицій із мітками для цього зрізу.</td></tr>`}</tbody>`;
    document.getElementById("posTbl").querySelectorAll("tbody tr[data-name]").forEach(tr=>tr.onclick=()=>setFilter("brand",tr.dataset.name));
    if(sp!=null){ const c=document.getElementById("clrPage"); if(c) c.onclick=e=>{ e.stopPropagation(); state.selectedPage=null; renderPosPages(); }; }
  }
  function distHTML(items,colorFn){
    const max=Math.max(1,...items.map(i=>i.v));
    return items.map(i=>`<div class="row"><div class="name" title="${esc(i.label||i.name)}">${esc(i.label||i.name)}</div>
      <div class="track"><div class="fill" style="width:${i.v/max*100}%;${colorFn?'background:'+colorFn(i):''}"></div></div>
      <div class="v mono">${fmtInt(i.v)}${i.conv?` · <span style="color:var(--s2)">${i.conv}</span>`:""}</div></div>`).join("");
  }
  const emptyDist=()=>'<div style="color:var(--faint);font-size:12px">немає даних</div>';

  // ── converting sites ────────────────────────────────────────────────────────────
  function renderConv(){
    const f=state.filter; let rows=[];
    if(f.active && f.type==="brand"){
      const m=relGroup(0,1,f.offerSet);
      m.forEach((a,ci)=>{ if(a[1]>0){const c=D.camps[ci]; rows.push({name:c[1],geo:c[3],clicks:a[0],conv:a[1],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100});} });
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ if(a[1]>0){const c=D.camps[ci]; rows.push({name:c[1],geo:c[3],clicks:a[0],conv:a[1],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100});} });
    }
    rows.sort((a,b)=>b.conv-a.conv||b.confRev-a.confRev);
    const el=document.getElementById("convTbl");
    if(!rows.length){ el.innerHTML=`<tbody><tr class="nolink"><td class="emptycell">За вибраний період/фільтр конверсій немає.</td></tr></tbody>`; return; }
    el.innerHTML=`<thead><tr><th>Сайт</th><th>Гео</th><th>Конв</th><th>Прод</th><th>CR</th><th>Кліки</th><th>Дохід✓</th></tr></thead>
      <tbody>${rows.slice(0,80).map(r=>`<tr data-name="${esc(r.name)}">
        <td><span class="site">${esc(r.name)}</span></td>
        <td>${r.geo!=="—"?`<span class="chip geo">${r.geo}</span>`:'<span class="zero">—</span>'}</td>
        <td class="mono conv-badge">${r.conv}</td><td class="mono ${r.sales?'':'zero'}">${r.sales||"0"}</td>
        <td class="mono">${fmtPct(r.cr)}</td><td class="mono">${fmtInt(r.clicks)}</td>
        <td class="mono ${r.confRev>0?'up':'zero'}">${r.confRev>0?fmtMoney(r.confRev):"—"}</td></tr>`).join("")}</tbody>`;
    el.querySelectorAll("tbody tr[data-name]").forEach(tr=>tr.onclick=()=>setFilter("site",tr.dataset.name));
  }

  // ── geo / prefix / os ─────────────────────────────────────────────────────────
  function renderGeo(){

    if(f.active && f.type==="brand"){
      const m=relGroup(0,1,f.offerSet); // campaign -> brand metrics
      m.forEach((a,ci)=>{ const g=D.camps[ci][3]; const c=byGeo.get(g)||[0,0]; c[0]+=a[0];c[1]+=a[1];byGeo.set(g,c); });
      document.getElementById("geoSub").textContent="по сайтах бренду · весь період";
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ const g=D.camps[ci][3]; const c=byGeo.get(g)||[0,0]; c[0]+=a[0];c[1]+=a[1];byGeo.set(g,c); });
      document.getElementById("geoSub").textContent="розподіл кліків по країнах";
    }
    let items=[...byGeo].filter(([g])=>g!=="—").map(([g,v])=>({label:g,v:v[0],conv:v[1]})).sort((a,b)=>b.v-a.v).slice(0,10);
