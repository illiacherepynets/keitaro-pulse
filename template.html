<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keitaro • Pulse</title>
<style>
  /* ── Токени: світла гама Atlassian Design System ─────────────────────────
     Було темне скло з градієнтами й неоном — читалось як іграшка. Тут усе
     пласке: білі картки, волосяні рамки, радіус 3px, жодних тіней понад
     elevation.surface.raised. */
  :root{
    --bg:#F7F8F9;            /* сторінка (elevation.surface.sunken) */
    --bg2:#F1F2F4;           /* поля вводу, доріжки смуг */
    --panel:#FFFFFF; --panel-solid:#FFFFFF;
    --elev:#FFFFFF;
    --border:rgba(9,30,66,.10);
    --border-strong:rgba(9,30,66,.18);
    --border-hi:#0C66E4;
    --fg:#172B4D;            /* text */
    --dim:#44546F;           /* text.subtle */
    --faint:#626F86;         /* text.subtlest — 4.6:1 на білому */

    /* Категорійні слоти = ідентичність. Порядок фіксований, прогнаний
       валідатором на білому: контраст ≥3:1, найгірша сусідня пара
       ΔE 8.2 (protan) / 8.1 (tritan), нормальний зір 17.5. */
    --s1:#0C66E4; --s2:#C25100; --s3:#067A5B; --s4:#5E4DB2; --s5:#B03E79; --s6:#946F00;

    /* Статус — лише стан, завжди зі стрілкою або словом поруч */
    --good:#22A06B; --good-ink:#216E4E; --good-bg:#DCFFF1;
    --crit:#C9372C; --crit-ink:#AE2E24; --crit-bg:#FFEDEB;
    --warn:#D97008; --warn-ink:#A54800; --warn-bg:#FFF7D6;
    --info-ink:#0055CC; --info-bg:#E9F2FF;

    --grid:#F1F2F4; --axis:#DFE1E6; --band:rgba(9,30,66,.03);
    /* М'якша подача: картка тримається рамкою, тінь майже невидима. */
    --shadow:0 1px 2px rgba(9,30,66,.06);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    /* Новий Jira помітно округліший за старий: картки 8, контроли 6,
       лозенги 4. Три кроки, не один — інакше все злипається в одну форму. */
    --radius:8px; --radius-sm:6px; --radius-xs:4px;
    --side:232px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); font-size:14px; line-height:1.43; color:var(--fg);
    background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  @media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(9,30,66,.2);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(9,30,66,.32)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--info-ink);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--border-hi);outline-offset:2px;border-radius:var(--radius-sm)}

  /* ── Верхня смуга і бокове меню ─────────────────────────────────────────
     Вкладки переїхали ліворуч, як простори в Jira: їх три, і вони не мають
     змагатись за місце з фільтрами. */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
    background:var(--panel);border-bottom:1px solid var(--border);padding:9px 20px;min-height:56px}
  /* Висота верхньої смуги СТАЛА: і меню, і панель фільтрів липнуть до 56px.
     Якщо смуга стискалась, між нею і фільтрами зʼявлялась щілина, крізь яку
     проїжджав контент. При скролі ховаємо лише підзаголовок і дати. */
  header.tight .brand .sub,header.tight .meta{display:none}
  .shell{display:flex;align-items:flex-start}
  .side{width:var(--side);flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    padding:14px 10px 20px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
    display:flex;flex-direction:column;gap:2px}
  .side-label{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;
    letter-spacing:.5px;padding:4px 10px 6px}
  .side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
    border:0;color:var(--dim);font:inherit;font-size:13.5px;font-weight:500;padding:8px 10px;
    border-radius:var(--radius-sm);cursor:pointer}
  .side button:hover{background:var(--bg)}
  .side button.on{background:var(--info-bg);color:var(--info-ink);font-weight:600}
  .side button svg{flex-shrink:0;opacity:.9}
  .hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .logo{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--s1);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
  .brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.1px}
  .brand .sub{font-size:11.5px;color:var(--faint);margin-top:1px}
  .meta{font-size:11.5px;color:var(--faint);text-align:right;line-height:1.5;margin-left:auto}
  .meta b{color:var(--dim);font-weight:600}

  /* панель фільтрів — липне під верхньою смугою */
  .hrow.filters{position:sticky;top:56px;z-index:10;background:var(--bg);
    padding:12px 0;gap:8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
  .flabel{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
  .fsearch{position:relative;flex:0 1 300px;min-width:180px}
  .fsearch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none}
  input.fq,input.search,.minput{
    width:100%;background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    color:var(--fg);font:inherit;font-size:13px;padding:6px 10px;height:32px}
  input.fq{padding-left:30px}
  input.fq::placeholder,input.search::placeholder{color:var(--faint)}
  input.fq:focus,input.search:focus,.minput:focus{outline:none;border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
  input.search{width:auto;max-width:200px;font-size:12.5px;height:30px}
  select.pill,select.day{
    appearance:none;background:var(--panel) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2344546F' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E") no-repeat right 7px center;
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);color:var(--fg);font:inherit;font-size:13px;
    padding:6px 28px 6px 10px;height:34px;cursor:pointer;max-width:230px}
  select.pill:hover,select.day:hover{background-color:var(--bg2)}
  select.pill:focus,select.day:focus{outline:none;border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
  .fclear{background:none;border:0;color:var(--faint);font:inherit;font-size:12.5px;cursor:pointer;
    padding:7px 10px;border-radius:var(--radius-sm)}
  .fclear:hover{background:rgba(9,30,66,.06);color:var(--fg)}

  /* сегментовані перемикачі всередині панелей */
  .seg{display:inline-flex;background:var(--bg2);border-radius:var(--radius-sm);padding:3px;gap:2px}
  .seg button{background:transparent;border:0;color:var(--dim);font:inherit;font-size:12.5px;
    font-weight:500;padding:5px 11px;border-radius:var(--radius-xs);cursor:pointer;white-space:nowrap}
  .seg button:hover{background:rgba(9,30,66,.07);color:var(--fg)}
  .seg button.on{background:var(--panel);color:var(--info-ink);font-weight:600;box-shadow:var(--shadow)}
  .seg.alt button.on{color:var(--info-ink)}

  .refresh{display:inline-flex;align-items:center;gap:6px;background:var(--panel);
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:6px 11px;color:var(--dim);
    font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;flex-shrink:0;height:34px}
  .refresh:hover{background:var(--bg2);color:var(--fg)}
  .refresh.stale{color:var(--warn-ink);border-color:#F5CD47;background:var(--warn-bg)}
  .refresh.old{color:var(--crit-ink);border-color:#F8A9A3;background:var(--crit-bg)}
  .refresh .rico{font-size:13px;line-height:1;display:inline-block}
  .refresh.busy .rico{animation:ktspin 1s linear infinite}
  @keyframes ktspin{to{transform:rotate(360deg)}}

  .active-chip{display:inline-flex;align-items:center;gap:6px;background:var(--info-bg);
    color:var(--info-ink);border:1px solid rgba(12,102,228,.25);border-radius:var(--radius-sm);
    padding:5px 9px;font-size:12px;font-weight:600}
  .active-chip .cnt{color:var(--dim);font-weight:500}
  .active-chip .x{cursor:pointer;opacity:.7;font-weight:700}
  .active-chip .x:hover{opacity:1}

  /* ── Сітка та картки ───────────────────────────────────────────────────── */
  main{flex:1;min-width:0;padding:0 20px 56px;max-width:1420px;margin:0 auto}
  .grid{display:grid;gap:12px;margin-bottom:12px}
  .grid>*,.lead>*,.tiles>*,.panel,.tbl-wrap{min-width:0}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:2fr 1fr;align-items:start}
  @media(max-width:1050px){.g2,.g3{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
  .phead h2{font-size:15px;font-weight:600;margin:0;color:var(--fg)}
  .psub{font-size:12px;color:var(--faint);margin-top:3px;line-height:1.5}
  .psubdim{color:var(--faint)}
  #chartSub b{color:var(--fg)}
  .tag-all{font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:var(--radius-xs);
    padding:3px 8px;font-weight:500;white-space:nowrap}
  .hint{font-size:11.5px;color:var(--faint);margin-top:10px}
  .sublabel{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin:2px 0}
  .foot{color:var(--faint);font-size:11.5px;text-align:center;margin-top:24px}
  .chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .clabel{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:600}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ── Показники ─────────────────────────────────────────────────────────── */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .kpi .val{font-size:24px;font-weight:600;margin-top:5px;line-height:1.1;color:var(--fg)}
  .kpi .dl{font-size:12px;margin-top:5px;font-weight:600;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .up{color:var(--good-ink)} .down{color:var(--crit-ink)} .flat{color:var(--faint)}

  .lead{display:grid;grid-template-columns:1.15fr 2fr;gap:12px;margin-bottom:12px}
  @media(max-width:1050px){.lead{grid-template-columns:1fr}}
  .hero{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px 8px;display:flex;flex-direction:column;
    justify-content:space-between;overflow:hidden}
  .hlbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:600}
  .hrange{color:var(--faint);font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px}
  .hval{font-size:38px;font-weight:600;line-height:1.1;margin-top:6px;letter-spacing:-.8px;color:var(--fg)}
  .hdl{font-size:12.5px;font-weight:600;margin-top:7px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .hdl .sub,.dl .sub{color:var(--faint);font-weight:400}
  .hcap{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-top:10px}
  .hspark{margin:4px -16px -8px;opacity:1}
  .hspark .spark{height:52px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tiles .kpi{display:flex;flex-direction:column;justify-content:center}
  @media(max-width:700px){.tiles{grid-template-columns:1fr}}
  .morekpi{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-bottom:12px;
    padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
  .morekpi b{color:var(--fg);font-family:var(--mono);font-weight:600;margin-left:3px}

  /* ── Дайджест ──────────────────────────────────────────────────────────── */
  .digest{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .digest li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.55;color:var(--dim)}
  .digest li .ic{flex-shrink:0;width:18px;text-align:center}
  .digest b{color:var(--fg);font-weight:600}
  .digest .q{cursor:pointer;color:var(--info-ink);font-weight:500;border-bottom:1px dashed rgba(12,102,228,.4)}
  .digest .q:hover{border-bottom-style:solid}

  /* ── Список команд ─────────────────────────────────────────────────────── */
  .tlist{display:flex;flex-direction:column}
  .thead,.trow{display:grid;grid-template-columns:1.5fr 2fr .9fr 1fr .9fr .8fr 1.1fr 96px;gap:12px;align-items:center}
  .thead{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:600;
    padding:0 8px 7px;border-bottom:2px solid var(--border)}
  .thead span:not(:first-child){text-align:right}
  .thead span:nth-child(2){text-align:left}
  .trow{padding:8px;cursor:pointer;border-bottom:1px solid var(--grid)}
  .trow:hover{background:var(--bg)}
  .trow.on{background:var(--info-bg);box-shadow:inset 3px 0 0 var(--hue)}
  .tname{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;overflow:hidden;white-space:nowrap}
  .tdot{width:9px;height:9px;border-radius:3px;flex-shrink:0;background:var(--hue)}
  .tbar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
  .tbar i{display:block;height:100%;border-radius:4px;background:var(--hue)}
  .tnum{font-family:var(--mono);font-size:12.5px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
  .tsp,.tsp .spark{height:26px}
  @media(max-width:1050px){
    .thead,.trow{grid-template-columns:1.5fr .9fr .9fr .8fr;gap:8px}
    .tbar,.tsp,.tcr,.trev,.thead span:nth-child(2),.thead span:nth-child(6),
    .thead span:nth-child(7),.thead span:nth-child(8){display:none}
  }

  /* ── Рух брендів ───────────────────────────────────────────────────────── */
  .mvnet{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;
    padding:9px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}
  .mvnet .npart{display:inline-flex;align-items:baseline;gap:6px}
  .mvnet .npart b{font-family:var(--mono)}
  .mvnet .npart i{color:var(--faint);font-weight:400;font-style:normal}
  .mvnet .nres{margin-left:auto;font-family:var(--mono)}
  @media(max-width:700px){.mvnet{flex-direction:column;align-items:flex-start;gap:5px}
    .mvnet .nres{margin-left:0;padding-top:5px;border-top:1px solid var(--border);width:100%}}
  .dvhead,.dvrow{display:grid;grid-template-columns:1.9fr 2fr .95fr .6fr 1.2fr;gap:12px;align-items:center}
  .dvhead{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:600;
    padding:0 8px 7px;border-bottom:2px solid var(--border)}
  .dvhead>span:not(:first-child):not(.dvaxis){text-align:right}
  .dvaxis{display:flex;justify-content:space-between}
  .dvaxis i{font-style:normal}
  .dvlist{display:flex;flex-direction:column}
  .dvrow{padding:7px 8px;cursor:pointer;border-bottom:1px solid var(--grid)}
  .dvrow:hover,.dvrow:focus-visible{background:var(--bg)}
  .dvname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dvbar{position:relative;height:8px;background:linear-gradient(90deg,transparent calc(50% - .5px),
    var(--axis) calc(50% - .5px),var(--axis) calc(50% + .5px),transparent calc(50% + .5px))}
  .dvbar i{position:absolute;top:0;height:100%}
  .dvbar i.pos{left:50%;background:var(--good);border-radius:0 4px 4px 0}
  .dvbar i.neg{right:50%;background:var(--crit);border-radius:4px 0 0 4px}
  .dvd,.dvpct,.dvflow{text-align:right;font-size:12.5px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .dvpct{color:var(--dim);font-weight:500}
  .dvflow{color:var(--faint);font-weight:400;font-size:11.5px}
  .dvsplit{display:flex;align-items:center;gap:9px;margin:8px 2px;font-size:11px;text-transform:uppercase;
    letter-spacing:.4px;color:var(--faint);font-weight:600}
  .dvsplit::before,.dvsplit::after{content:"";flex:1;height:1px;background:var(--border)}
  .mvempty{font-size:12.5px;color:var(--faint);padding:12px 2px}
  @media(max-width:1050px){.dvhead,.dvrow{grid-template-columns:1.6fr 1.4fr .9fr .6fr}.dvflow{display:none}}
  @media(max-width:700px){.dvhead,.dvrow{grid-template-columns:1.5fr 1fr .7fr}.dvbar{display:none}
    .dvhead>span:nth-child(2){display:none}}

  .nclist{display:flex;flex-direction:column}
  .ncrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:8px;cursor:pointer;border-bottom:1px solid var(--grid)}
  .ncrow:hover,.ncrow:focus-visible{background:var(--warn-bg)}
  .ncname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ncname .chip,.dvname .chip{margin-left:4px}
  .ncv{font-size:13px;font-weight:600;color:var(--warn-ink);text-align:right;font-family:var(--mono)}
  .nctrack{grid-column:1/3;height:5px;background:var(--bg2);border-radius:4px;overflow:hidden}
  .nctrack i{display:block;height:100%;background:var(--warn);border-radius:4px}
  .ncwas{grid-column:1/3;font-size:11px;color:var(--faint)}

  /* ── Графік ────────────────────────────────────────────────────────────── */
  .chart-wrap{position:relative}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .spark{display:block;width:100%;height:28px}
  .tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--dim);
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;line-height:1.6;
    opacity:0;transition:opacity .1s;box-shadow:0 4px 12px rgba(9,30,66,.2);z-index:5;white-space:nowrap}
  .tip b{color:var(--fg)} .tip .k{color:var(--faint)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
  .legend i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed var(--dim);vertical-align:3px}
  .dchip{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}

  /* ── Таблиці ───────────────────────────────────────────────────────────── */
  .tbl-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:600;
    border-bottom:2px solid var(--border);cursor:pointer;user-select:none}
  th:hover{color:var(--fg)}
  th.sorted{color:var(--fg)}
  th.sorted::after{content:" ↓";color:var(--s1)}
  th.sorted.asc::after{content:" ↑"}
  td{border-bottom:1px solid var(--grid);color:var(--dim)}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--bg)}
  tr.nolink{cursor:default}
  tr.nolink:hover td{background:transparent}
  tr.suboff td{background:var(--bg);font-size:12px;color:var(--faint)}
  .emptycell{text-align:center;color:var(--faint);padding:18px 0}
  .site{color:var(--fg);font-weight:500}
  .zero{color:#8993A4}
  .conv-badge{color:var(--s2);font-weight:600}
  .bar-cell{position:relative}
  .bar-cell .bar{position:absolute;left:0;top:50%;transform:translateY(-50%);height:60%;border-radius:4px;
    opacity:.14;background:var(--s1);z-index:0}
  .bar-cell span{position:relative;z-index:1}
  .caret{color:var(--faint);font-size:10px;display:inline-block;width:10px}
  .ok{color:var(--good-ink);font-weight:600}
  tr.netrow{cursor:pointer}
  /* ── ТДС: вердикт і ланцюг редіректів ───────────────────────────────────── */
  tr.tdsrow{cursor:pointer}
  .vd{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--radius-xs);white-space:nowrap}
  .vd.ok{background:var(--good-bg);color:var(--good-ink)}
  .vd.bad{background:var(--crit-bg);color:var(--crit-ink)}
  .vd.warn{background:var(--warn-bg);color:var(--warn-ink)}
  .vd.mute{background:var(--bg2);color:var(--dim)}
  .chain{list-style:none;margin:0;padding:2px 0 8px}
  .chain li{display:grid;grid-template-columns:30px 54px 1fr;gap:10px;align-items:baseline;
    padding:6px 2px;font-size:12px}
  .chain li+li{border-top:1px solid var(--border)}
  .chain .hop{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
  .chain .st{font-weight:700;font-size:11px;font-variant-numeric:tabular-nums}
  .chain .st.s2{color:var(--good-ink)} .chain .st.s3{color:var(--info-ink)}
  .chain .st.s4,.chain .st.s5,.chain .st.s0{color:var(--crit-ink)}
  .chain .u{word-break:break-all;color:var(--dim);font-family:var(--mono);font-size:11.5px}
  .chain .ti{color:var(--faint);font-size:11px;margin-top:2px}
  .chain .via{display:inline-block;font-size:10px;font-weight:700;color:var(--faint);
    background:var(--bg2);border-radius:var(--radius-xs);padding:1px 5px;margin-left:6px;vertical-align:1px}
  .tdsbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bg2);margin:2px 0 10px}
  .tdsbar i{display:block;height:100%}
  .tdsleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--dim);margin-bottom:12px}
  .tdsleg span{display:inline-flex;align-items:center;gap:5px}
  .tdsleg .vd{font-size:10.5px;padding:1px 6px}
  .morebtn{display:block;width:100%;margin-top:10px;padding:8px;background:var(--panel);
    border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--dim);font:inherit;
    font-size:12.5px;font-weight:500;cursor:pointer}
  .morebtn:hover{background:var(--bg2);color:var(--fg)}

  /* ── Лозенги ───────────────────────────────────────────────────────────── */
  .chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:var(--radius-xs);font-weight:600;
    text-transform:uppercase;letter-spacing:.3px;background:var(--bg2);color:var(--dim);
    border:1px solid transparent;white-space:nowrap}
  .chip.geo{background:var(--info-bg);color:var(--info-ink)}
  .chip.slot{background:color-mix(in srgb,var(--s4) 12%,#fff);color:var(--s4)}
  /* Смужка історії: чи падає лінк стабільно, чи це був разовий збій */
  .dim-ttl{font-family:inherit;font-size:11px;color:var(--faint);max-width:230px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .hist{display:inline-flex;gap:3px;align-items:center}
  .hist i{width:9px;height:9px;border-radius:2px;background:var(--border-strong);flex:none}
  .hist i.o{background:var(--good)} .hist i.w{background:var(--warn)} .hist i.b{background:var(--crit)}
  .runs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
  .run{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);
    background:var(--bg2);border-radius:var(--radius-xs);padding:3px 8px;font-variant-numeric:tabular-nums}
  .run s{text-decoration:none;font-weight:700}
  .run s.o{color:var(--good-ink)} .run s.w{color:var(--warn-ink)} .run s.b{color:var(--crit-ink)}
  .chip.tm{background:color-mix(in srgb,var(--hue,var(--s1)) 12%,#fff);color:var(--hue,var(--s1));
    border-color:color-mix(in srgb,var(--hue,var(--s1)) 28%,#fff)}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
    padding:2px 7px;border-radius:var(--radius-xs);background:var(--bg2);color:var(--dim);border:1px solid transparent}
  .badge.new{color:var(--good-ink);background:var(--good-bg)}
  .badge.dead{color:var(--crit-ink);background:var(--crit-bg)}
  .badge.warn{color:var(--warn-ink);background:var(--warn-bg)}

  /* ── Розподіли ─────────────────────────────────────────────────────────── */
  .dist{display:flex;flex-direction:column;gap:7px}
  .dist .row{display:flex;align-items:center;gap:10px}
  .dist .name{width:132px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;color:var(--dim)}
  .dist .track{flex:1;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden}
  .dist .fill{height:100%;border-radius:4px;background:var(--s1)}
  .dist .v{width:92px;text-align:right;font-size:12px;color:var(--faint)}
  .dist-head{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);
    text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding-bottom:6px;margin-bottom:2px;
    border-bottom:1px solid var(--border)}
  .drow{cursor:pointer;border-radius:var(--radius-xs);padding:3px 5px;margin:0 -5px}
  .drow:hover{background:var(--bg)}
  .drow.sel{background:var(--info-bg);box-shadow:inset 3px 0 0 var(--s1)}

  /* ── Шухляда ───────────────────────────────────────────────────────────── */
  .drawer{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);
    margin-bottom:12px;box-shadow:var(--shadow)}
  .drawer>summary{cursor:pointer;padding:12px 16px;font-size:13px;font-weight:600;color:var(--dim);
    list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
  .drawer>summary::-webkit-details-marker{display:none}
  .drawer>summary::before{content:"▸";color:var(--faint);font-size:10px}
  .drawer[open]>summary::before{content:"▾"}
  .drawer>summary:hover{color:var(--fg);background:var(--bg)}
  .drawer .inner{padding:0 12px 4px}
  .drawer .grid{margin-bottom:12px}
  .drawer .panel{box-shadow:none;border-color:var(--grid)}

  /* ── Вкладка Jira ──────────────────────────────────────────────────────── */
  .jhead,.jrow{display:grid;grid-template-columns:1.7fr 2fr .8fr .9fr .8fr;gap:12px;align-items:center}
  .jhead{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:600;
    padding:0 8px 7px;border-bottom:2px solid var(--border)}
  .jhead span:not(:first-child){text-align:right}
  .jrow{padding:8px;cursor:pointer;border-bottom:1px solid var(--grid)}
  .jrow:hover,.jrow:focus-visible{background:var(--bg)}
  .jname{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jbar{display:flex;gap:2px;height:8px;align-items:center}
  .jbar i{display:block;height:100%;border-radius:4px;min-width:0}
  .jbar i.self{background:var(--s3)}
  .jbar i.oth{background:var(--s4)}
  .jparent{font-size:11px;color:var(--faint);margin-top:2px}
  .jchk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-top:10px;cursor:pointer}
  .jchk input{accent-color:var(--s1);width:14px;height:14px;cursor:pointer}
  .jpre{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;
    font-family:var(--mono);font-size:12px;color:var(--fg);overflow-x:auto;white-space:pre;margin:0 0 12px}
  @media(max-width:1050px){
    .jhead,.jrow{grid-template-columns:1.5fr .8fr .9fr;gap:8px}
    .jbar,.jhead span:nth-child(2),.jhead span:nth-child(5),.jrow>span:nth-child(5){display:none}
  }

  /* ── Модальне вікно ────────────────────────────────────────────────────── */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(9,30,66,.54);
    display:flex;align-items:flex-start;justify-content:center;padding:60px 20px 20px}
  .modal[hidden]{display:none}
  .mbox{background:var(--panel);border-radius:var(--radius);max-width:580px;width:100%;
    box-shadow:0 8px 32px rgba(9,30,66,.25);max-height:84vh;overflow:auto}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 8px;gap:10px}
  .mhead h3{margin:0;font-size:17px;font-weight:600;color:var(--fg)}
  .mx{background:transparent;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:5px 9px;border-radius:var(--radius-sm)}
  .mx:hover{color:var(--fg);background:var(--bg2)}
  .mbody{padding:0 24px 24px;font-size:13.5px;line-height:1.6;color:var(--dim)}
  .mbody p{margin:0 0 12px}
  .mbody b{color:var(--fg);font-weight:600}
  .mbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);
    border:1px solid transparent;background:var(--bg2);color:var(--fg);font:inherit;font-size:13px;
    font-weight:500;cursor:pointer;text-decoration:none}
  .mbtn:hover{background:rgba(9,30,66,.12);text-decoration:none}
  .mbtn.primary{background:var(--s1);color:#fff}
  .mbtn.primary:hover{background:#0055CC}
  .mbtn:disabled{opacity:.5;cursor:default}
  .mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .mnote{font-size:12px;color:var(--faint);line-height:1.6}
  .mstatus{margin-top:12px;padding:11px 13px;border-radius:var(--radius-sm);background:var(--bg2);
    font-size:12.5px;font-family:var(--mono);line-height:1.6;color:var(--dim)}

  /* ── Екран пароля ──────────────────────────────────────────────────────── */
  .empty{max-width:420px;margin:12vh auto;text-align:center;background:var(--panel);
    border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow)}
  .empty h1{font-size:20px;font-weight:600;margin:0 0 6px}
  .empty p{color:var(--dim);line-height:1.6;font-size:13.5px}
  .empty code{background:var(--bg2);padding:3px 7px;border-radius:var(--radius-xs);font-family:var(--mono);color:var(--fg);font-size:13px}

  @media(max-width:1000px){
    .topbar{padding:8px 14px;min-height:48px}
    /* на вузькому бокове меню лягає горизонтальною смугою */
    .shell{display:block}
    .side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;
      border-right:0;border-bottom:1px solid var(--border);padding:8px 12px;gap:4px;
      scrollbar-width:none}
    .side::-webkit-scrollbar{display:none}
    .side-label{display:none}
    .side button{width:auto;white-space:nowrap}
    .hrow{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:8px;scrollbar-width:none;-ms-overflow-style:none}
    .hrow::-webkit-scrollbar{display:none}
    .hrow.filters{position:static;margin:0 -14px 4px;padding:10px 14px}
    .brand .sub,.meta{display:none}
    #refreshBtn{position:sticky;right:0;z-index:2;background:var(--panel);box-shadow:-8px 0 10px -8px rgba(9,30,66,.3)}
    body main{padding:0 14px 48px}
    main .phead{flex-direction:column;align-items:flex-start;gap:9px}
    main .phead .tools,main .phead .seg{width:100%}
    main .phead .chead{justify-content:flex-start;width:100%}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>/*__KT_DATA__*/</script>
<script>
function KT_boot(D){
  const app = document.getElementById("app");

  // ── helpers ──────────────────────────────────────────────────────────────
  const N = D.days.length;
  const fmtInt = n => Math.round(n).toLocaleString("uk-UA").replace(/,/g," ");
  const fmtMoney = n => "$"+ Math.round(n).toLocaleString("uk-UA").replace(/,/g," ");
  const fmtPct = n => n.toFixed(2)+"%";
  const shortDay = d => d.slice(5);
  const div = (a,b)=> b>0 ? a/b : 0;
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cmp = (a,b)=> typeof a==="string" ? (a<b?-1:a>b?1:0) : (a||0)-(b||0);
  // Коротка мітка команди в таблиці сайтів. Назва, що закінчується номером,
  // стискається до "К<номер>"; решта — ПЕРШЕ СЛОВО, а не перші 6 символів,
  // інакше назва з двох слів обрізалась посеред першого. Повна — в title.
  // (Без реальних назв: цей файл їде в публічну збірку відкритим текстом.)
  const teamShort = (i)=>{
    const n=(D.teams&&D.teams[i])||"";
    const m=n.match(/(\d+)\s*$/); if(m) return "К"+m[1];
    const w=(n.trim().split(/\s+/)[0]||n);
    return w.length<=10 ? w : w.slice(0,9)+"…";
  };

  // Колір закріплений за командою (ідентичність), а не за її місцем у рейтингу:
  // після фільтра «вцілілі» не перефарбовуються. Понад шість команд кольором не
  // розрізняємо — сьомий відтінок під дальтонізмом не відрізнити від наявного.
  const TPAL=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
  const teamHue=i=> (i>=0 && i<TPAL.length) ? TPAL[i] : "var(--dim)";
  const teamChip=i=>`<span class="chip tm" style="--hue:${teamHue(i)}" title="${esc((D.teams&&D.teams[i])||"")}">${teamShort(i)}</span>`;

  const campTeam = D.camps.map(c=>c[4]);   // campIdx → teamIdx
  const nTeams = (D.teams||["—"]).length;

  // ── state ──────────────────────────────────────────────────────────────────
  const state = {
    tab:"ov", mode:"30", fromIdx:0, toIdx:N-1, dayIdx:N-1, selectedPage:null, team:-1,  // team: -1 = усі
    filter:{ type:"site", match:"partial", q:"", active:false, campSet:null, offerSet:null }
  };
  const teamOK = (t)=> state.team<0 || t===state.team;

  function setRange(){
    if(state.mode==="all"){ state.fromIdx=0; state.toIdx=N-1; }
    else if(state.mode==="day"){ state.fromIdx=state.dayIdx; state.toIdx=state.dayIdx; }
    else { const k=+state.mode; state.toIdx=N-1; state.fromIdx=Math.max(0,N-k); }
  }

  function computeFilter(){
    const f=state.filter;
    if(!f.q.trim()){ f.active=false; f.campSet=null; f.offerSet=null; return; }
    f.active=true;
    const q=f.q.trim().toLowerCase();
    const test = f.match==="exact" ? s=>String(s).toLowerCase()===q : s=>String(s).toLowerCase().includes(q);
    if(f.type==="site"){
      const cs=new Set();
      D.camps.forEach((c,ci)=>{ if(teamOK(c[4]) && test(c[1])) cs.add(ci); });
      const os=new Set();
      for(const r of D.rel){ if(cs.has(r[0])) os.add(r[1]); }
      f.campSet=cs; f.offerSet=os;
    }else{
      const os=new Set();
      D.offers.forEach((o,oi)=>{ if(test(o)) os.add(oi); });
      const cs=new Set();
      for(const r of D.rel){ if(os.has(r[1]) && teamOK(campTeam[r[0]])) cs.add(r[0]); }
      f.offerSet=os; f.campSet=cs;
    }
  }

  // ── aggregation (range-aware, from day-level cd/od) ─────────────────────────
  // per-day series [clicks,conv,leads,sales,rev] respecting the active filter
  // per-day: [clicks,conv,leads,sales,rev,saleRev] — з урахуванням команди + фільтра
  function seriesData(){
    const f=state.filter, per=Array.from({length:N},()=>[0,0,0,0,0,0]);
    if(f.active && f.type==="brand"){
      for(const r of D.od){ if(!f.offerSet.has(r[1])||!teamOK(r[8])) continue; const d=per[r[0]]; d[0]+=r[2];d[1]+=r[3];d[2]+=r[4];d[3]+=r[5];d[4]+=r[6];d[5]+=r[7]; }
    }else if(f.active && f.type==="site"){
      for(const r of D.cd){ if(!f.campSet.has(r[1])||!teamOK(campTeam[r[1]])) continue; const d=per[r[0]]; d[0]+=r[2];d[1]+=r[3];d[2]+=r[4];d[3]+=r[5];d[4]+=r[6];d[5]+=r[7]; }
    }else{
      for(let t=0;t<nTeams;t++){ if(!teamOK(t)) continue; const tt=D.totals[t]; if(!tt) continue;
        for(let i=0;i<N;i++){ const s=tt[i], d=per[i]; for(let j=0;j<6;j++) d[j]+=s[j]; } }
    }
    return per;
  }
  function sumRange(per,from,to){ const s=[0,0,0,0,0,0]; for(let i=from;i<=to;i++) for(let j=0;j<6;j++) s[j]+=per[i][j]; return s; }

  // agg arrays: [clicks,conv,leads,sales,rev,saleRev] — з урахуванням команди
  function aggCampaigns(from,to,restrict){
    const m=new Map();
    for(const r of D.cd){ const di=r[0]; if(di<from||di>to) continue; if(restrict&&!restrict.has(r[1])) continue; if(!teamOK(campTeam[r[1]])) continue;
      let a=m.get(r[1]); if(!a){a=[0,0,0,0,0,0];m.set(r[1],a);} a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];a[4]+=r[6];a[5]+=r[7]; }
    return m;
  }
  function aggOffers(from,to,restrict){
    const m=new Map();
    for(const r of D.od){ const di=r[0]; if(di<from||di>to) continue; if(restrict&&!restrict.has(r[1])) continue; if(!teamOK(r[8])) continue;
      let a=m.get(r[1]); if(!a){a=[0,0,0,0,0,0];m.set(r[1],a);} a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];a[4]+=r[6];a[5]+=r[7]; }
    return m;
  }
  // relationship aggregation (whole history). groupCol: index in rel row; restrict on entityCol.
  function relGroup(groupCol, entityCol, entitySet){
    const m=new Map();
    for(const r of D.rel){ if(entitySet&&!entitySet.has(r[entityCol])) continue; if(!teamOK(campTeam[r[0]])) continue;
      const k=r[groupCol]; let a=m.get(k); if(!a){a=[0,0,0,0,0,0];m.set(k,a);} a[0]+=r[4];a[1]+=r[5];a[2]+=r[6];a[3]+=r[7];a[4]+=r[8];a[5]+=r[9]; }
    return m; // key -> [clicks,conv,leads,sales,rev,saleRev]
  }

  // ── layout ───────────────────────────────────────────────────────────────
  app.innerHTML = `
    <header class="topbar">
      <div class="brand"><div class="logo">K</div>
        <div><h1>Keitaro · Pulse</h1><div class="sub">Аналітика трафіку по днях</div></div></div>
      <div class="meta"><div>історія: <b>${D.range.from}</b> → <b>${D.range.to}</b></div>
        <div>оновлено: <b>${D.generated}</b></div></div>
      <button class="refresh" id="refreshBtn" type="button"><span class="rico">↻</span><span id="refreshAge">оновити</span></button>
    </header>
    <div class="shell">
    <nav class="side" id="tabSeg">
      <div class="side-label">Звіти</div>
      <button data-tab="ov" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><rect x="5" y="11" width="3.5" height="7" rx="1"/><rect x="10.2" y="6" width="3.5" height="12" rx="1"/><rect x="15.5" y="13" width="3.5" height="5" rx="1"/></svg>
        Огляд</button>
      <button data-tab="net" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 1 0-5.7-5.7L11.7 6.6"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 1 0 5.7 5.7l1.4-1.4"/></svg>
        Партнерки</button>
      <button data-tab="jira" type="button">

  // ── controls ───────────────────────────────────────────────────────────────
  // Період і конкретний день — один випадний список, як фільтри в Jira:
  // пресети згори, окремі дні нижче. Два контроли на одне поняття плутали.
  const daySel=document.getElementById("daySel");
  daySel.innerHTML=
    `<option value="all">Весь період</option>`+
    `<option value="90">Останні 90 днів</option>`+
    `<option value="30">Останні 30 днів</option>`+

    D.days.slice().reverse().map((d,i)=>`<option value="d:${N-1-i}">${d}</option>`).join("")+
    `</optgroup>`;
  daySel.addEventListener("change",e=>{
    const v=e.target.value;
    if(v.startsWith("d:")){ state.mode="day"; state.dayIdx=+v.slice(2); } else state.mode=v;
    render();
  });
  function syncSeg(){ daySel.value = state.mode==="day" ? "d:"+state.dayIdx : state.mode; }

  // Команда — теж випадний список
  const teamSel=document.getElementById("teamSel");
  function syncTeam(){ teamSel.value=String(state.team); }
  if(nTeams>1){
    teamSel.innerHTML=`<option value="-1">Усі команди</option>`+D.teams.map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join("");
    teamSel.addEventListener("change",e=>{ state.team=+e.target.value; state.selectedPage=null; syncTeam(); computeFilter(); render(); });
  } else teamSel.style.display="none";

  // Шапка займала 153px постійно. При скролі ховаємо підзаголовок і дати —
  // лишаються самі контроли.
  // Пропорція графіка залежить від ширини картки — при зміні розміру вікна
  // перемальовуємо, але тільки коли справді перетнули межу.
  (function chartOnResize(){
    let last=null, tm=null;
    addEventListener("resize",()=>{ clearTimeout(tm); tm=setTimeout(()=>{
      const w=document.getElementById("chartWrap"); if(!w||state.tab!=="ov") return;
      const n=(w.clientWidth||900)<620; if(n!==last){ last=n; renderChart(); }
    },180); },{passive:true});
  })();

  (function shrinkHeader(){
    const h=document.querySelector("header"); let on=false;
    addEventListener("scroll",()=>{ const want=scrollY>40;
      if(want!==on){ on=want; h.classList.toggle("tight",on); } },{passive:true});
  })();

  // Клікабельні рядки — div-и: з клавіатури вони недосяжні без цього.
  addEventListener("keydown",e=>{
    const el=e.target;
    if((e.key==="Enter"||e.key===" ")&&el instanceof HTMLElement&&el.matches('[data-key="1"]')){
      e.preventDefault(); el.click(); }
  });

  const smooth=!matchMedia("(prefers-reduced-motion: reduce)").matches;
  const toTop=()=>scrollTo({top:0,behavior:smooth?"smooth":"auto"});

  const tabSeg=document.getElementById("tabSeg");
  function syncTab(){
    tabSeg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
    document.getElementById("tabOv").style.display   = state.tab==="ov"?"":"none";
    document.getElementById("tabNet").style.display  = state.tab==="net"?"":"none";
    document.getElementById("tabJira").style.display = state.tab==="jira"?"":"none";
    document.getElementById("tabTds").style.display  = state.tab==="tds"?"":"none";
    // На вкладці Jira період і команди з Keitaro ні до чого — ховаємо, щоб не
    // здавалось, ніби вони на щось впливають.
    const j = state.tab==="jira" || state.tab==="tds";
    document.getElementById("filterRow").style.display = j?"none":"flex";
    // на «Партнерках» пошук по сайтах/брендах ні до чого — там свій фільтр
    const ov = state.tab==="ov";
    document.getElementById("fSearchWrap").style.display = ov?"":"none";
    fType.style.display = ov?"":"none";
    fMatch.style.display = ov?"":"none";
    document.getElementById("fchip").style.display = ov?"":"none";
  }
  tabSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||b.dataset.tab===state.tab)return;
    state.tab=b.dataset.tab; syncTab(); render(); toTop(); });

  const netFiltSeg=document.getElementById("netFilt"), netSearchEl=document.getElementById("netSearch");
  function syncNetFilt(){ [...netFiltSeg.children].forEach(b=>b.classList.toggle("on",b.dataset.f===netFilt)); }
  netFiltSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; netFilt=b.dataset.f; syncNetFilt(); renderNets(); });
  let netTimer=null;
  netSearchEl.addEventListener("input",e=>{ netQ=e.target.value.trim(); clearTimeout(netTimer); netTimer=setTimeout(renderNets,180); });

  function selectTeam(t){
    // Рядок, з якого прийшов клік, після перемальовки зникає разом із фокусом —
    // повертаємо його на те саме місце, інакше з клавіатури вибір не зняти.
    const was=document.activeElement, key=was&&was.dataset?was.dataset.tm:null;
    state.team=t; state.selectedPage=null; syncTeam(); computeFilter(); render();
    if(key!=null){ const el=document.querySelector(`.trow[data-tm="${key}"]`); if(el) el.focus(); }
  }

  const cmpSeg=document.getElementById("cmpSeg");
  function syncCmp(){ [...cmpSeg.children].forEach(b=>b.classList.toggle("on",b.dataset.c===String(cmpMode))); }
  cmpSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
    cmpMode=b.dataset.c; syncCmp(); renderChart(); });

  const jWeekSeg=document.getElementById("jWeek"), jFiltSeg=document.getElementById("jFilt");
  function syncJ(){
    [...jWeekSeg.children].forEach(b=>b.classList.toggle("on",b.dataset.w===jWeek));
    [...jFiltSeg.children].forEach(b=>b.classList.toggle("on",b.dataset.f===jFilt));
  }
  jWeekSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
    jWeek=b.dataset.w; jCap=30; syncJ(); renderJira(); });
  jFiltSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
    jFilt=b.dataset.f; jCap=30; syncJ(); renderJiraTable(); });
  let jTimer=null;
  document.getElementById("jSearch").addEventListener("input",e=>{ jQ=e.target.value.trim();
    clearTimeout(jTimer); jTimer=setTimeout(()=>{ jCap=30; renderJiraTable(); },180); });
  document.getElementById("jHideDaily").addEventListener("change",e=>{ jHideDaily=e.target.checked; jCap=30; renderJira(); });

  const mvSeg=document.getElementById("mvSeg");
  function syncMv(){ [...mvSeg.children].forEach(b=>b.classList.toggle("on",+b.dataset.k===mvMetric)); }
  mvSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; mvMetric=+b.dataset.k; syncMv(); renderMovers(); });

  const fType=document.getElementById("fTypeSel"), fMatch=document.getElementById("fMatchSel"), fq=document.getElementById("fq");
  function syncFilterUI(){ fType.value=state.filter.type; fMatch.value=state.filter.match; }
  fType.addEventListener("change",e=>{ state.filter.type=e.target.value; applyFilter(); });
  fMatch.addEventListener("change",e=>{ state.filter.match=e.target.value; applyFilter(); });
  document.getElementById("fReset").addEventListener("click",()=>{
    state.filter.q=""; fq.value=""; state.team=-1; state.selectedPage=null; state.mode="30";
    syncTeam(); syncSeg(); applyFilter();
  });
  let fqTimer=null;
  fq.addEventListener("input",e=>{ state.filter.q=e.target.value; clearTimeout(fqTimer); fqTimer=setTimeout(applyFilter,180); });
  function applyFilter(){ state.selectedPage=null; computeFilter(); render(); }
  function setFilter(type,q,match){ state.filter.type=type; state.filter.match=match||"exact"; state.filter.q=q; fq.value=q; syncFilterUI(); applyFilter(); toTop(); }
  function clearFilter(){ state.filter.q=""; fq.value=""; applyFilter(); }

  function renderChip(){
    const f=state.filter, el=document.getElementById("fchip");
    if(!f.active){ el.innerHTML=""; return; }
    const nC=f.campSet?f.campSet.size:0, nO=f.offerSet?f.offerSet.size:0;
    const label = f.type==="site" ? "Сайт" : "Бренд";
    el.innerHTML=`<span class="active-chip ${f.type==="brand"?"brand":""}">
      ${label} ${f.match==="exact"?"=":"⊃"} “${esc(f.q)}”
      <span class="cnt">${nC} сайтів · ${nO} брендів</span>
      <span class="x" id="clearF">✕</span></span>`;
    document.getElementById("clearF").onclick=clearFilter;
  }

  // ── головне: один герой-показник + три плитки ───────────────────────────────
  // Вісім однакових плиток не давали зачіпки, з чого починати читати. Тепер
  // один показник веде, три підпирають, решта — рядком дрібним текстом.
  function rangeLabel(){
    const dm=d=>d.slice(8,10)+"."+d.slice(5,7);
    if(state.mode==="day") return dm(D.days[state.dayIdx]);
    if(state.mode==="all") return "весь період";
    return `${dm(D.days[state.fromIdx])}–${dm(D.days[state.toIdx])}`;
  }

  function renderKpis(){
    const per=seriesData();
    const cur=sumRange(per,state.fromIdx,state.toIdx);
    const len=state.toIdx-state.fromIdx+1, pTo=state.fromIdx-1;
    const prev = pTo>=0 ? sumRange(per,Math.max(0,pTo-len+1),pTo) : null;
    const vals=[]; for(let i=state.fromIdx;i<=state.toIdx;i++) vals.push(per[i][5]);

    // Стрілка + слово поруч із кольором: статус ніколи не тримається на самому кольорі.
    const delta=(i,money,cls)=>{
      if(!prev) return cls ? `<div class="dl flat"><span class="sub">немає з чим порівняти</span></div>`
        : `<div class="hdl flat"><span class="sub">попереднього періоду такої ж довжини немає</span></div>`;
      const d=cur[i]-prev[i], p=prev[i], pct=p>0?d/p*100:(d>0?100:0);
      const k=d>0?"up":(d<0?"down":"flat"), ic=d>0?"▲":(d<0?"▼":"—"), w=d>0?"зростання":(d<0?"спад":"без змін");
      return `<div class="${cls||"hdl"} ${k}">${ic} ${Math.abs(pct).toFixed(0)}% <span class="sub">${w} проти ${money?fmtMoney(p):fmtInt(p)}</span></div>`;
    };
    document.getElementById("hero").innerHTML=
      `<div><div class="hlbl">Підтверджений дохід <span class="hrange">${esc(rangeLabel())}</span></div>
        <div class="hval">${fmtMoney(cur[5])}</div>${delta(5,1)}</div>
       <div><div class="hcap">дохід по днях</div><div class="hspark">${sparkSVG(vals,"var(--s1)")}</div></div>`;

    const cr=div(cur[1],cur[0])*100, crPrev=prev?div(prev[1],prev[0])*100:null;
    const crD=crPrev!==null?cr-crPrev:0;
    const crCls=crD>0.05?"up":(crD<-0.05?"down":"flat"), crIc=crD>0.05?"▲":(crD<-0.05?"▼":"—");
    document.getElementById("tiles").innerHTML=[
      `<div class="kpi" style="--accent:var(--s1)"><div class="lbl">Кліки</div><div class="val mono">${fmtInt(cur[0])}</div>${delta(0,0,"dl")}</div>`,
      `<div class="kpi" style="--accent:var(--s2)"><div class="lbl">Конверсії</div><div class="val mono">${fmtInt(cur[1])}</div>${delta(1,0,"dl")}</div>`,
      `<div class="kpi" style="--accent:var(--dim)"><div class="lbl">CR</div><div class="val mono">${fmtPct(cr)}</div>`+
        (crPrev!==null?`<div class="dl ${crCls}">${crIc} ${Math.abs(crD).toFixed(2)} п.п. <span class="sub">проти ${fmtPct(crPrev)}</span></div>`:`<div class="dl flat"><span class="sub">—</span></div>`)+`</div>`,
    ].join("");

    const restrict = state.filter.active?state.filter.campSet:null;
    const activeSites=aggCampaigns(state.fromIdx,state.toIdx,restrict).size;
    document.getElementById("moreKpi").innerHTML=
      [["Ліди",fmtInt(cur[2])],["Продажі",fmtInt(cur[3])],["Дохід усього",fmtMoney(cur[4])],
       [state.filter.active&&state.filter.type==="brand"?"Брендів у фільтрі":"Активних сайтів",
        fmtInt(state.filter.active&&state.filter.type==="brand"?state.filter.offerSet.size:activeSites)]]
      .map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("");
  }
  // ── трафік по днях ───────────────────────────────────────────────────────────
  // Кліки й конверсії мають різні порядки величин, тож вони на двох панелях зі
  // спільною віссю часу — один графік із двома шкалами вигадував би кореляцію,
  // якої в даних немає.
  //
  // Поверх кожної панелі накладається той самий відрізок іншого періоду:
  // поточний — кольором, минулий — сірим пунктиром. Минулий тут контекст, а не
  // друга серія, тому він приглушений: «виділи одне, решту в сірий».
  let cmpMode="prev";                 // prev | 7 | 30 | off
  const CMP_LBL={prev:"попередній період", 7:"тиждень тому", 30:"місяць тому"};
  const CMP_VS ={prev:"проти попереднього періоду", 7:"проти того ж відрізка тижнем раніше",
                 30:"проти того ж відрізка місяцем раніше"};

  function cmpShift(){                // на скільки днів зсунути вікно порівняння
    if(cmpMode==="off") return 0;
    if(cmpMode==="prev") return state.toIdx-state.fromIdx+1;
    return +cmpMode;
  }

  function renderChart(){
    const wrap=document.getElementById("chartWrap");
    const per=seriesData();
    const s=[]; for(let i=state.fromIdx;i<=state.toIdx;i++)
      s.push({idx:i,day:D.days[i],clicks:per[i][0],conv:per[i][1],rev:per[i][5]});
    const n=s.length;
    const k=cmpShift();
    // Відрізок для порівняння: ті самі позиції, але зсунуті назад на k днів.
    const cmp = k>0 ? s.map(d=>{ const j=d.idx-k; return j>=0
      ? {day:D.days[j],clicks:per[j][0],conv:per[j][1],rev:per[j][5]} : null; }) : [];
    const hasCmp = k>0 && cmp.some(Boolean);

    const narrow=(wrap.clientWidth||900)<620;
    const W=narrow?460:900, PL=narrow?46:56, PR=narrow?44:62, PT=26,
          H1=narrow?132:132, GAP=narrow?32:34, H2=narrow?104:108, XB=22, H=PT+H1+GAP+H2+XB;
    const iw=W-PL-PR, top2=PT+H1+GAP;
    const x=i=> n<=1 ? PL+iw/2 : PL+(i/(n-1))*iw;

    const STEPS=[1,1.1,1.2,1.3,1.4,1.5,1.6,1.8,2,2.2,2.5,3,3.5,4,4.5,5,6,7,8,9,10];
    const niceMax=(m)=>{ if(!(m>0)) return 1; const e=Math.pow(10,Math.floor(Math.log10(m))), f=m/e;
      return (STEPS.find(s=>f<=s+1e-9)||10)*e; };
    const peak=(key)=>Math.max(1,...s.map(d=>d[key]),...(hasCmp?cmp.filter(Boolean).map(d=>d[key]):[]));
    const m1=niceMax(peak("clicks")), m2=niceMax(peak("conv"));
    const y1=v=>PT+H1-(v/m1)*H1, y2=v=>top2+H2-(v/m2)*H2;

    const line=(arr,f)=>{ let p="",open=false;
      arr.forEach((d,i)=>{ if(!d){ open=false; return; }
        p+=(open?" L ":` M `)+x(i).toFixed(1)+" "+f(d).toFixed(1); open=true; });
      return p; };
    const l1=line(s,d=>y1(d.clicks)), l2=line(s,d=>y2(d.conv));
    const a1=n>1?l1+` L ${x(n-1).toFixed(1)} ${PT+H1} L ${x(0).toFixed(1)} ${PT+H1} Z`:"";
    const c1=hasCmp?line(cmp,d=>y1(d.clicks)):"", c2=hasCmp?line(cmp,d=>y2(d.conv)):"";

    // Вихідні тонують фон: тижневі провали перестають виглядати аномалією.
    let bands="";
    if(n<=120) for(let i=0;i<n;i++){
      const wd=new Date(s[i].day+"T00:00:00Z").getUTCDay();
      if(wd!==0&&wd!==6) continue;
      const half=n>1?iw/(n-1)/2:iw/2;
      const x0=Math.max(PL,x(i)-half), x1=Math.min(W-PR,x(i)+half);
      bands+=`<rect x="${x0.toFixed(1)}" y="${PT}" width="${(x1-x0).toFixed(1)}" height="${H1}" fill="var(--band)"/>`+
             `<rect x="${x0.toFixed(1)}" y="${top2}" width="${(x1-x0).toFixed(1)}" height="${H2}" fill="var(--band)"/>`;
    }

    let grid="",ylab="";
    for(const [top,hh,mx] of [[PT,H1,m1],[top2,H2,m2]])
      for(let g=0;g<=2;g++){ const yy=top+(g/2)*hh;
        grid+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
        ylab+=`<text x="${PL-9}" y="${yy+3}" text-anchor="end" fill="var(--faint)" font-size="9" font-family="var(--mono)">${fmtInt(mx*(1-g/2))}</text>`; }

    const dm=d=>d.slice(8,10)+"."+d.slice(5,7);
    let xlab="", step=Math.max(1,Math.ceil(n/(narrow?5:10)));
    for(let i=0;i<n;i+=step) xlab+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="var(--faint)" font-size="9" font-family="var(--mono)">${dm(s[i].day)}</text>`;

    // Підпис останнього значення просто біля лінії — щоб головне число не
    // доводилось видобувати наведенням.
    const last=s[n-1];
    const endLbl=(yy,v,color)=>`<text x="${(W-PR+7)}" y="${yy+3.5}" fill="${color}" font-size="10.5" font-weight="700" font-family="var(--mono)">${fmtInt(v)}</text>`;
    const dots = n===1
      ? `<circle cx="${x(0)}" cy="${y1(s[0].clicks)}" r="4" fill="var(--s1)"/><circle cx="${x(0)}" cy="${y2(s[0].conv)}" r="4" fill="var(--s2)"/>`
      : `<circle cx="${x(n-1)}" cy="${y1(last.clicks)}" r="3.5" fill="var(--s1)"/><circle cx="${x(n-1)}" cy="${y2(last.conv)}" r="3.5" fill="var(--s2)"/>`;

    wrap.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--s1)" stop-opacity=".16"/><stop offset="100%" stop-color="var(--s1)" stop-opacity="0"/></linearGradient></defs>
      ${bands}${grid}${ylab}${xlab}
      <text x="${PL}" y="${PT-9}" fill="var(--s1)" font-size="10.5" font-weight="700" letter-spacing=".5">КЛІКИ</text>
      <text x="${PL}" y="${top2-9}" fill="var(--s2)" font-size="10.5" font-weight="700" letter-spacing=".5">КОНВЕРСІЇ</text>
      ${hasCmp?`<path d="${c1}" fill="none" stroke="var(--dim)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".75" stroke-linejoin="round"/>`:""}
      ${hasCmp?`<path d="${c2}" fill="none" stroke="var(--dim)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".75" stroke-linejoin="round"/>`:""}
      ${a1?`<path d="${a1}" fill="url(#ga)"/>`:""}
      <path d="${l1}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
      <path d="${l2}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>
      ${dots}${endLbl(y1(last.clicks),last.clicks,"var(--s1)")}${endLbl(y2(last.conv),last.conv,"var(--s2)")}
      <line id="cursor" x1="0" y1="${PT}" x2="0" y2="${top2+H2}" stroke="var(--border-hi)" stroke-width="1" style="opacity:0"/>
      <circle id="d1" r="4" fill="var(--s1)" stroke="var(--panel-solid)" stroke-width="2" style="opacity:0"/>
      <circle id="d2" r="4" fill="var(--s2)" stroke="var(--panel-solid)" stroke-width="2" style="opacity:0"/>
      <rect id="hit" x="${PL}" y="${PT}" width="${iw}" height="${top2+H2-PT}" fill="transparent"/>
      </svg><div class="tip" id="tip"></div>`;

    // легенда і підсумок над графіком
    const sum=(arr,key)=>arr.reduce((t,d)=>t+(d?d[key]:0),0);
    const curC=sum(s,"clicks"), curV=sum(s,"conv");
    const pc=(a,b)=> b>0 ? `${a>=b?"+":"−"}${Math.abs((a-b)/b*100).toFixed(0)}%` : "—";
    const cls=(a,b)=> a>b?"up":(a<b?"down":"flat");
    document.getElementById("chartLegend").innerHTML=
      `<span><i style="background:var(--s1)"></i>Кліки</span><span><i style="background:var(--s2)"></i>Конверсії</span>`+
      (hasCmp?`<span><i class="dash"></i>${esc(CMP_LBL[cmpMode]||"порівняння")}</span>`:"");
    document.getElementById("chartSub").innerHTML = hasCmp
      ? `Кліки <b class="mono">${fmtInt(curC)}</b> <span class="${cls(curC,sum(cmp,"clicks"))}">${pc(curC,sum(cmp,"clicks"))}</span> · `+
        `конверсії <b class="mono">${fmtInt(curV)}</b> <span class="${cls(curV,sum(cmp,"conv"))}">${pc(curV,sum(cmp,"conv"))}</span> `+
        `<span class="psubdim">${esc(CMP_VS[cmpMode]||"проти минулого відрізка")} — він пунктиром на графіку</span>`
      : (k>0 ? `<span class="psubdim">для цього порівняння бракує історії — візьми коротший період</span>`
             : `<span class="psubdim">шкали панелей різні, тож висоти ліній між ними не порівнюють</span>`);

    const svg=wrap.querySelector("svg"),tip=wrap.querySelector("#tip"),cursor=wrap.querySelector("#cursor"),
          hit=wrap.querySelector("#hit"),d1=wrap.querySelector("#d1"),d2=wrap.querySelector("#d2");
    const idxAt=(ev)=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width*W;
      return [Math.max(0,Math.min(n-1,Math.round((px-PL)/iw*(n-1)))), r]; };
    const row=(name,color,cur,prev)=>{
      let t=`<span class="k">${name}:</span> <b class="mono" style="color:${color}">${fmtInt(cur)}</b>`;
      if(prev!=null){ const d=cur-prev;
        t+=` <span class="mono ${d>0?"up":(d<0?"down":"flat")}">${d>0?"▲":(d<0?"▼":"—")} ${prev>0?`${d>=0?"+":"−"}${Math.abs(d/prev*100).toFixed(0)}%`:fmtInt(Math.abs(d))}</span>`; }
      return t;
    };
    hit.addEventListener("mousemove",ev=>{
      const [i,r]=idxAt(ev), d=s[i], c=hasCmp?cmp[i]:null, cx=x(i);
      cursor.setAttribute("x1",cx); cursor.setAttribute("x2",cx); cursor.style.opacity=1;
      d1.setAttribute("cx",cx); d1.setAttribute("cy",y1(d.clicks)); d1.style.opacity=1;
      d2.setAttribute("cx",cx); d2.setAttribute("cy",y2(d.conv));  d2.style.opacity=1;
      tip.style.opacity=1;
      tip.style.left=Math.min(r.width-190,Math.max(0,(cx/W)*r.width+12))+"px";
      tip.style.top=Math.max(2,Math.min(r.height-110,ev.clientY-r.top-58))+"px";
      const cr=div(d.conv,d.clicks)*100;
      tip.innerHTML=`<b>${d.day}</b>${c?` <span class="k">проти ${c.day}</span>`:""}<br>`+
        row("Кліки","var(--s1)",d.clicks,c?c.clicks:null)+`<br>`+
        row("Конверсії","var(--s2)",d.conv,c?c.conv:null)+`<br>`+
        `<span class="k">CR:</span> <b class="mono">${d.clicks?fmtPct(cr):"—"}</b>`+
        (d.rev>0?`<br><span class="k">Підтв. дохід:</span> <b class="mono" style="color:var(--good-ink)">${fmtMoney(d.rev)}</b>`:"");
    });
    hit.addEventListener("mouseleave",()=>{tip.style.opacity=0;cursor.style.opacity=0;d1.style.opacity=0;d2.style.opacity=0;});
    hit.addEventListener("click",ev=>{ const [i]=idxAt(ev); state.mode="day"; state.dayIdx=i+state.fromIdx;
      syncSeg(); render(); });
  }
  // ── sites table ──────────────────────────────────────────────────────────────
  const sortState={site:{key:2,asc:false},brand:{key:1,asc:false}};
  let siteFilter="",brandFilter="";
  // Скільки рядків показуємо одразу. 150 у коробці з власним скролом ніхто не
  // гортав; тепер 25 і кнопка, а картка росте разом зі вмістом.
  const TBL_STEP=25;
  let tblCap={site:TBL_STEP,brand:TBL_STEP};
  function moreBtn(id,total,key,rerender){
    const el=document.getElementById(id); if(!el) return;
    el.innerHTML = total>tblCap[key]
      ? `<button class="morebtn" type="button">показати всі ${fmtInt(total)} ↓</button>` : "";
    const b=el.querySelector("button");
    if(b) b.onclick=()=>{ tblCap[key]=total; rerender(); };
  }
  document.getElementById("siteSearch").addEventListener("input",e=>{siteFilter=e.target.value.toLowerCase();renderSites();});
  document.getElementById("brandSearch").addEventListener("input",e=>{brandFilter=e.target.value.toLowerCase();renderBrands();});

  function renderSites(){
    const f=state.filter; let rows=[], whole=false;
    if(f.active && f.type==="brand"){
      whole=true;
      const m=relGroup(0,1,f.offerSet); // campaign -> metrics of THIS brand
      m.forEach((a,ci)=>{ const c=D.camps[ci]; rows.push({ci,name:c[1],prefix:c[2],geo:c[3],clicks:a[0],conv:a[1],leads:a[2],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100}); });
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ const c=D.camps[ci]; rows.push({ci,name:c[1],prefix:c[2],geo:c[3],clicks:a[0],conv:a[1],leads:a[2],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100}); });
    }
    if(siteFilter) rows=rows.filter(r=>r.name.toLowerCase().includes(siteFilter)||r.geo.toLowerCase().includes(siteFilter));
    const cols=["name","geo","clicks","conv","cr","sales","rev","confRev"], head=["Сайт","Гео","Кліки","Конв","CR","Прод","Дохід","Підтв."];
    const sk=cols[sortState.site.key];
    rows.sort((a,b)=> sortState.site.asc?cmp(a[sk],b[sk]):cmp(b[sk],a[sk]));
    const total=rows.length, shown=rows.slice(0,tblCap.site), maxC=Math.max(1,...shown.map(r=>r.clicks));
    document.getElementById("siteSub").textContent=`${fmtInt(total)} ${plural(total,["сайт","сайти","сайтів"])}${total>shown.length?` · показано ${shown.length}`:""}`;
    document.getElementById("siteTag").innerHTML= whole?`<span class="tag-all">за весь період</span>`:"";
    document.getElementById("siteTbl").innerHTML=
      `<thead><tr>${head.map((h,i)=>`<th data-i="${i}" class="${sortState.site.key===i?'sorted '+(sortState.site.asc?'asc':''):''}">${h}</th>`).join("")}</tr></thead>`+
      `<tbody>${shown.length?shown.map(r=>`<tr data-name="${esc(r.name)}">
        <td><span class="site">${esc(r.name)}</span> ${r.prefix!=="—"?`<span class="chip">${r.prefix}</span>`:""}${(state.team<0&&nTeams>1)?teamChip(campTeam[r.ci]):""}</td>
        <td>${r.geo!=="—"?`<span class="chip geo">${r.geo}</span>`:'<span class="zero">—</span>'}</td>
        <td class="bar-cell mono"><span class="bar" style="width:${r.clicks/maxC*100}%"></span><span>${fmtInt(r.clicks)}</span></td>
        <td class="mono ${r.conv>0?'conv-badge':'zero'}">${r.conv||"0"}</td>
        <td class="mono">${r.conv>0?fmtPct(r.cr):'<span class="zero">—</span>'}</td>
        <td class="mono ${r.sales?'':'zero'}">${r.sales||"0"}</td>
        <td class="mono ${r.rev>0?'':'zero'}">${r.rev>0?fmtMoney(r.rev):"—"}</td>
        <td class="mono ${r.confRev>0?'up':'zero'}">${r.confRev>0?fmtMoney(r.confRev):"—"}</td></tr>`).join(""):`<tr class="nolink"><td colspan="8" class="emptycell">Нічого не знайдено.</td></tr>`}</tbody>`;
    const tbl=document.getElementById("siteTbl");
    tbl.querySelectorAll("th").forEach(th=>th.onclick=()=>{const i=+th.dataset.i; if(sortState.site.key===i)sortState.site.asc=!sortState.site.asc;else{sortState.site.key=i;sortState.site.asc=false;}renderSites();});
    tbl.querySelectorAll("tbody tr[data-name]").forEach(tr=>tr.onclick=()=>setFilter("site",tr.dataset.name));
    moreBtn("siteMore",total,"site",renderSites);
  }

  // ── brands table ───────────────────────────────────────────────────────────────
  function renderBrands(){
    const f=state.filter; let rows=[], whole=false;
    if(f.active && f.type==="site"){
      whole=true;
      const m=relGroup(1,0,f.campSet); // offer -> metrics within THESE sites
      m.forEach((a,oi)=>{ rows.push({oi,name:D.offers[oi],clicks:a[0],conv:a[1],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100}); });
    }else{
      const m=aggOffers(state.fromIdx,state.toIdx,f.active?f.offerSet:null);
      m.forEach((a,oi)=>{ rows.push({oi,name:D.offers[oi],clicks:a[0],conv:a[1],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100}); });
    }
    if(brandFilter) rows=rows.filter(r=>r.name.toLowerCase().includes(brandFilter));
    const cols=["name","clicks","conv","cr","sales","rev","confRev"], head=["Бренд","Кліки","Конв","CR","Прод","Дохід","Підтв."];
    const sk=cols[sortState.brand.key];
    rows.sort((a,b)=> sortState.brand.asc?cmp(a[sk],b[sk]):cmp(b[sk],a[sk]));
    const total=rows.length, shown=rows.slice(0,tblCap.brand), maxC=Math.max(1,...shown.map(r=>r.clicks));
    document.getElementById("brandSub").textContent=`${fmtInt(total)} ${plural(total,["бренд","бренди","брендів"])}${total>shown.length?` · показано ${shown.length}`:""}`;
    document.getElementById("brandTag").innerHTML= whole?`<span class="tag-all">за весь період</span>`:"";
    document.getElementById("brandTbl").innerHTML=
      `<thead><tr>${head.map((h,i)=>`<th data-i="${i}" class="${sortState.brand.key===i?'sorted '+(sortState.brand.asc?'asc':''):''}">${h}</th>`).join("")}</tr></thead>`+
      `<tbody>${shown.length?shown.map(r=>`<tr data-name="${esc(r.name)}">
        <td><span class="site">${esc(r.name)}</span></td>
        <td class="bar-cell mono"><span class="bar" style="width:${r.clicks/maxC*100}%"></span><span>${fmtInt(r.clicks)}</span></td>
        <td class="mono ${r.conv>0?'conv-badge':'zero'}">${r.conv||"0"}</td>
        <td class="mono">${r.conv>0?fmtPct(r.cr):'<span class="zero">—</span>'}</td>
        <td class="mono ${r.sales?'':'zero'}">${r.sales||"0"}</td>
        <td class="mono ${r.rev>0?'':'zero'}">${r.rev>0?fmtMoney(r.rev):"—"}</td>
        <td class="mono ${r.confRev>0?'up':'zero'}">${r.confRev>0?fmtMoney(r.confRev):"—"}</td></tr>`).join(""):`<tr class="nolink"><td colspan="7" class="emptycell">Нічого не знайдено.</td></tr>`}</tbody>`;
    const tbl=document.getElementById("brandTbl");
    tbl.querySelectorAll("th").forEach(th=>th.onclick=()=>{const i=+th.dataset.i; if(sortState.brand.key===i)sortState.brand.asc=!sortState.brand.asc;else{sortState.brand.key=i;sortState.brand.asc=false;}renderBrands();});
    tbl.querySelectorAll("tbody tr[data-name]").forEach(tr=>tr.onclick=()=>setFilter("brand",tr.dataset.name));
    moreBtn("brandMore",total,"brand",renderBrands);
  }

  // ── positions & pages (rel, whole history) ────────────────────────────────────
  function entityForRel(){ // returns [entityCol, set] based on filter
    const f=state.filter;
    if(f.active && f.type==="brand") return [1,f.offerSet];
    if(f.active && f.type==="site") return [0,f.campSet];
    return [null,null];
  }
  const noteHTML = n => `<div style="font-size:11px;color:var(--faint);margin-top:8px">без мітки (sub_id): <span class="mono">${fmtInt(n)}</span> кліків</div>`;
  const distHead = (a,b)=>`<div class="dist-head"><span>${a}</span><span>${b}</span></div>`;

  function renderPosPages(){
    const [col,set]=entityForRel();
    const scope = state.filter.active ? (state.filter.type==="brand"?`бренд “${esc(state.filter.q)}”`:`сайт “${esc(state.filter.q)}”`) : "усі сайти/бренди";

    // ── Сторінки (sub_id_3) — клікабельний список ──
    const gm=relGroup(3,col,set);
    let pgAll=[...gm].map(([gi,a])=>({gi,label:D.pages[gi],v:a[0],conv:a[1]}));
    const pgEmpty=pgAll.filter(p=>p.label==="").reduce((s,p)=>s+p.v,0);
    let pg=pgAll.filter(p=>p.label!==""&&p.v>0).sort((a,b)=>b.v-a.v).slice(0,18);
    const maxG=Math.max(1,...pg.map(p=>p.v));
    document.getElementById("pageSub").textContent=`Сторінки для: ${scope}`;
    document.getElementById("pageDist").innerHTML = distHead("Сторінка","Кліки · Конв") +
      (pg.length? pg.map(p=>`<div class="row drow ${state.selectedPage===p.gi?'sel':''}" data-page="${p.gi}">
          <div class="name" title="${esc(p.label)}">${esc(p.label)}</div>
          <div class="track"><div class="fill" style="width:${p.v/maxG*100}%"></div></div>
          <div class="v mono">${fmtInt(p.v)}${p.conv?` · <span style="color:var(--s2)">${p.conv}</span>`:""}</div></div>`).join("") : emptyDist())
      + (pgEmpty>0?noteHTML(pgEmpty):"");
    document.getElementById("pageDist").querySelectorAll("[data-page]").forEach(el=>el.onclick=()=>{
      const gi=+el.dataset.page; state.selectedPage=(state.selectedPage===gi?null:gi); renderPosPages();
    });

    // ── Позиції × бренди — таблиця (scope: фільтр + вибрана сторінка) ──
    const sp=state.selectedPage;
    const posTitle=document.getElementById("posTitle"), posSub=document.getElementById("posSub");
    if(sp!=null){
      posTitle.innerHTML=`Позиції × бренди · <span style="color:var(--s4)">${esc(D.pages[sp]||"(без сторінки)")}</span> <span id="clrPage" title="скинути сторінку" style="cursor:pointer;color:var(--dim);font-weight:500">✕</span>`;
      posSub.textContent="Які бренди й на яких позиціях стояли на цій сторінці";
    } else {
      posTitle.textContent="Позиції × бренди";
      posSub.textContent=`Який бренд на якій позиції · ${scope}`;
    }
    const m=new Map();
    for(const r of D.rel){
      if(set && !set.has(r[col])) continue;
      if(!teamOK(campTeam[r[0]])) continue;
      if(sp!=null && r[3]!==sp) continue;
      const key=r[2]+"|"+r[1];
      let a=m.get(key); if(!a){a={pos:D.positions[r[2]],offer:D.offers[r[1]],clicks:0,conv:0};m.set(key,a);}
      a.clicks+=r[4]; a.conv+=r[5];
    }
    let rows=[...m.values()].filter(r=>r.clicks>0);
    rows.sort((a,b)=>{ const ea=a.pos==="",eb=b.pos===""; if(ea!==eb)return ea?1:-1; const na=+a.pos,nb=+b.pos; if(!isNaN(na)&&!isNaN(nb)&&na!==nb)return na-nb; return b.clicks-a.clicks; });
    rows=rows.slice(0,80);
    const maxc=Math.max(1,...rows.map(r=>r.clicks));
    document.getElementById("posTbl").innerHTML =
      `<thead><tr><th>Поз.</th><th>Бренд</th><th>Кліки</th><th>Конв</th></tr></thead>`+
      `<tbody>${rows.length? rows.map(r=>`<tr data-name="${esc(r.offer)}">
         <td class="mono" style="font-weight:700;color:var(--s4)">${r.pos===""?"—":esc(r.pos)}</td>
         <td><span class="site">${esc(r.offer)}</span></td>
         <td class="bar-cell mono"><span class="bar" style="width:${r.clicks/maxc*100}%"></span><span>${fmtInt(r.clicks)}</span></td>
         <td class="mono ${r.conv>0?'conv-badge':'zero'}">${r.conv||"0"}</td></tr>`).join("") : `<tr class="nolink"><td colspan="4" class="emptycell">Немає позицій із мітками для цього зрізу.</td></tr>`}</tbody>`;
    document.getElementById("posTbl").querySelectorAll("tbody tr[data-name]").forEach(tr=>tr.onclick=()=>setFilter("brand",tr.dataset.name));
    if(sp!=null){ const c=document.getElementById("clrPage"); if(c) c.onclick=e=>{ e.stopPropagation(); state.selectedPage=null; renderPosPages(); }; }
  }
  function distHTML(items,colorFn){
    const max=Math.max(1,...items.map(i=>i.v));
    return items.map(i=>`<div class="row"><div class="name" title="${esc(i.label||i.name)}">${esc(i.label||i.name)}</div>
      <div class="track"><div class="fill" style="width:${i.v/max*100}%;${colorFn?'background:'+colorFn(i):''}"></div></div>
      <div class="v mono">${fmtInt(i.v)}${i.conv?` · <span style="color:var(--s2)">${i.conv}</span>`:""}</div></div>`).join("");
  }
  const emptyDist=()=>'<div style="color:var(--faint);font-size:12px">немає даних</div>';

  // ── converting sites ────────────────────────────────────────────────────────────
  function renderConv(){
    const f=state.filter; let rows=[];
    if(f.active && f.type==="brand"){
      const m=relGroup(0,1,f.offerSet);
      m.forEach((a,ci)=>{ if(a[1]>0){const c=D.camps[ci]; rows.push({name:c[1],geo:c[3],clicks:a[0],conv:a[1],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100});} });
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ if(a[1]>0){const c=D.camps[ci]; rows.push({name:c[1],geo:c[3],clicks:a[0],conv:a[1],sales:a[3],rev:a[4],confRev:a[5],cr:div(a[1],a[0])*100});} });
    }
    rows.sort((a,b)=>b.conv-a.conv||b.confRev-a.confRev);
    const el=document.getElementById("convTbl");
    if(!rows.length){ el.innerHTML=`<tbody><tr class="nolink"><td class="emptycell">За вибраний період/фільтр конверсій немає.</td></tr></tbody>`; return; }
    el.innerHTML=`<thead><tr><th>Сайт</th><th>Гео</th><th>Конв</th><th>Прод</th><th>CR</th><th>Кліки</th><th>Дохід✓</th></tr></thead>
      <tbody>${rows.slice(0,80).map(r=>`<tr data-name="${esc(r.name)}">
        <td><span class="site">${esc(r.name)}</span></td>
        <td>${r.geo!=="—"?`<span class="chip geo">${r.geo}</span>`:'<span class="zero">—</span>'}</td>
        <td class="mono conv-badge">${r.conv}</td><td class="mono ${r.sales?'':'zero'}">${r.sales||"0"}</td>
        <td class="mono">${fmtPct(r.cr)}</td><td class="mono">${fmtInt(r.clicks)}</td>
        <td class="mono ${r.confRev>0?'up':'zero'}">${r.confRev>0?fmtMoney(r.confRev):"—"}</td></tr>`).join("")}</tbody>`;
    el.querySelectorAll("tbody tr[data-name]").forEach(tr=>tr.onclick=()=>setFilter("site",tr.dataset.name));
  }

  // ── geo / prefix / os ─────────────────────────────────────────────────────────
  function renderGeo(){
    const f=state.filter; const byGeo=new Map();
    if(f.active && f.type==="brand"){
      const m=relGroup(0,1,f.offerSet); // campaign -> brand metrics
      m.forEach((a,ci)=>{ const g=D.camps[ci][3]; const c=byGeo.get(g)||[0,0]; c[0]+=a[0];c[1]+=a[1];byGeo.set(g,c); });
      document.getElementById("geoSub").textContent="по сайтах бренду · весь період";
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ const g=D.camps[ci][3]; const c=byGeo.get(g)||[0,0]; c[0]+=a[0];c[1]+=a[1];byGeo.set(g,c); });
      document.getElementById("geoSub").textContent="розподіл кліків по країнах";
    }
    let items=[...byGeo].filter(([g])=>g!=="—").map(([g,v])=>({label:g,v:v[0],conv:v[1]})).sort((a,b)=>b.v-a.v).slice(0,10);
    document.getElementById("geoDist").innerHTML= distHead("Країна","Кліки · Конв")+(items.length?distHTML(items):emptyDist());
  }
  function renderPrefOs(){
    const f=state.filter; const byP=new Map();
    if(f.active && f.type==="brand"){
      const m=relGroup(0,1,f.offerSet);
      m.forEach((a,ci)=>{ const p=D.camps[ci][2]; const c=byP.get(p)||[0,0]; c[0]+=a[0];c[1]+=a[1];byP.set(p,c); });
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ const p=D.camps[ci][2]; const c=byP.get(p)||[0,0]; c[0]+=a[0];c[1]+=a[1];byP.set(p,c); });
    }
    let items=[...byP].filter(([p])=>p!=="—").map(([p,v])=>({label:p,v:v[0],conv:v[1]})).sort((a,b)=>b.v-a.v);
    const maxP=Math.max(1,...items.map(i=>i.v));
    const prefEl=document.getElementById("prefDist");
    prefEl.innerHTML=`<div class="sublabel">Мережі (префікс) · ${items.length}</div>`+distHead("Мережа","Кліки · Конв")+
      (items.length? items.map(i=>`<div class="row drow" data-prefix="${esc(i.label)}">
          <div class="name" title="${esc(i.label)}">${esc(i.label)}</div>
          <div class="track"><div class="fill" style="width:${i.v/maxP*100}%;background:var(--s4)"></div></div>
          <div class="v mono">${fmtInt(i.v)}${i.conv?` · <span style="color:var(--s2)">${i.conv}</span>`:""}</div></div>`).join("") : emptyDist());
    prefEl.querySelectorAll("[data-prefix]").forEach(el=>el.onclick=()=>setFilter("site",el.dataset.prefix,"partial"));
    // ОС — по командах (весь період). При активному фільтрі сутності не розкладається.
    const osEl=document.getElementById("osDist");
    if(f.active){ osEl.innerHTML=`<div class="sublabel">ОС</div><div style="color:var(--faint);font-size:12px">ОС доступна лише без фільтра сайту/бренду</div>`; return; }
    let osArr;
    if(state.team<0){ const mm=new Map(); (D.os||[]).forEach(arr=>arr.forEach(o=>{ const c=mm.get(o[0])||[0,0]; c[0]+=o[1];c[1]+=o[2]; mm.set(o[0],c); }));
      osArr=[...mm].map(([k,v])=>({label:k,v:v[0],conv:v[1]})).sort((a,b)=>b.v-a.v); }
    else { osArr=((D.os&&D.os[state.team])||[]).map(o=>({label:o[0],v:o[1],conv:o[2]})); }
    osArr=osArr.slice(0,6);
    osEl.innerHTML=`<div class="sublabel">ОС · ${state.team<0?"усі команди":esc(D.teams[state.team])}</div>`+distHead("ОС","Кліки · Конв")+(osArr.length?distHTML(osArr,()=>"var(--s3)"):emptyDist());
  }

  // ── render all ────────────────────────────────────────────────────────────────
  // ── динаміка: порівняння двох сусідніх вікон ───────────────────────────────
  // Усе нижче рахується з того, що вже є в DATA (od — день×бренд×команда),
  // тож нових запитів до Keitaro не треба.
  let MV = null;              // кеш на один рендер: {w, rows, byTeam}
  let mvMetric = 0;           // 0 кліки · 1 конверсії · 5 підтверджений дохід

  // Вікно «до» — рівно такої ж довжини і впритул перед вибраним періодом.
  // Для «весь період» попереднього вікна не існує, тож беремо 7 проти 7
  // останніх днів і чесно пишемо про це в підзаголовку.
  function cmpWindows(){
    const len=state.toIdx-state.fromIdx+1, pTo=state.fromIdx-1;
    const dm=d=>d.slice(8,10)+"."+d.slice(5,7);
    const lbl=(a,b)=> a===b ? dm(D.days[a]) : dm(D.days[a])+"–"+dm(D.days[b]);
    if(pTo>=0){
      const pFrom=Math.max(0,pTo-len+1);
      return {cur:[state.fromIdx,state.toIdx],prev:[pFrom,pTo],
        label:`${lbl(state.fromIdx,state.toIdx)} проти ${lbl(pFrom,pTo)}`};
    }
    // вибрано найперший день історії — порівнювати нема з чим, і підміняти
    // його «останніми 7 днями» було б брехнею
    if(state.mode==="day") return null;
    const L=Math.min(7,Math.floor(N/2));
    if(L<1) return null;
    return {cur:[N-L,N-1],prev:[N-2*L,N-L-1],fallback:true,
      label:`останні ${L} дн (${lbl(N-L,N-1)}) проти попередніх ${L} (${lbl(N-2*L,N-L-1)})`};
  }

  const plural=(n,a)=>{const m=Math.abs(n)%100,k=Math.abs(n)%10;return a[(m>=11&&m<=14)?2:(k===1?0:(k>=2&&k<=4?1:2))];};
  function dHTML(d,p,money){
    const pct = p>0 ? d/p*100 : (d>0?100:0);
    const cls = d>0?"up":(d<0?"down":"flat"), arr = d>0?"▲":(d<0?"▼":"—");
    const v = money?fmtMoney(Math.abs(d)):fmtInt(Math.abs(d));
    const sign = d>0?"+":(d<0?"−":"");
    return `<span class="dchip ${cls}">${arr} ${sign}${v}${p>0?` <span style="color:var(--faint);font-weight:600">(${pct>=0?"+":"−"}${Math.abs(pct).toFixed(0)}%)</span>`:""}</span>`;
  }

  function sparkSVG(vals,color){
    const w=140,h=30; if(!vals.length) return "";
    const max=Math.max(1,...vals);
    if(vals.length===1) return `<svg class="spark" viewBox="0 0 ${w} ${h}"><circle cx="${w/2}" cy="${h/2}" r="3" fill="${color}"/></svg>`;
    const step=w/(vals.length-1);
    const pts=vals.map((v,i)=>[i*step,h-2-(v/max)*(h-5)]);
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="${color}" opacity=".12"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  }

  // по днях для КОЖНОЇ команди за один прохід, з урахуванням активного фільтра
  function teamSeriesAll(){
    const f=state.filter;
    const per=Array.from({length:nTeams},()=>Array.from({length:N},()=>[0,0,0,0,0,0]));
    const put=(t,di,r,o)=>{ const d=per[t][di]; for(let j=0;j<6;j++) d[j]+=r[o+j]; };
    if(f.active && f.type==="brand"){
      for(const r of D.od){ if(!f.offerSet.has(r[1])) continue; put(r[8],r[0],r,2); }
    }else if(f.active && f.type==="site"){
      for(const r of D.cd){ if(!f.campSet.has(r[1])) continue; put(campTeam[r[1]],r[0],r,2); }
    }else{
      for(let t=0;t<nTeams;t++){ const tt=D.totals[t]; if(!tt) continue;
        for(let i=0;i<N;i++) for(let j=0;j<6;j++) per[t][i][j]+=tt[i][j]; }
    }
    return per;
  }

  // бренди (а коли вибрано «всі команди» — пари бренд×команда) у двох вікнах
  function moversData(){
    const w=cmpWindows(); if(!w) return null;
    const byTeam = state.team<0 && nTeams>1;
    const f=state.filter;
    const pick=(from,to)=>{
      const m=new Map();
      for(const r of D.od){
        const di=r[0]; if(di<from||di>to) continue;
        if(!teamOK(r[8])) continue;
        if(f.active && f.offerSet && !f.offerSet.has(r[1])) continue;
        const k = byTeam ? r[1]+"|"+r[8] : String(r[1]);
        let a=m.get(k); if(!a){a=[0,0,0,0,0,0];m.set(k,a);}
