  function renderPrefOs(){
    const f=state.filter; const byP=new Map();
    if(f.active && f.type==="brand"){
      const m=relGroup(0,1,f.offerSet);
      m.forEach((a,ci)=>{ const p=D.camps[ci][2]; const c=byP.get(p)||[0,0]; c[0]+=a[0];c[1]+=a[1];byP.set(p,c); });
    }else{
      const m=aggCampaigns(state.fromIdx,state.toIdx,f.active?f.campSet:null);
      m.forEach((a,ci)=>{ const p=D.camps[ci][2]; const c=byP.get(p)||[0,0]; c[0]+=a[0];c[1]+=a[1];byP.set(p,c); });
    }
    let items=[...byP].filter(([p])=>p!=="—").map(([p,v])=>({label:p,v:v[0],conv:v[1]})).sort((a,b)=>b.v-a.v);
    const maxP=Math.max(1,...items.map(i=>i.v));
    const prefEl=document.getElementById("prefDist");
    prefEl.innerHTML=`<div class="sublabel">Мережі (префікс) · ${items.length}</div>`+distHead("Мережа","Кліки · Конв")+
      (items.length? items.map(i=>`<div class="row drow" data-prefix="${esc(i.label)}">
          <div class="name" title="${esc(i.label)}">${esc(i.label)}</div>
          <div class="track"><div class="fill" style="width:${i.v/maxP*100}%;background:linear-gradient(90deg,var(--purple),var(--blue))"></div></div>
          <div class="v mono">${fmtInt(i.v)}${i.conv?` · <span style="color:var(--s2)">${i.conv}</span>`:""}</div></div>`).join("") : emptyDist());
    prefEl.querySelectorAll("[data-prefix]").forEach(el=>el.onclick=()=>setFilter("site",el.dataset.prefix,"partial"));
    // ОС — по командах (весь період). При активному фільтрі сутності не розкладається.
    const osEl=document.getElementById("osDist");
    if(f.active){ osEl.innerHTML=`<div class="sublabel">ОС</div><div style="color:var(--faint);font-size:12px">ОС доступна лише без фільтра сайту/бренду</div>`; return; }
    let osArr;
    if(state.team<0){ const mm=new Map(); (D.os||[]).forEach(arr=>arr.forEach(o=>{ const c=mm.get(o[0])||[0,0]; c[0]+=o[1];c[1]+=o[2]; mm.set(o[0],c); }));
      osArr=[...mm].map(([k,v])=>({label:k,v:v[0],conv:v[1]})).sort((a,b)=>b.v-a.v); }
    else { osArr=((D.os&&D.os[state.team])||[]).map(o=>({label:o[0],v:o[1],conv:o[2]})); }
    osArr=osArr.slice(0,6);
    osEl.innerHTML=`<div class="sublabel">ОС · ${state.team<0?"усі команди":esc(D.teams[state.team])}</div>`+distHead("ОС","Кліки · Конв")+(osArr.length?distHTML(osArr,()=>"linear-gradient(90deg,var(--green),var(--cyan))"):emptyDist());
  }

  // ── render all ────────────────────────────────────────────────────────────────
  // ── динаміка: порівняння двох сусідніх вікон ───────────────────────────────
  // Усе нижче рахується з того, що вже є в DATA (od — день×бренд×команда),
  // тож нових запитів до Keitaro не треба.
  let MV = null;              // кеш на один рендер: {w, rows, byTeam}
  let mvMetric = 0;           // 0 кліки · 1 конверсії · 5 підтверджений дохід

  // Вікно «до» — рівно такої ж довжини і впритул перед вибраним періодом.
  // Для «весь період» попереднього вікна не існує, тож беремо 7 проти 7
  // останніх днів і чесно пишемо про це в підзаголовку.
  function cmpWindows(){
    const len=state.toIdx-state.fromIdx+1, pTo=state.fromIdx-1;
    const dm=d=>d.slice(8,10)+"."+d.slice(5,7);
    const lbl=(a,b)=> a===b ? dm(D.days[a]) : dm(D.days[a])+"–"+dm(D.days[b]);
    if(pTo>=0){
      const pFrom=Math.max(0,pTo-len+1);
      return {cur:[state.fromIdx,state.toIdx],prev:[pFrom,pTo],
        label:`${lbl(state.fromIdx,state.toIdx)} проти ${lbl(pFrom,pTo)}`};
    }
    // вибрано найперший день історії — порівнювати нема з чим, і підміняти
    // його «останніми 7 днями» було б брехнею
    if(state.mode==="day") return null;
    const L=Math.min(7,Math.floor(N/2));
    if(L<1) return null;
    return {cur:[N-L,N-1],prev:[N-2*L,N-L-1],fallback:true,
      label:`останні ${L} дн (${lbl(N-L,N-1)}) проти попередніх ${L} (${lbl(N-2*L,N-L-1)})`};
  }

  const plural=(n,a)=>{const m=Math.abs(n)%100,k=Math.abs(n)%10;return a[(m>=11&&m<=14)?2:(k===1?0:(k>=2&&k<=4?1:2))];};
  function dHTML(d,p,money){
    const pct = p>0 ? d/p*100 : (d>0?100:0);
    const cls = d>0?"up":(d<0?"down":"flat"), arr = d>0?"▲":(d<0?"▼":"—");
    const v = money?fmtMoney(Math.abs(d)):fmtInt(Math.abs(d));
    const sign = d>0?"+":(d<0?"−":"");
    return `<span class="dchip ${cls}">${arr} ${sign}${v}${p>0?` <span style="color:var(--faint);font-weight:600">(${pct>=0?"+":"−"}${Math.abs(pct).toFixed(0)}%)</span>`:""}</span>`;
  }

  function sparkSVG(vals,color){
    const w=140,h=30; if(!vals.length) return "";
    const max=Math.max(1,...vals);
    if(vals.length===1) return `<svg class="spark" viewBox="0 0 ${w} ${h}"><circle cx="${w/2}" cy="${h/2}" r="3" fill="${color}"/></svg>`;
    const step=w/(vals.length-1);
    const pts=vals.map((v,i)=>[i*step,h-2-(v/max)*(h-5)]);
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="${color}" opacity=".12"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  }

  // по днях для КОЖНОЇ команди за один прохід, з урахуванням активного фільтра
  function teamSeriesAll(){
    const f=state.filter;
    const per=Array.from({length:nTeams},()=>Array.from({length:N},()=>[0,0,0,0,0,0]));
    const put=(t,di,r,o)=>{ const d=per[t][di]; for(let j=0;j<6;j++) d[j]+=r[o+j]; };
    if(f.active && f.type==="brand"){
      for(const r of D.od){ if(!f.offerSet.has(r[1])) continue; put(r[8],r[0],r,2); }
    }else if(f.active && f.type==="site"){
      for(const r of D.cd){ if(!f.campSet.has(r[1])) continue; put(campTeam[r[1]],r[0],r,2); }
    }else{
      for(let t=0;t<nTeams;t++){ const tt=D.totals[t]; if(!tt) continue;
        for(let i=0;i<N;i++) for(let j=0;j<6;j++) per[t][i][j]+=tt[i][j]; }
    }
    return per;
  }

  // бренди (а коли вибрано «всі команди» — пари бренд×команда) у двох вікнах
  function moversData(){
    const w=cmpWindows(); if(!w) return null;
    const byTeam = state.team<0 && nTeams>1;
    const f=state.filter;
    const pick=(from,to)=>{
      const m=new Map();
      for(const r of D.od){
        const di=r[0]; if(di<from||di>to) continue;
        if(!teamOK(r[8])) continue;
        if(f.active && f.offerSet && !f.offerSet.has(r[1])) continue;
        const k = byTeam ? r[1]+"|"+r[8] : String(r[1]);
        let a=m.get(k); if(!a){a=[0,0,0,0,0,0];m.set(k,a);}
        a[0]+=r[2];a[1]+=r[3];a[2]+=r[4];a[3]+=r[5];a[4]+=r[6];a[5]+=r[7];
      }
      return m;
    };
    const cur=pick(w.cur[0],w.cur[1]), prev=pick(w.prev[0],w.prev[1]);
    const rows=[];
    for(const k of new Set([...cur.keys(),...prev.keys()])){
      const c=cur.get(k)||[0,0,0,0,0,0], p=prev.get(k)||[0,0,0,0,0,0];
      const parts=k.split("|");
      rows.push({oi:+parts[0], ti: parts.length>1?+parts[1]:(state.team<0?null:state.team), c, p});
    }
    return {w,rows,byTeam};
  }

  // ── команди: список з однією базою, а не шість окремих карток ──────────────
  // Картки доводилось порівнювати очима «на око»; смуги від спільної лівої межі
  // порівнюються точно. Колір закріплений за командою, не за місцем у рейтингу.
  function renderTeamCards(){
    const box=document.getElementById("tcards");
    const wrapEl=document.getElementById("teamBlock");
    if(nTeams<2){ if(wrapEl) wrapEl.style.display="none"; return; }
    const per=teamSeriesAll(), w=MV&&MV.w;
    const sFrom=(state.toIdx-state.fromIdx)>=2?state.fromIdx:Math.max(0,N-14);
    const sTo  =(state.toIdx-state.fromIdx)>=2?state.toIdx:N-1;
    const sum=(a,f,t)=>{const s=[0,0,0,0,0,0];for(let i=f;i<=t;i++)for(let j=0;j<6;j++)s[j]+=a[i][j];return s;};

    const rows=[];
    for(let t=0;t<nTeams;t++){
      const cur=sum(per[t],state.fromIdx,state.toIdx);
      const cw=w?sum(per[t],w.cur[0],w.cur[1]):cur, pw=w?sum(per[t],w.prev[0],w.prev[1]):null;
      const vals=[]; for(let i=sFrom;i<=sTo;i++) vals.push(per[t][i][0]);
      rows.push({t,cur,d:pw?cw[0]-pw[0]:0,p:pw?pw[0]:0,has:!!pw,vals});
    }
    const max=Math.max(1,...rows.map(r=>r.cur[0]));
    rows.sort((a,b)=>b.cur[0]-a.cur[0]);
    const tot=rows.reduce((s,r)=>s+r.cur[0],0);

    document.getElementById("tmSub").textContent =
      `${rangeLabel()} · ${fmtInt(tot)} кліків усього${w?` · зміна — ${w.fallback?"за останні 7 днів":"до попереднього періоду"}`:""}`;
    document.getElementById("tmHead").innerHTML =
      ["Команда","Обсяг кліків","Кліки","Зміна","Конверсії","CR","Підтв. дохід","Динаміка"].map(h=>`<span>${h}</span>`).join("");
    box.innerHTML=rows.map(r=>{
      const cr=div(r.cur[1],r.cur[0])*100;
      const k=r.d>0?"up":(r.d<0?"down":"flat"), ic=r.d>0?"▲":(r.d<0?"▼":"—");
      const pct=r.p>0?r.d/r.p*100:(r.d>0?100:0);
      return `<div class="trow ${state.team===r.t?"on":""}" data-tm="${r.t}" tabindex="0" role="button" data-key="1"
        aria-label="${esc(D.teams[r.t]||"")}: ${fmtInt(r.cur[0])} кліків" style="--hue:${teamHue(r.t)}">
        <span class="tname"><i class="tdot"></i>${esc(D.teams[r.t]||"")}</span>
        <span class="tbar" title="${(r.cur[0]/Math.max(1,tot)*100).toFixed(1)}% усього трафіку · смуга — відносно найбільшої команди"><i style="width:${(r.cur[0]/max*100).toFixed(1)}%"></i></span>
        <span class="tnum">${fmtInt(r.cur[0])}</span>
        <span class="tnum ${k}">${r.has?`${ic} ${pct>=0?"+":"−"}${Math.abs(pct).toFixed(0)}%`:"<span class='zero'>—</span>"}</span>
        <span class="tnum">${fmtInt(r.cur[1])}</span>
        <span class="tnum tcr">${r.cur[1]?fmtPct(cr):"<span class='zero'>—</span>"}</span>
        <span class="tnum trev">${r.cur[5]>0?fmtMoney(r.cur[5]):"<span class='zero'>—</span>"}</span>
        <span class="tsp">${sparkSVG(r.vals,teamHue(r.t))}</span></div>`;
    }).join("");
    box.querySelectorAll(".trow").forEach(el=>el.onclick=()=>{
      const t=+el.dataset.tm; selectTeam(state.team===t?-1:t);
    });
  }

  // ── рух брендів ────────────────────────────────────────────────────────────
  // Два стовпці чисел не давали відчуття масштабу: не видно було, що перший
  // рядок утричі важчий за п'ятий. Тепер один список із розхідними смугами від
  // спільної нульової лінії — вправо зростання, вліво просідання.
  let mvCap=8;
  function renderMovers(){
    const box=document.getElementById("mv"), sub=document.getElementById("mvSub");
    const head=document.getElementById("dvHead"), net=document.getElementById("mvNet");
    const foot=document.getElementById("mvFoot"), more=document.getElementById("mvMore");
    if(!MV){ box.innerHTML=`<div class="mvempty">Замало історії, щоб порівняти два періоди.</div>`;
      sub.textContent=""; head.innerHTML=""; net.innerHTML=""; foot.textContent=""; more.innerHTML="";
      renderNoConv(null); return; }

    const m=mvMetric, money=m===5;
    const val=v=> money?fmtMoney(v):fmtInt(v);
    const totalCur=MV.rows.reduce((s,r)=>s+r.c[m],0);
    const floor=Math.max(money?20:(m===1?3:30), totalCur*0.001);
    const sig=MV.rows.filter(r=>Math.max(r.c[m],r.p[m])>=floor).map(r=>({r,d:r.c[m]-r.p[m]}));
    const up=sig.filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
    const dn=sig.filter(x=>x.d<0).sort((a,b)=>a.d-b.d);
    const su=up.slice(0,mvCap), sd=dn.slice(0,mvCap);
    const maxAbs=Math.max(1,...[...su,...sd].map(x=>Math.abs(x.d)));

    // Чистий підсумок одним рядком: ростемо ми взагалі чи ні.
    const gain=up.reduce((s,x)=>s+x.d,0), loss=dn.reduce((s,x)=>s+x.d,0), netD=gain+loss;
    const mName=m===0?"кліків":(m===1?"конверсій":"доходу");
    net.innerHTML=`<span class="npart"><b class="up">▲ ${val(gain)}</b><i>додали ${up.length} ${plural(up.length,["бренд","бренди","брендів"])}</i></span>`+
      `<span class="npart"><b class="down">▼ ${val(Math.abs(loss))}</b><i>втратили ${dn.length}</i></span>`+
      `<span class="npart nres ${netD>0?"up":(netD<0?"down":"flat")}">підсумок ${netD>=0?"+":"−"}${val(Math.abs(netD))} ${mName}</span>`;

    sub.textContent=`${MV.w.label} · за зміною ${m===0?"кліків":(m===1?"конверсій":"підтвердженого доходу")}${MV.byTeam?" · окремо по кожній команді":""}`;
    head.innerHTML=`<span>Бренд</span><span class="dvaxis"><i>← просідання</i><i>зростання →</i></span><span>Зміна</span><span class="dvpct">%</span><span class="dvflow">було → стало</span>`;

    const badges=(r)=>{
      const b=[];
      if(r.p[0]===0&&r.c[0]>0) b.push(`<span class="badge new">новий</span>`);
      if(r.c[0]===0&&r.p[0]>0) b.push(`<span class="badge dead">зник</span>`);
      const crC=div(r.c[1],r.c[0]), crP=div(r.p[1],r.p[0]);
      if(r.c[0]>=50&&r.p[0]>=50&&crP>0&&r.c[1]>0){
        if(crC>=crP*1.4) b.push(`<span class="badge new">CR ▲</span>`);
        else if(crC<=crP*0.6) b.push(`<span class="badge dead">CR ▼</span>`);
      }
      return b.length?` ${b.join(" ")}`:"";
    };
    const row=(x)=>{
      const r=x.r, pos=x.d>0, w=Math.abs(x.d)/maxAbs*50;
      const pct=r.p[m]>0?x.d/r.p[m]*100:(x.d>0?null:0);
      return `<div class="dvrow" tabindex="0" role="button" data-key="1" data-oi="${r.oi}" data-ti="${r.ti==null?"":r.ti}">
        <span class="dvname">${esc(D.offers[r.oi]||"(без офера)")}${MV.byTeam&&r.ti!=null?" "+teamChip(r.ti):""}${badges(r)}</span>
        <span class="dvbar"><i class="${pos?"pos":"neg"}" style="width:${w.toFixed(1)}%"></i></span>
        <span class="dvd mono ${pos?"up":"down"}">${pos?"▲":"▼"} ${pos?"+":"−"}${val(Math.abs(x.d))}</span>
        <span class="dvpct mono">${pct===null?"новий":`${pos?"+":"−"}${Math.abs(pct).toFixed(0)}%`}</span>
        <span class="dvflow mono">${val(r.p[m])} → ${val(r.c[m])}</span></div>`;
    };
    const divider = (su.length&&sd.length)
      ? `<div class="dvsplit"><span>нижче — ті, хто просідає</span></div>` : "";
    box.innerHTML = (su.length?su.map(row).join(""):`<div class="mvempty">Нікого, хто б помітно виріс.</div>`)
      + divider
      + (sd.length?sd.map(row).join(""):`<div class="mvempty">Ніхто помітно не просів.</div>`);

    const rest=Math.max(0,up.length-su.length)+Math.max(0,dn.length-sd.length);
    more.innerHTML = rest ? `<button class="morebtn" type="button">показати ще ${fmtInt(Math.min(rest,24))} з ${fmtInt(rest)} ↓</button>` : "";
    const mb=more.querySelector("button"); if(mb) mb.onclick=()=>{ mvCap+=12; renderMovers(); };
    foot.textContent=`дрібніші за ${val(Math.round(floor))} ${m===5?"":plural(Math.round(floor),["клік","кліки","кліків"])} не показуємо — вони дають шум, а не сигнал`;

    box.querySelectorAll(".dvrow").forEach(el=>el.onclick=()=>{
      const ti=el.dataset.ti; if(ti!=="") state.team=+ti;
      syncTeam(); setFilter("brand", D.offers[+el.dataset.oi]||"");
    });
    renderNoConv(floor);
  }

  // ── клікають, але не конвертять ────────────────────────────────────────────
  // Окреме питання, тому й окрема панель. Той самий бренд у п'яти командах —
  // це один рядок із п'ятьма мітками, а не п'ять однакових рядків.
  function renderNoConv(){
    const list=document.getElementById("ncList"), sub=document.getElementById("ncSub");
    if(!MV){ list.innerHTML=`<div class="mvempty">—</div>`; sub.textContent=""; return; }
    const cf=Math.max(40, MV.rows.reduce((s,r)=>s+r.c[0],0)*0.002);
    const agg=new Map();
    for(const r of MV.rows){
      if(r.c[0]<cf||r.c[1]>0) continue;
      const nm=D.offers[r.oi]||"(без офера)";
      let a=agg.get(nm); if(!a){a={oi:r.oi,clicks:0,prevConv:0,teams:[]};agg.set(nm,a);}
      a.clicks+=r.c[0]; a.prevConv+=r.p[1]; if(r.ti!=null&&!a.teams.includes(r.ti)) a.teams.push(r.ti);
    }
    const rows=[...agg.entries()].sort((a,b)=>b[1].clicks-a[1].clicks).slice(0,12);
    const lost=rows.reduce((s,x)=>s+x[1].clicks,0);
    const totalClicks=MV.rows.reduce((s,r)=>s+r.c[0],0);
    sub.textContent = rows.length
      ? `${fmtInt(lost)} ${plural(lost,["клік","кліки","кліків"])} у нікуди · ${(lost/Math.max(1,totalClicks)*100).toFixed(1)}% трафіку за період`
      : "усі помітні бренди дають конверсії";
    if(!rows.length){ list.innerHTML=`<div class="mvempty">Порожньо — і це добре. 👌</div>`; return; }
    const max=Math.max(1,...rows.map(x=>x[1].clicks));
    list.innerHTML=rows.map(([nm,a])=>`<div class="ncrow" tabindex="0" role="button" data-key="1" data-oi="${a.oi}">
      <span class="ncname">${esc(nm)}${a.teams.length?" "+a.teams.slice(0,4).map(teamChip).join(" "):""}${a.teams.length>4?` <span class="chip">+${a.teams.length-4}</span>`:""}</span>
      <span class="ncv mono">${fmtInt(a.clicks)}</span>
      <span class="nctrack"><i style="width:${(a.clicks/max*100).toFixed(1)}%"></i></span>
      ${a.prevConv>0?`<span class="ncwas">раніше ${fmtInt(a.prevConv)} ${plural(a.prevConv,["конверсія","конверсії","конверсій"])} — щось зламалось</span>`:`<span class="ncwas">конверсій не було й раніше</span>`}</div>`).join("");
    list.querySelectorAll(".ncrow").forEach(el=>el.onclick=()=>setFilter("brand", D.offers[+el.dataset.oi]||""));
  }
  // ── «що змінилось»: короткий висновок людською мовою ───────────────────────
  function renderDigest(){
    const el=document.getElementById("digest"), sub=document.getElementById("dgSub");
    if(!MV){ el.innerHTML=`<li><span class="ic">·</span><span>Замало історії, щоб порівняти два періоди.</span></li>`; sub.textContent=""; return; }
    const w=MV.w; sub.textContent=w.label;
    const q=(s)=>`<span class="q" tabindex="0" role="button" data-key="1" data-b="${esc(s)}">${esc(s)}</span>`;
    const pc=(d,p)=> p>0 ? `${d>=0?"+":"−"}${Math.abs(d/p*100).toFixed(0)}%` : (d>0?"з нуля":"—");
    const li=(ic,html)=>`<li><span class="ic">${ic}</span><span>${html}</span></li>`;
    const out=[];

    const per=seriesData();
    const c=sumRange(per,w.cur[0],w.cur[1]), p=sumRange(per,w.prev[0],w.prev[1]);
    const dirW=(d)=> d>0?`<b class="up">`:(d<0?`<b class="down">`:`<b class="flat">`);
    out.push(li("📊",`Кліки ${dirW(c[0]-p[0])}${pc(c[0]-p[0],p[0])}</b> (${fmtInt(p[0])} → ${fmtInt(c[0])}), `+
      `конверсії ${dirW(c[1]-p[1])}${pc(c[1]-p[1],p[1])}</b>, підтверджений дохід ${dirW(c[5]-p[5])}${pc(c[5]-p[5],p[5])}</b> (${fmtMoney(p[5])} → ${fmtMoney(c[5])}).`));

    // хто з команд рухається найсильніше + головний бренд-драйвер
    if(MV.byTeam){
      const ts=teamSeriesAll();
      const sum=(a,f,t)=>{const s=[0,0,0,0,0,0];for(let i=f;i<=t;i++)for(let j=0;j<6;j++)s[j]+=a[i][j];return s;};
      const drv=new Map();
      for(const r of MV.rows){ if(r.ti==null) continue;
        let a=drv.get(r.ti); if(!a){a=[];drv.set(r.ti,a);} a.push({oi:r.oi,d:r.c[0]-r.p[0]}); }
      const tl=[];
      for(let t=0;t<nTeams;t++){
        const cc=sum(ts[t],w.cur[0],w.cur[1]), pp=sum(ts[t],w.prev[0],w.prev[1]);
        const d=cc[0]-pp[0]; if(pp[0]<50&&cc[0]<50) continue;
        const pct = pp[0]>0 ? d/pp[0]*100 : 100;
        if(Math.abs(pct)<12) continue;
        const list=(drv.get(t)||[]).slice().sort((a,b)=>d>0?b.d-a.d:a.d-b.d);
        const top=list[0];
        tl.push({t,d,pct,cc,pp,top});
      }
      tl.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,3).forEach(x=>{
        const why = x.top && Math.abs(x.top.d)>=Math.abs(x.d)*0.25
          ? ` — головним чином ${q(D.offers[x.top.oi]||"(без офера)")} (${x.top.d>=0?"+":"−"}${fmtInt(Math.abs(x.top.d))})`
          : (x.d<0 ? " — просідання рівномірне, одного винуватця нема" : " — рівномірно по всіх брендах");
        out.push(li(x.d>0?"▲":"▼",`<b>${esc(D.teams[x.t])}</b>: кліки <b class="${x.d>0?"up":"down"}">${pc(x.d,x.pp[0])}</b> (${fmtInt(x.pp[0])} → ${fmtInt(x.cc[0])})${why}.`));
      });
    }else{
      // одна команда у фокусі — показуємо найсильніший приріст і найсильніше просідання
      const srt=MV.rows.slice().sort((x,y)=>(y.c[0]-y.p[0])-(x.c[0]-x.p[0]));
      const flr=Math.max(40,c[0]*0.004), top=srt[0], bot=srt[srt.length-1];
      if(top && top.c[0]-top.p[0]>=flr)
        out.push(li("▲",`Найбільший приріст: ${q(D.offers[top.oi]||"")} <b class="up">+${fmtInt(top.c[0]-top.p[0])}</b> кліків (${fmtInt(top.p[0])} → ${fmtInt(top.c[0])}).`));
      if(bot && bot.p[0]-bot.c[0]>=flr)
        out.push(li("▼",`Найбільше просів: ${q(D.offers[bot.oi]||"")} <b class="down">−${fmtInt(bot.p[0]-bot.c[0])}</b> кліків (${fmtInt(bot.p[0])} → ${fmtInt(bot.c[0])}).`));
    }

    // новачки та ті, хто зник
    const fresh=MV.rows.filter(r=>r.p[0]===0&&r.c[0]>=Math.max(40,c[0]*0.004)).sort((a,b)=>b.c[0]-a.c[0]).slice(0,2);
    fresh.forEach(r=>out.push(li("🆕",`Новий бренд ${q(D.offers[r.oi]||"")}${MV.byTeam&&r.ti!=null?` у <b>${esc(D.teams[r.ti])}</b>`:""}: `+
      `<b>${fmtInt(r.c[0])}</b> кліків, ${r.c[1]?`<b class="up">${fmtInt(r.c[1])}</b> ${plural(r.c[1],["конверсія","конверсії","конверсій"])}`:`<b class="down">жодної конверсії</b>`}.`)));
    const gone=MV.rows.filter(r=>r.c[0]===0&&r.p[0]>=Math.max(60,p[0]*0.006)).sort((a,b)=>b.p[0]-a.p[0]).slice(0,2);
    gone.forEach(r=>out.push(li("💀",`Зник трафік: ${q(D.offers[r.oi]||"")}${MV.byTeam&&r.ti!=null?` (<b>${esc(D.teams[r.ti])}</b>)`:""} — було <b>${fmtInt(r.p[0])}</b> кліків, стало 0.`)));

    // клікають, але не конвертять
    const cf=Math.max(40,c[0]*0.002);
    const nc=MV.rows.filter(r=>r.c[0]>=cf&&r.c[1]===0);
    if(nc.length){
      // один бренд може «мовчати» в кількох командах — рахуємо його один раз
      const agg=new Map();
      for(const r of nc){ const nm=D.offers[r.oi]||"(без офера)";
        let a=agg.get(nm); if(!a){a={clicks:0,teams:new Set()};agg.set(nm,a);} a.clicks+=r.c[0]; if(r.ti!=null)a.teams.add(r.ti); }
      const list=[...agg.entries()].sort((a,b)=>b[1].clicks-a[1].clicks);
      const lost=list.reduce((s,x)=>s+x[1].clicks,0), n=list.length;
      out.push(li("⚠",`<b>${n}</b> ${plural(n,["бренд зібрав","бренди зібрали","брендів зібрали"])} <b>${fmtInt(lost)}</b> `+
        `${plural(lost,["клік","кліки","кліків"])} (${(lost/Math.max(1,c[0])*100).toFixed(0)}% усього трафіку) <b class="down">без жодної конверсії</b>: `+
        list.slice(0,3).map(x=>q(x[0])+(x[1].teams.size>1?` <span style="color:var(--faint)">(у ${x[1].teams.size} ${plural(x[1].teams.size,["команді","командах","командах"])})</span>`:"")).join(", ")+
        (n>3?` та ще ${n-3}`:"")+"."));
    }

    if(out.length===1) out.push(li("·","Жодних помітних зрушень між періодами — все рівно."));
    el.innerHTML=out.join("");
    el.querySelectorAll(".q").forEach(s=>s.onclick=()=>setFilter("brand",s.dataset.b));
  }

  // ── вкладка «Партнерки» ────────────────────────────────────────────────────
  // Перша версія оголошувала «постбеку немає» за порожнім polem postback_url у
  // картці мережі. Перевірка на живих даних це спростувала: під такими
  // мережами конверсії приходять (Asia — 53 за 30 днів, Italy — 52). У Keitaro
  // це поле лише збережений шаблон URL; приймач постбеків — адреса трекера, і
  // мережа може її викликати з порожнім полем.
  //
  // Тому тепер стан визначає реальність, а налаштування лишаються підказкою:
  //   конверсії за період є            → працює;
  //   конверсій 0, але трафіку стільки, що їх мало б бути ≥3 → тиша;
  //   трафіку замало                   → нічого не стверджуємо.
  const NETS = D.nets || [], NOFF = D.noff || [];
  const netOpen = new Set();
  let netFilt = "all", netQ = "";
  let lastConvCache = null;

  function lastConvByOffer(){           // (oi|ti) → індекс останнього дня з конверсією
    if(lastConvCache) return lastConvCache;
    const m=new Map();
    for(const r of D.od){ if(r[3]<=0) continue; const k=r[1]+"|"+r[8];
      const v=m.get(k); if(v===undefined||r[0]>v) m.set(k,r[0]); }
    return (lastConvCache=m);
  }

  // Підказки про налаштування — саме підказки, не вирок.
  function offHints(o){
    const h=[]; const ni=o[3], n=ni>=0?NETS[ni]:null;
    if(ni<0) h.push("без партнерки");
    else{
      if(!n[2]) h.push("URL постбеку не заповнений");
      if(!n[3] && !o[4]) h.push("клік-айді не передається");
    }
    return h;
  }

  function netsData(){
    const from=state.fromIdx, to=state.toIdx;
    const tr=new Map();                 // офер×команда → [кліки, конверсії]
    let totClicks=0, totConv=0;
    for(const r of D.od){ const di=r[0]; if(di<from||di>to) continue; if(!teamOK(r[8])) continue;
      const k=r[1]+"|"+r[8]; let a=tr.get(k); if(!a){a=[0,0];tr.set(k,a);} a[0]+=r[2]; a[1]+=r[3];
      totClicks+=r[2]; totConv+=r[3]; }
    const cr=totClicks>0?totConv/totClicks:0;   // очікувана конверсійність по зрізу
    const lc=lastConvByOffer();
    // Скільки кліків треба, щоб відсутність конверсій щось означала (очікуємо ≥3).
    const silentFloor = cr>0 ? Math.max(100, Math.ceil(3/cr)) : Infinity;

    const rows=NETS.map((n,i)=>({ni:i,name:n[0],ti:n[1],pb:n[2],par:n[3],offers:[],clicks:0,conv:0,withTraf:0,ownMacro:0,last:-1}));
    const extra=new Map();
    const pseudo=(key,ti,name,ghost)=>{
      let r=extra.get(key);
      if(!r){ r={ni:-1,name,ti,pb:0,par:0,offers:[],clicks:0,conv:0,withTraf:0,ownMacro:0,last:-1,virtual:1,ghost:!!ghost}; extra.set(key,r); }
      return r;
    };
    const seen=new Set();
    const push=(r,o)=>{
      const oi=o.oi, k=oi>=0?oi+"|"+o.ti:null;
      const t=k?tr.get(k):null, cl=t?t[0]:0, cv=t?t[1]:0;
      const last=k&&lc.has(k)?lc.get(k):-1;
      r.offers.push({name:o.name, hints:o.hints, clicks:cl, conv:cv, last, silent: cv===0 && cl>=silentFloor});
      r.clicks+=cl; r.conv+=cv; if(cl>0) r.withTraf++; if(o.macro) r.ownMacro++;
      if(last>r.last) r.last=last;
    };
    for(const o of NOFF){
      if(!teamOK(o[2])) continue;
      const ni=o[3];
      const r = ni>=0 ? rows[ni] : pseudo("nonet"+o[2], o[2], "— офери без партнерки —");
      if(!r) continue;
      if(o[0]>=0) seen.add(o[0]+"|"+o[2]);
      push(r,{oi:o[0], ti:o[2], name: o[0]>=0 ? (D.offers[o[0]]||"") : o[1], hints:offHints(o), macro:o[4]});
    }
    // Офери, які є у звіті, але яких немає в довіднику /offers — найчастіше
    // заархівовані. Їх конверсії інакше просто зникали з таблиці.
    for(const [k,v] of tr){
      if(seen.has(k)||v[0]<=0) continue;
      const [oi,ti]=k.split("|").map(Number);
      const r=pseudo("ghost"+ti, ti, "— немає в довіднику Keitaro —", 1);
      seen.add(k);
      push(r,{oi, ti, name:D.offers[oi]||"", hints:["офера немає в довіднику — ймовірно заархівований"], macro:0});
    }

    const all=[...rows.filter(r=>teamOK(r.ti)), ...extra.values()].filter(r=>r.offers.length);
    for(const r of all){
      r.silent = r.conv===0 && r.clicks>=silentFloor;
      r.state = r.conv>0 ? "ok" : (r.silent ? "silent" : "thin");
      r.cfg = r.offers.some(o=>o.hints.length);
    }
    // тиша з найбільшим трафіком — нагору: саме там втрачені гроші
    all.sort((a,b)=>{
      const p=(x)=> x.state==="silent"?2:(x.state==="thin"?0:1);
      if(p(a)!==p(b)) return p(b)-p(a);
      return b.clicks-a.clicks;
    });
    let shown=all;
    if(netQ){ const q=netQ.toLowerCase();
      shown=shown.filter(r=>r.name.toLowerCase().includes(q)||r.offers.some(o=>o.name.toLowerCase().includes(q))); }
    if(netFilt==="silent") shown=shown.filter(r=>r.state==="silent");
    else if(netFilt==="cfg") shown=shown.filter(r=>r.cfg);
    else if(netFilt==="traf") shown=shown.filter(r=>r.clicks>0);
    return {all, shown, silentFloor, cr};
  }

  const NSTATE={
    ok:    {t:"конверсії йдуть", c:"var(--good-ink)", i:"✓"},
    silent:{t:"тиша",            c:"var(--warn)",     i:"⚠"},
    thin:  {t:"мало трафіку",    c:"var(--faint)",    i:"·"},
  };

  function renderNets(){
    const {all:allRows, shown:rows, silentFloor, cr}=netsData();
    const mine=NETS.filter(n=>teamOK(n[1]));
    const silent=allRows.filter(r=>r.state==="silent");
    const silentClicks=silent.reduce((s,r)=>s+r.clicks,0);
    const totClicks=allRows.reduce((s,r)=>s+r.clicks,0);
    const noUrl=mine.filter(n=>!n[2]).length;

    document.getElementById("netKpis").innerHTML=[
      {lbl:"Партнерок",v:fmtInt(mine.length),c:"var(--s1)",sub:`${fmtInt(allRows.filter(r=>!r.virtual&&r.clicks>0).length)} з трафіком за період`},
      {lbl:"Мереж без конверсій",v:fmtInt(silent.length),c:silent.length?"var(--warn)":"var(--good)",
        sub:silent.length?`при трафіку, де конверсії мали б бути`:"трафік скрізь конвертить"},
      {lbl:"Кліків у тиші",v:fmtInt(silentClicks),c:silentClicks?"var(--warn)":"var(--good)",
        sub:totClicks?`${(silentClicks/totClicks*100).toFixed(1)}% трафіку за період`:""},
      {lbl:"URL постбеку не заповнений",v:fmtInt(noUrl)+" / "+fmtInt(mine.length),c:"var(--dim)",
        sub:"довідково: саме по собі це не поломка"},
    ].map(k=>`<div class="kpi" style="--accent:${k.c}"><div class="lbl">${k.lbl}</div>`+
      `<div class="val mono">${k.v}</div>${k.sub?`<div class="dl flat"><span class="sub">${k.sub}</span></div>`:""}</div>`).join("");

    const dayTxt=(i)=> i>=0 ? D.days[i].slice(8,10)+"."+D.days[i].slice(5,7) : "—";
    const head=["Мережа","Стан","Оферів","Кліки","Конверсії","Остання конв.","Налаштування"];
    const cfgCell=(r)=>{
      if(r.ghost) return `<span class="zero">—</span>`;
      const b=[];
      if(r.ni<0) b.push(`<span class="badge warn">без партнерки</span>`);
      else{
        if(!r.pb) b.push(`<span class="badge">URL —</span>`);
        if(!r.par && r.ownMacro<r.offers.length) b.push(`<span class="badge">клік-айді —</span>`);
      }
      return b.length?b.join(" "):`<span class="ok">✓</span>`;
    };
    const body=rows.map(r=>{
      const open=netOpen.has(r.ti+"|"+r.ni+"|"+r.name);
      const st=NSTATE[r.state];
      const main=`<tr class="netrow" tabindex="0" role="button" data-key="1" data-k="${esc(r.ti+"|"+r.ni+"|"+r.name)}">
        <td><span class="caret">${open?"▾":"▸"}</span> <span class="site">${esc(r.name)}</span>`+
        `${(state.team<0&&nTeams>1)?" "+teamChip(r.ti):""}</td>
        <td style="text-align:left;color:${st.c};font-weight:700">${st.i} ${st.t}</td>
        <td class="mono">${fmtInt(r.offers.length)}</td>
        <td class="mono ${r.clicks?"":"zero"}">${r.clicks?fmtInt(r.clicks):"—"}</td>
        <td class="mono ${r.conv?"conv-badge":"zero"}">${r.conv||"0"}</td>
        <td class="mono ${r.last>=0?"":"zero"}">${dayTxt(r.last)}</td>
        <td style="text-align:left">${cfgCell(r)}</td></tr>`;
      if(!open) return main;
      const offs=r.offers.slice().sort((a,b)=>b.clicks-a.clicks).slice(0,200);
      const sub=offs.map(o=>{
        const s=o.conv>0?NSTATE.ok:(o.silent?NSTATE.silent:NSTATE.thin);
        return `<tr class="nolink suboff"><td style="padding-left:30px">${esc(o.name)}</td>
          <td style="text-align:left;color:${s.c}">${s.i} ${s.t}</td>
          <td></td>
          <td class="mono ${o.clicks?"":"zero"}">${o.clicks?fmtInt(o.clicks):"—"}</td>
          <td class="mono ${o.conv?"conv-badge":"zero"}">${o.conv||"0"}</td>
          <td class="mono ${o.last>=0?"":"zero"}">${dayTxt(o.last)}</td>
          <td style="text-align:left;font-size:10.5px;color:var(--faint)">${o.hints.length?esc(o.hints.join(" · ")):"—"}</td></tr>`;
      }).join("");
      const more=r.offers.length>200?`<tr class="nolink suboff"><td colspan="7" class="emptycell">показано 200 з ${fmtInt(r.offers.length)} оферів — звузь пошуком</td></tr>`:"";
      return main+sub+more;
    }).join("");

    const nReal=rows.filter(r=>!r.virtual).length;
    document.getElementById("netSub").textContent =
      `${nReal} ${plural(nReal,["мережа","мережі","мереж"])}${rows.length-nReal?" + офери поза мережами":""} · `+
      `трафік за ${state.mode==="day"?D.days[state.dayIdx]:(state.mode==="all"?"весь період":"останні "+state.mode+" дн")} · `+
      `клікни по рядку, щоб побачити офери`;
    document.getElementById("netTbl").innerHTML=
      `<thead><tr>${head.map((h,i)=>`<th${i===1||i===6?' style="text-align:left"':""}>${h}</th>`).join("")}</tr></thead>`+
      `<tbody>${body||`<tr class="nolink"><td colspan="7" class="emptycell">Нічого не знайдено.</td></tr>`}</tbody>`;
    document.getElementById("netFoot").innerHTML =
      `<b>Стан</b> рахується з реальності: «тиша» — це нуль конверсій при трафіку, де їх мало б бути щонайменше три `+
      `(за середньою конверсійністю ${(cr*100).toFixed(2)}% це від ${fmtInt(silentFloor)} кліків). `+
      `<b>Налаштування</b> — лише підказка: порожній URL постбеку в картці мережі сам по собі не ламає постбеки, `+
      `бо мережа звертається на адресу трекера. Якщо конверсії йдуть — усе працює, хоч поле й порожнє.`;

    document.querySelectorAll("#netTbl .netrow").forEach(tr=>tr.onclick=()=>{
      const k=tr.dataset.k; if(netOpen.has(k)) netOpen.delete(k); else netOpen.add(k); renderNets();
    });
  }
  // ── ручне оновлення даних ──────────────────────────────────────────────────
  // Сторінка статична, бекенду немає. Тому два шляхи: посилання на GitHub
  // Actions (працює завжди) і запуск одним кліком, якщо користувач один раз
  // збереже свій токен — токен лежить ЛИШЕ в localStorage цього браузера.
  const TOKEN_KEY="ktpulse_gh_token";
  const tokGet=()=>{ try{ return localStorage.getItem(TOKEN_KEY)||""; }catch(e){ return ""; } };
  const tokSet=(v)=>{ try{ v?localStorage.setItem(TOKEN_KEY,v):localStorage.removeItem(TOKEN_KEY); }catch(e){} };

  function repoInfo(){
    const h=location.hostname.match(/^([^.]+)\.github\.io$/i);
    if(!h) return null;
    const seg=location.pathname.split("/").filter(Boolean);
    return {owner:h[1], repo: seg[0] || (h[1]+".github.io")};
  }
  const actionsUrl=()=>{ const r=repoInfo();
    return r?`https://github.com/${r.owner}/${r.repo}/actions/workflows/build.yml`:"https://github.com"; };

  const AGE_WARN=14*3600e3, AGE_OLD=30*3600e3;
  function fmtAge(ms){
    const m=Math.round(ms/60000);
    if(m<2) return "щойно";
    if(m<60) return m+" хв тому";
    const h=Math.round(m/60);
    if(h<36) return h+" "+plural(h,["година","години","годин"])+" тому";
    const d=Math.round(h/24);
    return d+" "+plural(d,["день","дні","днів"])+" тому";
  }
  function refreshAge(){
    const btn=document.getElementById("refreshBtn"), lbl=document.getElementById("refreshAge");
    if(!btn||!D.builtAt) return;
    const age=Date.now()-Date.parse(D.builtAt);
    if(!isFinite(age)) return;
    lbl.textContent=fmtAge(age);
    btn.classList.toggle("stale", age>=AGE_WARN && age<AGE_OLD);
    btn.classList.toggle("old", age>=AGE_OLD);
    btn.title = age>=AGE_WARN
      ? `Дані зібрані ${fmtAge(age)} — збірка могла не спрацювати. Клікни, щоб запустити вручну.`
      : `Дані зібрані ${fmtAge(age)}. Клікни, щоб оновити вручну.`;
  }

  const modal=document.getElementById("refreshModal");
  const mBody=document.getElementById("mBody");
  let polling=false;
  const openModal=()=>{ modal.hidden=false; drawModal(); setTimeout(()=>{const i=mBody.querySelector("input,button,a");if(i)i.focus();},30); };
  const closeModal=()=>{ if(!polling) modal.hidden=true; };
  document.getElementById("mClose").onclick=closeModal;
  modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
  addEventListener("keydown",e=>{ if(e.key==="Escape"&&!modal.hidden) closeModal(); });

  function setStatus(html,cls){
    let el=document.getElementById("mStatus");
    if(!el){ el=document.createElement("div"); el.id="mStatus"; el.className="mstatus"; mBody.appendChild(el); }
    el.innerHTML=html; el.style.color=cls||"";
  }

  function drawModal(){
    const has=!!tokGet();
    const age=D.builtAt?fmtAge(Date.now()-Date.parse(D.builtAt)):"невідомо коли";
    mBody.innerHTML=
      `<p>Дані зібрані <b>${esc(D.generated||"")}</b> (${esc(age)}). Збірка запускається щоранку о 06:17, 08:17 і 10:17 за Києвом.</p>`+
      `<p>Якщо прогін підвис або потрібні свіжі цифри просто зараз — запусти вручну.</p>`+
      `<div class="mrow"><a class="mbtn" href="${actionsUrl()}" target="_blank" rel="noopener noreferrer">Відкрити GitHub Actions ↗</a>`+
      `<span class="mnote">далі «Run workflow» → «Run workflow»</span></div>`+
      (has
        ? `<div class="mrow"><button class="mbtn primary" id="mRun" type="button">↻ Запустити звідси</button>`+
          `<button class="mbtn" id="mForget" type="button">Прибрати токен</button></div>`+
          `<p class="mnote">Токен збережений у цьому браузері. Запуск робиться від твого імені через GitHub API.</p>`
        : `<p style="margin-top:16px"><b>Або одним кліком просто звідси.</b> Для цього потрібен персональний токен GitHub. `+
          `Він зберігається <b>лише в цьому браузері</b> (localStorage) і йде тільки на api.github.com.</p>`+
          `<div class="mrow"><input class="minput" id="mTok" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false">`+
          `<button class="mbtn primary" id="mSave" type="button">Зберегти</button></div>`+
          `<p class="mnote"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Створити токен ↗</a> — `+
          `<b>Repository access:</b> тільки цей репозиторій · <b>Permissions → Actions:</b> Read and write. Більше нічого не вмикай. `+
          `Хто має доступ до цього браузера — має доступ і до токена, тож не став його на спільному компʼютері.</p>`);
    const run=document.getElementById("mRun"); if(run) run.onclick=startBuild;
    const forget=document.getElementById("mForget"); if(forget) forget.onclick=()=>{ tokSet(""); drawModal(); };
    const save=document.getElementById("mSave");
    if(save) save.onclick=()=>{ const v=document.getElementById("mTok").value.trim(); if(!v) return; tokSet(v); drawModal(); setStatus("Токен збережено. Тисни «Запустити звідси»."); };
  }

  async function gh(path,init){
    const r=repoInfo(); if(!r) throw new Error("не вдалось визначити репозиторій зі сторінки");
    return fetch(`https://api.github.com/repos/${r.owner}/${r.repo}${path}`,{
      ...(init||{}),
      headers:{ "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
        "Authorization":"Bearer "+tokGet(), ...((init&&init.headers)||{}) },
    });
  }

  async function startBuild(){
    const btn=document.getElementById("refreshBtn");
    polling=true; btn.classList.add("busy");
    const run=document.getElementById("mRun"); if(run) run.disabled=true;
    try{
      setStatus("Запускаю збірку…");
      const res=await gh("/actions/workflows/build.yml/dispatches",{method:"POST",body:JSON.stringify({ref:"main"})});
      if(res.status===401||res.status===403){
        setStatus(`Токен не підійшов (${res.status}). Перевір права: Actions — Read and write, і що доступ виданий саме цьому репозиторію.`,"var(--crit-ink)");
        return;
      }
      if(res.status!==204){
        setStatus(`GitHub відповів ${res.status}. Запусти через <a href="${actionsUrl()}" target="_blank" rel="noopener noreferrer">Actions ↗</a>.`,"var(--crit-ink)");
        return;
      }
      setStatus("Збірка поставлена в чергу…");
      const t0=Date.now();
      let runUrl=actionsUrl();
      for(let i=0;i<75;i++){            // до ~10 хвилин
        await new Promise(r=>setTimeout(r, i<3?4000:8000));
        let j=null;
        try{
          const q=await gh("/actions/runs?event=workflow_dispatch&per_page=1");
          if(q.ok) j=(await q.json()).workflow_runs?.[0];
        }catch(e){}
        const el=Math.round((Date.now()-t0)/1000);
        const mm=String(Math.floor(el/60)).padStart(1,"0"), ss=String(el%60).padStart(2,"0");
        if(!j){ setStatus(`Чекаю на старт… ${mm}:${ss}`); continue; }
        runUrl=j.html_url||runUrl;
        if(j.status!=="completed"){ setStatus(`Збірка виконується… ${mm}:${ss} · <a href="${runUrl}" target="_blank" rel="noopener noreferrer">лог ↗</a>`); continue; }
        if(j.conclusion==="success"){
          setStatus("Готово. Перезавантажую сторінку…","var(--good-ink)");
          setTimeout(()=>location.reload(), 2500);
        }else{
          setStatus(`Збірка завершилась як «${esc(j.conclusion||"?")}». <a href="${runUrl}" target="_blank" rel="noopener noreferrer">Відкрити лог ↗</a>`,"var(--crit-ink)");
        }
        return;
      }
      setStatus(`Збірка триває довше за звичайне. <a href="${runUrl}" target="_blank" rel="noopener noreferrer">Подивитись лог ↗</a>`,"var(--warn)");
    }catch(e){
      setStatus(`Не вдалось: ${esc(String(e.message||e))}. Запусти через <a href="${actionsUrl()}" target="_blank" rel="noopener noreferrer">Actions ↗</a>.`,"var(--crit-ink)");
    }finally{
      polling=false; btn.classList.remove("busy");
      const r2=document.getElementById("mRun"); if(r2) r2.disabled=false;
    }
  }

  document.getElementById("refreshBtn").onclick=()=>{
    if(tokGet()){ openModal(); startBuild(); } else openModal();
  };
  refreshAge();
  setInterval(refreshAge, 60000);

  function render(){
    setRange(); renderChip();
    const f=state.filter;
    const scopeTxt = f.active ? ` · ${f.type==="brand"?"бренд":"сайт"} “${esc(f.q)}”` : "";
    const rangeTxt = state.mode==="day"?`день ${D.days[state.dayIdx]}`:state.mode==="all"?"весь період":`останні ${state.mode} дн`;
    document.getElementById("chartTitle").textContent=`Трафік · ${rangeTxt}${scopeTxt}`;
    tblCap={site:TBL_STEP,brand:TBL_STEP}; mvCap=8;
    if(state.tab==="net"){ renderNets(); return; }
    MV=moversData();
    renderKpis(); renderDigest(); renderTeamCards(); renderMovers();
    renderChart(); renderSites(); renderBrands(); renderPosPages(); renderConv(); renderGeo(); renderPrefOs();
  }

  // початковий стан з URL: #brand:назва / #site:назва / #page:сторінка (можна через ;)
  (function initFromHash(){
    const h=decodeURIComponent(location.hash.replace(/^#/,""));
    h.split(";").forEach(part=>{
      const m=part.match(/^(site|brand|page):(.+)$/);
      if(!m) return;
      if(m[1]==="page"){ const gi=D.pages.indexOf(m[2]); if(gi>=0) state.selectedPage=gi; }
      else { state.filter.type=m[1]; state.filter.match="partial"; state.filter.q=m[2]; fq.value=m[2]; }
    });
    const tm=h.match(/(?:^|;)team:(\d+)/); if(tm){ const t=+tm[1]; if(t>=0&&t<nTeams) state.team=t; }
    if(/(?:^|;)tab:net/.test(h)) state.tab="net";
    if(state.filter.q) computeFilter();
  })();

  syncSeg(); syncFilterUI(); syncTeam(); syncMv(); syncTab(); syncNetFilt(); render();
}
</script>
<script>
// ── bootstrap: plaintext (локально) / пароль + AES-GCM (онлайн) ───────────────
(async function(){
  const app = document.getElementById("app");

  // Локальний режим: дані вшиті напряму
  if (window.KT_DATA){ KT_boot(window.KT_DATA); return; }

  const enc = window.KT_ENC;
  if (!enc){
    app.innerHTML = `<div class="empty">
      <h1>📊 Дашборд ще не наповнено даними</h1>
      <p>Це шаблон. Щоб завантажити історію з Keitaro, запусти в цій папці:</p>
      <p><code>node fetch.mjs</code></p></div>`;
    return;
  }

  const KDF = window.KT_KDF || { iter: 200000 };
  const b64ToBytes = (b64)=>{ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };

  async function decrypt(password){
    const raw = b64ToBytes(enc);
    const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
    const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt, iterations:KDF.iter, hash:"SHA-256" },
      keyMat, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function loginScreen(msg){
    app.innerHTML = `<div class="empty">
      <h1>🔒 Keitaro · Pulse</h1>
      <p>Введи пароль, щоб відкрити звіт.</p>
      <form id="lf" style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap">
        <input id="lp" type="password" autocomplete="current-password" placeholder="пароль"
          style="background:var(--bg2);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:15px;padding:11px 15px;border-radius:10px;min-width:240px">
        <button type="submit"
          style="background:linear-gradient(135deg,var(--blue),#3a7fe0);color:#08101f;border:0;font:inherit;font-weight:700;font-size:15px;padding:11px 22px;border-radius:10px;cursor:pointer">Увійти</button>
      </form>
      <div id="lerr" style="color:var(--red);font-size:13px;margin-top:14px;min-height:18px">${msg||""}</div></div>`;
    const form=document.getElementById("lf"), inp=document.getElementById("lp");
    inp.focus();
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const btn=form.querySelector("button"); btn.disabled=true; btn.textContent="Розшифровую…";
      try{
        const D = await decrypt(inp.value);
        try{ sessionStorage.setItem("kt_pw", inp.value); }catch(_){}
        KT_boot(D);
      }catch(err){
        loginScreen("Невірний пароль. Спробуй ще раз.");
      }
    });
  }

  // авто-вхід у межах вкладки (пароль зберігається лише в sessionStorage)
  let saved=null; try{ saved=sessionStorage.getItem("kt_pw"); }catch(_){}
  if (saved){
    try{ KT_boot(await decrypt(saved)); return; }
    catch(_){ try{ sessionStorage.removeItem("kt_pw"); }catch(__){} }
  }
  loginScreen("");
})();
</script>
