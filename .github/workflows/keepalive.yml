# Keeps the scheduled builds alive.
#
# GitHub disables cron on a repository with no activity for 60 days. The last
# commit here was 2026-08-05; sixty days later, on 2026-10-04, the dashboard
# stopped updating. Nothing was broken — the schedule was simply switched off.
#
# This pushes a dated line every three weeks, which is repository activity and
# resets that clock. The push must be authored by a PAT: commits made with the
# built-in GITHUB_TOKEN are widely reported not to count for this rule.
#
# Setup, once:
#   1. github.com/settings/personal-access-tokens/new
#      Fine-grained, this repository only, Contents: Read and write,
#      expiry: 1 year (put a calendar note for the renewal).
#   2. Repo → Settings → Secrets and variables → Actions → New secret
#      Name: KEEPALIVE_TOKEN     Value: the token
#   3. Actions → Keepalive → Run workflow, to confirm it works.

name: Keepalive

on:
  schedule:
    - cron: "41 4 */21 * *"   # every 21 days, well inside the 60-day window
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.KEEPALIVE_TOKEN || github.token }}

      - name: Record a heartbeat
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.KEEPALIVE_TOKEN }}" ]; then
            echo "::warning::KEEPALIVE_TOKEN is not set. Pushing with the"
            echo "::warning::built-in token, which may not reset the 60-day"
            echo "::warning::inactivity clock. See the comments in this file."
          fi
          mkdir -p .github
          date -u +"last keepalive: %Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name  "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -qm "chore: keepalive $(date -u +%Y-%m-%d)"
          git push -q
          echo "pushed — the 60-day clock is reset"
