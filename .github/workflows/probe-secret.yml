# Разова діагностика: які секрети та змінні взагалі видно цьому job.
# Друкує ТІЛЬКИ імена й довжину значення — самі значення не виводяться,
# і GitHub у будь-якому разі маскує їх у логах.
name: Probe secret names
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Імена доступних секретів
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
          KT_JIRA: ${{ secrets.KT_JIRA }}
        run: |
          echo "— секрети, видимі цьому job:"
          echo "$ALL_SECRETS" | jq -r 'to_entries[] | "   \(.key)  (довжина \(.value|length))"' | sort
          echo "— змінні (vars):"
          echo "$ALL_VARS" | jq -r 'to_entries[] | "   \(.key)  (довжина \(.value|length))"' | sort
          echo "— перевірка KT_JIRA:"
          if [ -n "${{ secrets.KT_JIRA }}" ]; then
            echo "   secrets.KT_JIRA заданий"
            J="$KT_JIRA" node -e 'const s=process.env.J||"";try{const o=JSON.parse(s);console.log("   JSON валідний, ключі:",Object.keys(o).join(", "));for(const k of ["site","email","token","project"])console.log("     "+k+": "+(o[k]?("є, довжина "+String(o[k]).length):"ПОРОЖНЬО"))}catch(e){console.log("   не парситься як JSON:",e.message)}' 
          else
            echo "   secrets.KT_JIRA ПОРОЖНІЙ або не існує"
          fi
        continue-on-error: true
