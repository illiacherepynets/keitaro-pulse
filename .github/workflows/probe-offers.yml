# Разовий діагностичний прогін: друкує СХЕМУ (назви полів і лічильники)
# офферів та партнерських мереж. Нічого не публікує і не чіпає Pages.
name: Probe offers schema
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node tools/probe-offers.mjs
        env:
          KT_TEAMS: ${{ secrets.KT_TEAMS }}
