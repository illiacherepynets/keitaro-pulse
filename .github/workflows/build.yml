name: Build & Deploy Keitaro Pulse

on:
  schedule:
    # GitHub НЕ гарантує час запуску cron: 04.08.2026 прогін стартував о 10:59 UTC
    # замість 07:23 (затримка 3.5 год), 05.08.2026 слот 07:23 не спрацював зовсім.
    # Тому стратегія: запускатись ЗАРАННЯ і кількома слотами, щоб затримка встигла
    # «розсмоктатись» до 10:00 за Києвом. Ранкові UTC-години менш завантажені.
    # Дані від часу запуску не залежать: INCLUDE_TODAY=false → звіт завжди «по вчора
    # включно», тож збірка о 06:00 і о 10:00 дає ІДЕНТИЧНИЙ результат.
    - cron: "17 3 * * *"   # 06:17 Київ (літо) — основний; навіть +2 год затримки = до 08:20
    - cron: "17 5 * * *"   # 08:17 Київ — перший резерв
    - cron: "17 7 * * *"   # 10:17 Київ — останній резерв
    # Повтори безпечні: діапазон днів той самий, білд ідемпотентний.
  workflow_dispatch: {}   # кнопка "Run workflow" для ручного запуску

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Без ліміту прогін, що завис на мовчазному інстансі, займав слот до 6 годин
    # і блокував наступні. Нормальна збірка — близько 80 секунд.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dashboard
        env:
          KT_TEAMS: ${{ secrets.KT_TEAMS }}
          KT_PASSWORD: ${{ secrets.KT_PASSWORD }}
          KT_OUT: public/index.html
        run: node fetch.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
