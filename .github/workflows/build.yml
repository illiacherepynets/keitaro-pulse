name: Build & Deploy Keitaro Pulse

on:
  schedule:
    # УВАГА: рівну годину ("0 7") НЕ використовуємо — це пік навантаження GitHub,
    # такі прогони затримуються, а інколи взагалі не запускаються (перевірено 04.08.2026).
    # 07:23 UTC = 10:23 Київ (літо) / 09:23 (зима) — основний запуск.
    - cron: "23 7 * * *"
    # Резерв: якщо GitHub «проглитнув» перший слот, о 11:23 Київ буде повторна спроба.
    # Прогін ідемпотентний (INCLUDE_TODAY=false → той самий діапазон днів), тож повтор безпечний.
    - cron: "23 8 * * *"
  workflow_dispatch: {}   # кнопка "Run workflow" для ручного запуску

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dashboard
        env:
          KT_TEAMS: ${{ secrets.KT_TEAMS }}
          KT_PASSWORD: ${{ secrets.KT_PASSWORD }}
          KT_OUT: public/index.html
        run: node fetch.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
