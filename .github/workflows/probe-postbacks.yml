name: Probe postbacks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node tools/probe-postbacks.mjs
        env:
          KT_TEAMS: ${{ secrets.KT_TEAMS }}
