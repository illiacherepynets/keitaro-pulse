name: Перевірка ТДС-лінків

# Запускається ТІЛЬКИ вручну. Резидентський трафік DataImpulse платний, а сотні
# лінків щоночі — це гігабайти намарно: ТДС ламається не щодня, а після правок
# у афки або бану домена. Тому перевірка «за потреби», як і просив замовник.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Що перевіряти: all · гео (IT, IT,DK) · назва команди (Italy) · кампанія (camp:1234) · будь-яке поєднання через кому'
        default: 'all'
      limit:
        description: 'Максимум лінків за прогін (страховка від зайвого трафіку)'
        default: '400'
      threads:
        description: 'Скільки лінків перевіряти одночасно (більше — швидше, але проксі має свій ліміт)'
        default: '10'
      ua:
        description: 'З якого девайса дивитись'
        type: choice
        options: [mobile, desktop]
        default: mobile
      selftest:
        description: 'Самоперевірка проксі замість лінків: список країн, напр. it,dk,es'
        default: ''
      probe:
        description: 'Разовий зонд Keitaro: показати, які поля віддає API (нічого не перевіряє)'
        default: ''

permissions:
  contents: write     # треба, щоб покласти data/tds.enc назад у репозиторій
  pages: write
  id-token: write

jobs:
  check:
    name: Перевірка через резидентські проксі
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Власна група: збірка дашборда не повинна гасити довгий прогін перевірки.
    concurrency:
      group: tds-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Перевірити лінки
        env:
          KT_TEAMS: ${{ secrets.KT_TEAMS }}
          KT_PROXY: ${{ secrets.KT_PROXY }}
          KT_PASSWORD: ${{ secrets.KT_PASSWORD }}
          TDS_SCOPE: ${{ inputs.scope }}
          TDS_LIMIT: ${{ inputs.limit }}
          TDS_UA: ${{ inputs.ua }}
          TDS_THREADS: ${{ inputs.threads }}
          TDS_SELFTEST: ${{ inputs.selftest }}
          TDS_PROBE: ${{ inputs.probe }}
        run: node tds.mjs
      - name: Зберегти результат
        if: inputs.selftest == '' && inputs.probe == ''
        run: |
          # Прогін триває хвилинами, і за цей час у main цілком може лягти
          # чужий коміт — тоді push відхиляється і результати тринадцяти
          # хвилин роботи просто зникають. Саме так і сталось.
          # Тому: відкладаємо свій файл, стаємо рівно на origin/main,
          # повертаємо файл і пробуємо знову. Конфлікт неможливий — ми
          # чіпаємо один файл і завжди беремо свіжу версію, свою.
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/tds.enc "$RUNNER_TEMP/tds.enc"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data && cp "$RUNNER_TEMP/tds.enc" data/tds.enc
            git add data/tds.enc
            if git diff --staged --quiet; then echo "Результат не змінився — комітити нічого"; exit 0; fi
            git commit -m "ТДС: результати перевірки ${{ inputs.scope }}"
            if git push; then echo "Збережено з $i спроби"; exit 0; fi
            echo "Push відхилено, спроба $i — хтось випередив, пробую ще"
            sleep $((5 * i))
          done
          echo "::error::не вдалось зберегти результат за 5 спроб"
          exit 1

  publish:
    name: Перезібрати дашборд
    needs: check
    if: inputs.selftest == '' && inputs.probe == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # саме той коміт, що щойно приніс свіжий tds.enc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dashboard
        env:
          KT_TEAMS: ${{ secrets.KT_TEAMS }}
          KT_PASSWORD: ${{ secrets.KT_PASSWORD }}
          KT_JIRA: ${{ secrets.KT_JIRA }}
          KT_OUT: public/index.html
        run: node fetch.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
